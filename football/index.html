function timeline(events, homeId){
  const rows = [];
  for (const e of events){
    const t = e.type?.type || '';
    const min = e.clock?.displayValue || '';
    const side = e.team?.id === homeId ? 'l' : 'r';
    const p = e.participants || [];
    let icon = '', main = '', sub = '';
    if (t === 'halftime'){ rows.push(`<div class="ev divider">Halbzeit</div>`); continue; }
    if (t === 'end-regular-time'){ rows.push(`<div class="ev divider">Abpfiff</div>`); continue; }
    if (t.startsWith('goal') || t === 'own-goal' || t.startsWith('penalty---scored') || (e.scoringPlay && !e.shootout)){
      icon = '<span class="ic">⚽</span>';
      main = p[0]?.athlete?.displayName || 'Tor';
      sub = t === 'own-goal' ? 'Eigentor' : t.includes('penalty') ? 'Elfmeter' : (p[1] ? `Vorlage: ${p[1].athlete.displayName}` : (t.includes('header') ? 'Kopfball' : 'Tor'));
    } else if (t === 'yellow-card'){
      icon = '<span class="ic"><span class="card-y"></span></span>'; main = p[0]?.athlete?.displayName || 'Gelb'; sub = 'Gelbe Karte';
    } else if (t === 'red-card' || t.includes('red')){
      icon = '<span class="ic"><span class="card-r"></span></span>'; main = p[0]?.athlete?.displayName || 'Rot'; sub = t.includes('yellow') ? 'Gelb-Rot' : 'Rote Karte';
    } else if (t === 'substitution'){
      const mm = (e.text || '').match(/\.\s*(.+?) replaces (.+?)\.?$/);
      icon = '<span class="ic" style="font-size:13px">⇄</span>';
      main = `<span class="sub-i">↑</span> ${esc(mm ? mm[1] : (p[0]?.athlete?.displayName || ''))}`;
      sub = `<span class="sub-o">↓</span> ${esc(mm ? mm[2] : (p[1]?.athlete?.displayName || ''))}`;
      rows.push(evRow(side, min, icon, main, sub, true)); continue;
    } else continue;
    rows.push(evRow(side, min, icon, esc(main), esc(sub), true));
  }
  return rows.length ? `<div class="timeline glass">${rows.join('')}</div>` : emptyBox('⏱️', 'Noch keine Ereignisse');
}
function evRow(side, min, icon, main, sub){
  const who = `<span class="who"><b>${main}</b><small>${sub}</small></span>`;
  return `<div class="ev">
    <div class="l">${side === 'l' ? who + icon : ''}</div>
    <div class="min">${esc(min)}</div>
    <div class="r">${side === 'r' ? icon + who : ''}</div>
  </div>`;
}

function statsView(teams, homeId, m){
  const H = teams.find(t => t.team?.id === homeId) || teams[0];
  const A = teams.find(t => t !== H) || teams[1];
  const get = (t, n) => t?.statistics?.find(s => s.name === n)?.displayValue;
  const rows = [
    ['possessionPct','Ballbesitz','%'], ['totalShots','Schüsse'], ['shotsOnTarget','Schüsse aufs Tor'],
    ['wonCorners','Ecken'], ['totalPasses','Pässe'], ['accuratePasses','Angekommene Pässe'],
    ['foulsCommitted','Fouls'], ['offsides','Abseits'], ['saves','Paraden'],
    ['yellowCards','Gelbe Karten'], ['redCards','Rote Karten'],
  ].map(([n, label, unit = '']) => {
    const h = parseFloat(get(H, n)), a = parseFloat(get(A, n));
    if (isNaN(h) && isNaN(a)) return '';
    const hv = isNaN(h) ? 0 : h, av = isNaN(a) ? 0 : a, tot = hv + av || 1;
    return `<div class="stat">
      <div class="top"><span>${hv}${unit}</span><span>${label}</span><span>${av}${unit}</span></div>
      <div class="bars"><div><i class="hb" style="width:0" data-w="${hv/tot*100}%"></i></div><div><i class="ab" style="width:0" data-w="${av/tot*100}%"></i></div></div>
    </div>`;
  }).join('');
  const hc = m.home.color ? '#' + m.home.color : '';
  let ac = m.away.color ? '#' + m.away.color : '';
  if (ac && hc && ac.toLowerCase() === hc.toLowerCase()) ac = '#8e8e93';
  return `<div class="stats glass" style="${hc ? `--home-c:${esc(hc)};` : ''}${ac ? `--away-c:${esc(ac)}` : ''}">
    <div class="stat" style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:var(--text-2)">
      <span style="display:flex;gap:8px;align-items:center">${img(m.home.logo,'logo xs')}${esc(m.home.name)}</span>
      <span style="display:flex;gap:8px;align-items:center">${esc(m.away.name)}${img(m.away.logo,'logo xs')}</span>
    </div>${rows}</div>`;
}

/* ---------- player photos (TheSportsDB cut-outs, cached per ESPN athlete id) ---------- */
const PHOTO_KEY = 'fb.photos2';                     // v2: verified names + last-name fallback
const photoMem = store.get(PHOTO_KEY, {});
const photoQueue = [];
let photoWorkers = 0, photoSaveT, tsdbStamps = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fold = x => norm(String(x || '').replace(/ß/g, 'ss').replace(/[ðÐ]/g, 'd').replace(/[þÞ]/g, 'th').replace(/[øØ]/g, 'o').replace(/[æÆ]/g, 'ae'))
  .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function samePerson(cand, name){
  const a = fold(cand), b = fold(name); if (!a || !b) return false; if (a === b) return true;
  const aw = a.split(' '), bw = b.split(' ');
  return aw.includes(bw[bw.length - 1]) && (bw.length === 1 || aw.some(w => w[0] === bw[0][0]));
}
function sameTeam(cand, team){
  const a = fold(cand); if (!a) return false;
  const words = fold(team).split(' ').filter(w => w.length >= 4 && !/^(club|city|united|sport|verein|1846|1899|1904)$/.test(w));
  return words.some(w => a.includes(w));
}
async function tsdbSearch(q){                       // free API: stay below ~30 requests per minute
  for (;;){
    const now = Date.now(); tsdbStamps = tsdbStamps.filter(t => now - t < 60000);
    if (tsdbStamps.length < 25) break;
    await sleep(60050 - (now - tsdbStamps[0]));
  }
  tsdbStamps.push(Date.now());
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p=${encodeURIComponent(q)}`);
  if (r.status === 429){ for (let i = 0; i < 25; i++) tsdbStamps.push(Date.now()); return tsdbSearch(q); }
  const d = await r.json();
  return (d.player || []).filter(x => x.strSport === 'Soccer');
}
const tsdbImg = x => x && (x.strCutout || x.strThumb || x.strRender);
async function lookupPhoto({ name, team, fallback }){
  try{
    const l1 = await tsdbSearch(name);
    let hit = l1.find(x => tsdbImg(x) && samePerson(x.strPlayer, name));
    if (!hit){                                       // spelling variants: search the surname, keep the one from this club
      const last = fold(name).split(' ').pop();
      if (last && last.length >= 3){
        const l2 = await tsdbSearch(last);
        hit = l2.find(x => tsdbImg(x) && sameTeam(x.strTeam, team) && fold(x.strPlayer).split(' ').includes(last))
           || l2.find(x => tsdbImg(x) && samePerson(x.strPlayer, name));
      }
    }
    return hit ? tsdbImg(hit) + '/small' : (fallback || null);
  } catch { return fallback || null; }
}
function playerPhoto(id, name, team, fallback){
  const c = photoMem[id];
  if (c && (c.u || Date.now() - c.t < 7 * 864e5)) return Promise.resolve(c.u || fallback || null);
  return new Promise(res => { photoQueue.push({ id, name, team, fallback, res }); pumpPhotos(); });
}
function pumpPhotos(){
  while (photoWorkers < 3 && photoQueue.length){
    const job = photoQueue.shift(); photoWorkers++;
    lookupPhoto(job).then(u => {
      photoMem[job.id] = { u: u && u !== job.fallback ? u : null, t: Date.now() };
      clearTimeout(photoSaveT); photoSaveT = setTimeout(() => store.set(PHOTO_KEY, photoMem), 800);
      job.res(u);
    }).finally(() => { photoWorkers--; pumpPhotos(); });
  }
}
/* fill every <img data-pid> inside root with the player's photo once it is known */
function hydratePhotos(root){
  root.querySelectorAll('img[data-pid]').forEach(im => {
    playerPhoto(im.dataset.pid, im.dataset.pname, im.dataset.pteam, im.dataset.pfb).then(u => {
      if (!u || !im.isConnected) return;
      im.onload = () => im.classList.add('ok'); im.onerror = () => im.remove(); im.src = u;
    });
  });
}

/* ---------- lineup: both teams facing each other in their real formation ---------- */
function posDepth(a){
  a = (a || '').toUpperCase();
  if (a === 'G' || a === 'GK') return 0;
  if (/WB/.test(a)) return 1.5;
  if (/^(CD|CB|LB|RB|SW|D\b|D-)/.test(a)) return 1;
  if (/^(DM|CDM)/.test(a)) return 2;
  if (/^(CM|LM|RM|M\b|M-)/.test(a)) return 3;
  if (/^(AM|CAM|LW|RW)/.test(a)) return 4;
  if (/^(CF|SS)/.test(a)) return 5;
  if (/^(F|ST|S\b)/.test(a)) return 6;
  return 3;
}
function posSide(a){                       // -2 left … +2 right, from the team's own view
  a = (a || '').toUpperCase();
  if (/-L$/.test(a)) return -1;
  if (/-R$/.test(a)) return 1;
  if (/^L(B|M|W|WB|F|CB|CM|AM)?$/.test(a) && a !== 'L') return -2;
  if (/^R(B|M|W|WB|F|CB|CM|AM)?$/.test(a) && a !== 'R') return 2;
  return 0;
}
function formationLines(starters, formation){
  const gk = starters.filter(p => posDepth(p.position?.abbreviation) === 0);
  const keeper = gk[0] || starters.slice().sort((a, b) => (+a.formationPlace || 99) - (+b.formationPlace || 99))[0];
  const out = starters.filter(p => p !== keeper)
    .sort((a, b) => posDepth(a.position?.abbreviation) - posDepth(b.position?.abbreviation) || (+a.formationPlace || 99) - (+b.formationPlace || 99));
  const counts = String(formation || '').split('-').map(Number).filter(n => n > 0);
  let lines = [];
  if (counts.length && counts.reduce((x, y) => x + y, 0) === out.length){
    let i = 0; lines = counts.map(c => out.slice(i, i += c));
  } else {                                  // no/odd formation: group by role
    const by = new Map(); out.forEach(p => { const d = Math.round(posDepth(p.position?.abbreviation)); (by.get(d) || by.set(d, []).get(d)).push(p); });
    lines = [...by.keys()].sort((a, b) => a - b).map(k => by.get(k));
  }
  lines = lines.map(l => l.slice().sort((a, b) => posSide(a.position?.abbreviation) - posSide(b.position?.abbreviation)));
  return { keeper, lines };
}
function posDE(p){
  const n = p?.name || p?.displayName || '';
  if (POS_DETAIL[n]) return POS_DETAIL[n];
  const side = / Right$/.test(n) || /^Right /.test(n) && !POS_DETAIL[n] ? ' (rechts)' : / Left$/.test(n) ? ' (links)' : '';
  const core = n.replace(/ (Right|Left)$/, '').replace(/^Center (Right|Left) /, 'Center ');
  const map = { 'Attacking Midfielder':'Offensives Mittelfeld', 'Defensive Midfielder':'Defensives Mittelfeld', 'Center Defender':'Innenverteidiger',
    'Center Midfielder':'Zentrales Mittelfeld', 'Center Forward':'Stürmer', 'Midfielder':'Mittelfeld', 'Defender':'Verteidiger', 'Forward':'Stürmer' };
  const sideCB = /^Center (Right|Left) /.test(n) ? (/Right/.test(n) ? ' (rechts)' : ' (links)') : '';
  return map[core] ? map[core] + (side || sideCB) : (POS[n] || n);
}
const shortName = n => { const w = String(n || '').trim().split(/\s+/); return w.length > 1 ? w.slice(1).join(' ').length > 12 ? w[w.length - 1] : w.slice(1).join(' ') : w[0] || ''; };
const readableOn = hex => lumOf(hex) > .6 ? '#111' : '#fff';

function lineups(rosters, keyEvents = [], m = null){
  const rs = rosters.filter(r => (r.roster || []).some(p => p.starter));
  if (!rs.length) return emptyBox('📋', 'Noch keine Aufstellung', 'Die Aufstellungen erscheinen kurz vor Anpfiff.');
  const home = rs.find(r => r.homeAway === 'home') || rs[0], away = rs.find(r => r !== home);

  // events per player
  const ev = {};
  const bump = (id, k) => { if (!id) return; (ev[id] ||= { g:0, og:0, y:0, r:0 })[k]++; };
  (keyEvents || []).forEach(e => {
    const t = e.type?.type || '', pid = e.participants?.[0]?.athlete?.id;
    if (t === 'own-goal') bump(pid, 'og');
    else if ((t.startsWith('goal') || t.startsWith('penalty---scored') || e.scoringPlay) && !e.shootout) bump(pid, 'g');
    else if (t === 'yellow-card') bump(pid, 'y');
    else if (t.includes('red')) bump(pid, 'r');
  });

  // team colours (away gets a neutral kit if both are alike)
  let hc = '#' + (m?.home?.color || 'dc052d').replace('#', ''), ac = '#' + (m?.away?.color || '1c1c1e').replace('#', '');
  const usableKit = c => /^#[0-9a-f]{6}$/i.test(c);
  if (!usableKit(hc)) hc = '#0a84ff'; if (!usableKit(ac)) ac = '#1c1c1e';
  if (Math.abs(lumOf(hc) - lumOf(ac)) < .12 && hueDist(rgbHsl(...hexRgb(hc))[0], rgbHsl(...hexRgb(ac))[0]) < 40) ac = lumOf(hc) > .5 ? '#1c1c1e' : '#f2f2f7';

  const teamName = r => tn(r.team?.displayName || '');
  /* geometry in pixels so that circles and names can never overlap:
     row gap ≥ block height (photo + name), column gap ≥ name width, nothing leaves the pitch */
  const W = Math.max(260, Math.min(innerWidth, 760) - 32 - 20), NAME_H = 15 + 4, MIN_PS = 28;
  const fit = (n, H, minPs = MIN_PS) => {
    for (let ps = 42; ps >= minPs; ps--){
      const block = ps + NAME_H;
      const gkY = 100 - ((block / 2 + 6) / H) * 100;           // keeper fully inside the pitch
      const gap = (gkY - 56) / Math.max(1, n);                 // front row stays at 56 % (opponent at 44 %)
      if (gap / 100 * H >= block + 7) return { ps, gkY, gap };
    }
    return null;
  };
  // the pitch grows taller (instead of shrinking photos further) when a formation needs more rows than fit
  const rowsOf = r => r ? formationLines(r.roster.filter(p => p.starter), r.formation).lines.length : 0;
  const fitsAll = (H, minPs) => fit(rowsOf(home), H, minPs) && (!away || fit(rowsOf(away), H, minPs));
  let H = W * 1.7;
  // prefer big photos on a slightly taller pitch; shrink photos only when the pitch would get too long
  for (const minPs of [38, 34, 30, MIN_PS]){
    let h = W * 1.7;
    while (!fitsAll(h, minPs) && h < W * (minPs === MIN_PS ? 3 : minPs === 34 ? 2.3 : 2.1)) h *= 1.03;
    if (fitsAll(h, minPs)){ H = h; break; }
  }
  const geo = n => fit(n, H) || fit(n, H * 1.2);
  const player = (p, x, y, r, tc, size, pw = 76) => {
    const a = p.athlete || {}, e = ev[a.id] || {};
    const b = [
      e.g ? `<i>⚽${e.g > 1 ? e.g : ''}</i>` : '', e.og ? `<i title="Eigentor">ET</i>` : '',
      e.r ? `<i class="card r"></i>` : e.y ? `<i class="card y"></i>` : '',
      p.subbedOut ? `<i class="out">↓</i>` : '',
    ].join('');
    return `<div class="pl" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;--tc:${tc};--tn:${readableOn(tc)};--ps:${size}px;--pw:${pw.toFixed(0)}px;--fs:${pw < 58 ? 9.5 : 10.5}px" data-ply="${esc(a.id)}">
      <div class="ph"><div class="face"><img alt="" data-pid="${esc(a.id)}" data-pname="${esc(a.displayName)}" data-pteam="${esc(r.team?.displayName || '')}" data-pfb="${esc(a.headshot?.href || '')}"></div>
        <span class="no">${esc(p.jersey || '')}</span><b class="num">${esc(p.jersey || '')}</b>${b ? `<span class="bdg">${b}</span>` : ''}</div>
      <div class="pn">${esc(shortName(a.displayName))}</div></div>`;
  };
  const half = (r, tc, top) => {
    const { keeper, lines } = formationLines(r.roster.filter(p => p.starter), r.formation);
    const n = lines.length;
    const widest = Math.max(1, ...lines.map(l => l.length));
    const colGap = k => k > 1 ? Math.min(22, 80 / (k - 1)) : 0;
    const g = geo(n);
    const size = Math.min(g.ps, widest > 1 ? Math.floor(colGap(widest) / 100 * W) - 8 : 42);
    const place = (x, y) => top ? [100 - x, 100 - y] : [x, y];       // away team attacks downwards
    let html = keeper ? player(keeper, ...place(50, g.gkY), r, tc, size, 84) : '';
    lines.forEach((line, i) => {
      const y = g.gkY - (i + 1) * g.gap;
      const k = line.length, gap = colGap(k), pw = k > 1 ? Math.min(84, gap / 100 * W - 4) : 84;
      line.forEach((p, j) => { html += player(p, ...place(50 + (j - (k - 1) / 2) * gap, y), r, tc, size, pw); });
    });
    return html;
  };
  const tag = (r, cls) => `<div class="tm-tag ${cls}">${img(r.team?.logos?.[0]?.href || r.team?.logo, '', '')}${esc(teamName(r))}${r.formation ? `<span>${esc(r.formation)}</span>` : ''}</div>`;
  const lines = `<svg class="lines" viewBox="0 0 100 170" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".5">
    <rect x="4" y="4" width="92" height="162" rx="1.5"/><line x1="4" y1="85" x2="96" y2="85"/><circle cx="50" cy="85" r="12"/><circle cx="50" cy="85" r=".9" fill="rgba(255,255,255,.7)"/>
    <rect x="22" y="4" width="56" height="24"/><rect x="36" y="4" width="28" height="8"/><path d="M40 28 a12 10 0 0 0 20 0"/>
    <rect x="22" y="142" width="56" height="24"/><rect x="36" y="158" width="28" height="8"/><path d="M40 142 a12 10 0 0 1 20 0"/></svg>`;

  const bench = (r, tc) => {
    const list = r.roster.filter(p => !p.starter);
    if (!list.length) return '';
    return `<div class="lineup-head">${img(r.team?.logos?.[0]?.href || r.team?.logo, 'logo sm', '')}Bank · ${esc(teamName(r))}</div>
      <div class="list glass">${list.sort((a, b) => (b.subbedIn ? 1 : 0) - (a.subbedIn ? 1 : 0)).map(p => {
        const a = p.athlete || {}, e = ev[a.id] || {};
        return `<div class="row" data-ply="${esc(a.id)}" style="cursor:pointer">
          <div class="av" style="--tc:${tc};--tn:${readableOn(tc)}"><img alt="" data-pid="${esc(a.id)}" data-pname="${esc(a.displayName)}" data-pteam="${esc(r.team?.displayName || '')}" data-pfb="${esc(a.headshot?.href || '')}"><b>${esc(p.jersey || '')}</b></div>
          <div class="grow"><div class="t1">${esc(a.displayName)}</div><div class="t2">${esc(posDE(p.position))}</div></div>
          ${e.g ? `<span>⚽${e.g > 1 ? '×' + e.g : ''}</span>` : ''}${e.r ? '<span class="card-r"></span>' : e.y ? '<span class="card-y"></span>' : ''}
          ${p.subbedIn ? '<span class="sub-i" title="eingewechselt">↑</span>' : ''}
        </div>`; }).join('')}</div>`;
  };

  return `<div class="pitch-wrap glass">
      ${away ? tag(away, 'top') : ''}
      <div class="pitch" style="aspect-ratio:${W.toFixed(0)} / ${H.toFixed(0)}">${lines}${away ? half(away, ac, true) : ''}${half(home, hc, false)}</div>
      ${tag(home, 'bot')}
    </div>
    ${bench(home, hc)}${away ? bench(away, ac) : ''}`;
}

/* tap on a player in the lineup → small card with photo */
function openLineupPlayer(p, r, tc, e){
  const a = p.athlete || {};
  const kv = [
    ['Position', posDE(p.position)],

    ['Tore', e?.g ? String(e.g) : null],
    ['Karten', e?.r ? 'Rot' : e?.y ? 'Gelb' : null],
  ].filter(x => x[1]);

let teamIndex = null;
async function buildIndex(){
  if (teamIndex) return teamIndex;
  const res = await Promise.allSettled(LEAGUES.filter(l => !l.cup).map(L => standings(L.slug).then(gs => ({ L, gs }))));
  const seen = new Map();
  res.filter(r => r.status === 'fulfilled').forEach(({ value: { L, gs } }) => gs.forEach(g => g.entries.forEach(e => {
    // domestic league wins over European cup as "home" league
    if (!seen.has(e.team.id) || seen.get(e.team.id).L.group === 'eu') seen.set(e.team.id, { ...e.team, L });
  })));
  teamIndex = [...seen.values()];
  return teamIndex;
}

const textCache = new Map();
async function getText(url, ttl = 10 * 60_000){
  const hit = textCache.get(url);
  if (hit && Date.now() - hit.t < ttl) return hit.data;
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.text(); textCache.set(url, { t: Date.now(), data }); return data;
}
const htmlText = h => new DOMParser().parseFromString(String(h || ''), 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
function parseRss(xml, source){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  return [...doc.querySelectorAll('item')].map(it => {
    const g = n => it.getElementsByTagName(n)[0]?.textContent?.trim() || '';
    return { title: htmlText(g('title')), link: g('link') || g('guid'), date: new Date(g('pubDate')), desc: htmlText(g('description')),
      cats: [...it.getElementsByTagName('category')].map(c => c.textContent.trim()), source, lang:'de' };
  }).filter(n => n.title && n.link);
}
const kicker = path => getText(`https://newsfeed.kicker.de/${path}`).then(x => parseRss(x, 'kicker'));
const transfermarkt = () => getText('https://www.transfermarkt.de/rss/news').then(x => parseRss(x, 'Transfermarkt'));
const espnNews = (slug, team) => api(`site/v2/sports/soccer/${slug}/news?limit=12${team ? '&team=' + team : ''}`, { ttl: 10 * 60_000 })
  .then(d => (d.articles || []).map(a => ({ title: a.headline, link: a.links?.web?.href, date: new Date(a.published), desc: a.description || '',
    img: a.images?.[0]?.url, cats: (a.categories || []).map(c => c.description).filter(Boolean), source:'ESPN', lang:'en' })).filter(n => n.link));

function teamWords(t){
  const base = [t.name, tn(t.name), ...(TEAM_ALIASES[String(t.id)] || [])].filter(Boolean);
  return [...new Set(base.map(w => w.replace(/^(1\. )?(FC|SV|VfL|VfB|TSG|SC|FSV|SpVgg|TSV) /, '').trim()).filter(w => w.length >= 3))];
}
const titleMentions = (n, words) => mentions({ title: n.title }, words);
const mentions = (n, words) => { const hay = ' ' + [n.title, n.desc, ...(n.cats || [])].join(' ') + ' ';
  return words.some(w => new RegExp(`(^|[^\\p{L}])${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^\\p{L}]|$)`, 'iu').test(hay)); };

const RUMOR = /gerücht|interesse an|interessiert|im visier|buhlt|angeblich|offenbar|liebäugel|heiß auf|kandidat|wechselabsichten|soll .{0,40}(wechseln|kommen|holen)|könnte .{0,30}(wechseln|kommen)|transfer (rumou?rs|talk)|rumou?r|linked with|target|eyeing|interest in|in talks/i;
const DONE = /verpflichtet|unterschreibt|unterschrieben|wechselt (zu|nach|zum|zur|in)|transfer perfekt|ist perfekt|offiziell|leiht .{0,30}aus|ausgeliehen|vertrag verlängert|verlängert (seinen |den )?vertrag|neuzugang|ablösefrei|kauft|holt .{0,30}(von|aus)|sign(s|ed)? (a )?(new )?([\w'’.-]+ ){0,3}(contract|deal|extension)|sign(s|ed) (for|with)|completes? (a |his )?(move|transfer|signing)|joins|extends? contract|new contract/i;
const TRANSFERISH = /transfer|wechsel|vertrag|verpflicht|leih|ablöse|klausel|neuzugang|abgang|unterschr|signs|signed|signing|joins|contract|loan|deal|move to|rumou?r|target|interess|visier|gerücht/i;
function transferKind(n){
  const t = n.title;                       // headline only – teasers mention "Neuzugang" etc. far too loosely
  if (!TRANSFERISH.test(t)) return null;
  if (RUMOR.test(t)) return 'rumor';
  if (DONE.test(t)) return 'done';
  return null;
}
function relTime(d){
  const m = Math.round((Date.now() - d) / 60000);
  if (!isFinite(m)) return '';
  if (m < 1) return 'gerade eben'; if (m < 60) return `vor ${m} Min.`;
  const h = Math.round(m / 60); if (h < 24) return `vor ${h} Std.`;
  const dd = Math.round(h / 24); if (dd === 1) return 'gestern'; if (dd < 7) return `vor ${dd} Tagen`;
  return d.toLocaleDateString('de-DE', { day:'numeric', month:'short' });
}

async function mergedSchedules(slugs, id){
  const all = await Promise.allSettled(slugs.flatMap(sl => [
    api(`site/v2/sports/soccer/${sl}/teams/${id}/schedule`).then(d => ({ d, sl })),
    api(`site/v2/sports/soccer/${sl}/teams/${id}/schedule?fixture=true`).then(d => ({ d, sl })),
  ]));
  const ok = all.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (!ok.length) throw all[0]?.reason || new Error('Keine Spiele gefunden');
  const evs = [...new Map(ok.flatMap(x => (x.d.events || []).map(e => [e.id, normEvent(e, x.sl)]))).values()]
    .filter(m => m.date).sort((a, b) => new Date(a.date) - new Date(b.date));
  const upcoming = evs.filter(m => m.state === 'pre' && m.name !== 'STATUS_POSTPONED' && new Date(m.date) > Date.now() - 3 * 3600e3);
  const past = evs.filter(m => m.state === 'post' || m.state === 'in').reverse();
  return { last: past.find(m => m.state === 'in') || past[0], next: upcoming[0], upcoming, past };
}

        ${d.upcoming.length ? `<div class="matches">${d.upcoming.slice(0, 3).map((m, i) => matchCard(m, { ...o, tv:true }) + (i === 0 ? nextBar(m) : '')).join('')}</div>`
                            : `<div class="ov-none glass flat">Noch keine Länderspiele angesetzt</div>`}
        <div class="ov-label" style="margin-top:16px">Letzte Länderspiele</div>
        ${d.past.filter(m => m.state === 'post').length ? `<div class="matches">${d.past.filter(m => m.state === 'post').slice(0, 3).map(m => matchCard(m, o)).join('')}</div>`
                            : `<div class="ov-none glass flat">Keine Ergebnisse</div>`}`;
    })
    .catch(() => { const el = $('#ovNation'); if (el && my === token) el.innerHTML = `<div class="ov-none glass flat">Spiele konnten nicht geladen werden</div>`; }));
  // league table snippet (around the club if it plays there, else top 5)
  if (L) jobs.push(standings(L.slug).then(gs => {
    const el = $('#ovLeague'); if (!el || my !== token) return;
    const all = gs[0]?.entries || [];
    if (!all.length){ el.innerHTML = `<div class="ov-none glass flat">Keine Tabelle verfügbar</div>`; return; }
    let i = all.findIndex(e => String(e.team.id) === String(C.id));
    const start = i < 0 ? 0 : Math.max(0, Math.min(i - 2, all.length - 5));
    el.innerHTML = `<div class="table glass">
      <div class="trow head"><span class="c">#</span><span>Team</span><span class="c">Sp</span><span class="c">TD</span><span class="c">Pkt</span></div>
      ${all.slice(start, start + 5).map(e => `<a class="trow ${String(e.team.id) === String(C.id) ? 'hl' : ''}" href="#/team/${esc(L.slug)}/${esc(e.team.id)}">
        ${e.note ? `<span class="zone" style="background:${esc(e.note.color)}"></span>` : ''}
        <span class="rk">${esc(e.s.rank)}</span><span class="team">${img(e.team.logo, 'logo xs', e.team.name)}<span>${esc(e.team.name)}</span></span>
        <span class="c">${esc(e.s.gamesPlayed)}</span><span class="c">${esc(e.s.pointDifferential)}</span><span class="pts">${esc(e.s.points)}</span></a>`).join('')}
    </div>`;
  }).catch(() => { const el = $('#ovLeague'); if (el && my === token) el.innerHTML = `<div class="ov-none glass flat">Tabelle konnte nicht geladen werden</div>`; }));

  // ---- news & transfers ----
  const cWords = teamWords(C), nWords = N ? [N.name, ...(TEAM_ALIASES[N.id] || [])] : [];
  const tag = about => list => list.map(n => ({ ...n, about }));
  const src = [];
  if (KICKER_TEAM[C.id]){
    src.push(kicker('team/' + KICKER_TEAM[C.id]).then(l => l.map(n => ({ ...n, about: C.name, trusted: true }))));
    // ESPN covers transfer rumours well – use it for the Transfers section only, news stay German
    src.push(espnNews(C.slug, C.id).then(l => l.filter(n => transferKind(n) && titleMentions(n, cWords)).map(n => ({ ...n, about: C.name }))));
  }
  else {
    src.push(espnNews(C.slug, C.id).then(tag(C.name)));
    src.push(kicker('news/internationaler-fussball').then(l => l.filter(n => mentions(n, cWords))).then(tag(C.name)));
  }
  src.push(transfermarkt().then(l => l.filter(n => mentions(n, cWords))).then(tag(C.name)));
  if (N){
    if (KICKER_NATION[N.id]) src.push(kicker('news/' + KICKER_NATION[N.id]).then(tag(N.name)));
    else src.push(espnNews('fifa.world', N.id).then(tag(N.name)));
  }
  if (L) src.push((KICKER_LEAGUE[L.slug]
      ? kicker('news/' + KICKER_LEAGUE[L.slug]).then(l => l.filter(n => n.cats.some(c => norm(c) === norm(KICKER_LEAGUE_CAT[L.slug]))))
      : espnNews(L.slug)).then(tag(L.name)));

  jobs.push(Promise.allSettled(src).then(res => {
    if (my !== token) return;
    const seen = new Set(), items = [];
    res.filter(r => r.status === 'fulfilled').flatMap(r => r.value)
      .filter(n => n.date instanceof Date && !isNaN(n.date) && Date.now() - n.date < 21 * 864e5)
      .sort((a, b) => b.date - a.date)
      .forEach(n => { const k = norm(n.title).slice(0, 60); if (!seen.has(k) && !seen.has(n.link)) { seen.add(k); seen.add(n.link); items.push(n); } });
    // transfers: only items about the club (or national team players) that read like a transfer
    const transfers = items.filter(n => transferKind(n) && (n.trusted || titleMentions(n, cWords))).slice(0, 8);
    const tset = new Set(transfers);
    const news = items.filter(n => !tset.has(n));
    const tEl = $('#ovTransfers');
    if (tEl) tEl.innerHTML = transfers.length ? `<div class="ov-h"><h2>Transfers</h2><span class="pill">${transfers.length}</span></div>
      <div class="news glass">${transfers.map(n => newsRow(n, transferKind(n))).join('')}</div>` : '';
    const nEl = $('#ovNews'); if (!nEl) return;
    if (!news.length){ nEl.innerHTML = res.every(r => r.status === 'rejected') ? `<div class="ov-h"><h2>News</h2></div><div class="ov-none glass flat">News konnten nicht geladen werden</div>` : ''; return; }
    const show = k => `<div class="ov-h"><h2>News</h2></div><div class="news glass">${news.slice(0, k).map(n => newsRow(n)).join('')}</div>
      ${news.length > k ? `<button class="more glass flat press" id="newsMore">Weitere News anzeigen</button>` : ''}`;
    nEl.innerHTML = show(8);
    const more = () => { nEl.innerHTML = show(30); $('#newsMore')?.addEventListener('click', more); };
    $('#newsMore')?.addEventListener('click', more);
  }));

  Promise.allSettled(jobs).then(() => { if (my === token) scheduleRefresh(live); });
}

/* ---------- toast ---------- */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'glass strong';
  t.textContent = msg;
  Object.assign(t.style, { position:'fixed', left:'50%', top:'calc(env(safe-area-inset-top,0px) + 70px)', transform:'translate(-50%,-20px)', opacity:'0', padding:'12px 20px', borderRadius:'999px', fontWeight:'650', fontSize:'14px', zIndex:120, transition:'all .45s var(--spring)' });
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translate(-50%,0)'; });
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%,-20px)'; setTimeout(() => t.remove(), 500); }, 1800);
}

/* =============================================================
   ROUTER
   ============================================================= */
let lastTab = 0;
function scheduleRefresh(on){
  clearTimeout(refreshTimer);
  if (on) refreshTimer = setTimeout(() => route(true, true), 30_000);
}
function setTab(i){
  const lens = $('#lens');
  if (+lens.style.getPropertyValue('--i') !== i){
    lens.classList.remove('squish'); void lens.offsetWidth; lens.classList.add('squish');
  }
  lens.style.setProperty('--i', i);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', +t.dataset.tab === i));
}
function route(fresh = false, silent = false){
  clearTimeout(refreshTimer);
  closeSheet();
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').map(decodeURIComponent);
  const [r, a, b] = parts;
  if (fresh && !silent) cache.clear();
  if (silent) [...cache.keys()].forEach(k => /scoreboard|summary/.test(k) && cache.delete(k));
  if (!silent) window.scrollTo({ top: 0 });
  switch (r){
    case 'leagues': lastTab = 1; setTab(1); renderHome(); break;
    case 'today':  lastTab = 2; setTab(2); renderToday(silent); break;
    case 'search': lastTab = 3; setTab(3); renderSearch(); break;
    case 'me': case 'favs': lastTab = 4; setTab(4); renderMe(); break;
    case 'league': setTab(lastTab); renderLeague(a); break;
    case 'team':   setTab(lastTab); renderTeam(a, b); break;
    case 'match':  setTab(lastTab); renderMatch(a, b, silent); break;
    default:       lastTab = 0; setTab(0); renderOverview(silent);
  }
  bindChrome();
}
function bindChrome(){
  const back = $('#back');
  if (back) back.onclick = () => { if (history.length > 1) history.back(); else location.hash = '#/'; };
}
window.addEventListener('hashchange', () => route());
window.addEventListener('scroll', () => { $('#nav')?.classList.toggle('scrolled', scrollY > 30); }, { passive:true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
/* =============================================================
   ONBOARDING
   ============================================================= */
let nationIndex = null;
async function buildNationIndex(){
  if (nationIndex) return nationIndex;
  const res = await Promise.allSettled(NATION_LISTS.map(sl => api(`v2/sports/soccer/${sl}/standings`, { ttl: 60 * 60_000 })));
  const seen = new Map();
  res.filter(r => r.status === 'fulfilled').forEach(r => (r.value.children || []).forEach(g => (g.standings?.entries || []).forEach(e => {
    const t = e.team; if (!seen.has(t.id)) seen.set(t.id, { id: t.id, en: t.displayName, name: cn(t.displayName), logo: t.logos?.[0]?.href });
  })));
  const rank = t => { const i = POPULAR_NATIONS.indexOf(t.en); return i < 0 ? 999 : i; };
  nationIndex = [...seen.values()].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'de'));
  return nationIndex;
}

function startOnboarding(steps = ['register', 'club', 'league', 'nation', 'done'], opts = {}){
  const onb = $('#onb');
  const draft = { ...(profile() || {}) };
  let idx = 0;
  document.body.classList.add('locked');
  onb.hidden = false; onb.classList.remove('gone');
  let counted = steps.filter(s2 => s2 !== 'done');

  const finish = () => {
    onb.classList.add('gone');
    document.body.classList.remove('locked');
    setTimeout(() => { onb.hidden = true; onb.innerHTML = ''; }, 500);
    route();
  };
  const frame = (inner, { back = !opts.noBack && (idx > 0 || opts.edit), step } = {}) => {
    const si = counted.indexOf(step);
    onb.innerHTML = `<div class="onb-inner">
      <div class="onb-top">
        ${back ? `<button class="icon-btn glass flat press" id="onbBack" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>` : '<div class="nav-spacer"></div>'}
        <div class="steps">${counted.length > 1 ? counted.map((_, i) => `<i class="${i === si ? 'on' : i < si ? 'done' : ''}"></i>`).join('') : ''}</div>
        <div class="nav-spacer"></div>
      </div>
      <div class="onb-step">${inner}</div>
    </div>`;
    onb.scrollTop = 0;
    const b = $('#onbBack');
    if (b) b.onclick = () => { if (idx > 0) { idx--; show(); } else { applyTheme(profile()?.theme); finish(); } };
  };
  const next = () => { idx++; idx < steps.length ? show() : finish(); };

  const show = () => ({ register: () => register(), club, league, nation, done, newpass })[steps[idx]]();

  /* --- 1. Account: register · login · forgot password --- */
  const ICON = `<img class="hero-icon" src="assets/icon-rounded-256.png" alt="Arenly">`;
  const field = (id, label, attrs, extra = '') => `<div class="field"><label for="r${id}">${label}</label>
    <div class="input glass flat" id="w${id}"><input id="r${id}" ${attrs}>${extra}</div><div class="hint" id="h${id}"></div></div>`;
  const V = {
    Name: x => x.trim().length >= 2 || 'Bitte gib deinen Namen ein.',
    Mail: x => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x.trim()) || 'Bitte gib eine gültige E-Mail-Adresse ein.',
    Pass: x => x.length >= 8 && /\d|[^A-Za-z]/.test(x) || 'Mindestens 8 Zeichen, davon eine Zahl oder ein Sonderzeichen.',
    LPass: x => x.length > 0 || 'Bitte gib dein Passwort ein.',
  };
  const wire = keys => {
    const check = (k, show2) => {
      const res = V[k]($('#r' + k).value);
      if (show2){ $('#w' + k).classList.toggle('invalid', res !== true); $('#h' + k).textContent = res === true ? '' : res; }
      return res === true;
    };
    keys.forEach(k => {
      const el = $('#r' + k);
      el.addEventListener('blur', () => el.value && check(k, true));
      el.addEventListener('input', () => $('#w' + k).classList.contains('invalid') && check(k, true));
    });
    const eye = $('#eye');
    if (eye) eye.onclick = () => { const p2 = eye.previousElementSibling; p2.type = p2.type === 'password' ? 'text' : 'password'; eye.textContent = p2.type === 'password' ? 'Zeigen' : 'Verbergen'; };
    return () => keys.map(k => check(k, true)).every(Boolean);
  };
  const formMsg = (msg, ok = false) => { const el = $('#formErr'); el.textContent = msg; el.classList.toggle('on', !!msg); el.classList.toggle('ok', ok); };
  const busy = (btn, on, label) => { btn.disabled = on; if (label) btn.textContent = label; };
  const appleBtn = () => Auth.cloud && CFG.appleSignIn ? `<div class="divider">oder</div>
    <button type="button" class="btn block apple" id="appleBtn"><svg width="17" height="20" viewBox="0 0 17 20" fill="currentColor" aria-hidden="true"><path d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 2 5.8 1.1 7.4c-1.9 3.2-.5 8 1.3 10.6.9 1.3 1.9 2.7 3.3 2.6 1.3-.1 1.8-.9 3.4-.9s2 .9 3.4.8c1.4 0 2.3-1.3 3.2-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.9-1.1-3-4.3ZM11.5 3c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.1.1 2.3-.6 3-1.5Z"/></svg>Mit Apple fortfahren</button>` : '';
  const bindApple = () => { const b = $('#appleBtn'); if (b) b.onclick = async () => { try { await Auth.apple(); } catch(err){ formMsg(err.message); } }; };

  /* after a successful login/registration: skip steps the account already has */
  const continueWith = pr => {
    Object.assign(draft, pr);
    if (pr?.theme) applyTheme(pr.theme);
    const rest = ['club', 'league', 'nation'].filter(k => !pr?.[k]);
    steps = [...steps.slice(0, idx + 1), ...rest, ...(rest.length ? ['done'] : [])];
    counted = steps.filter(s2 => s2 !== 'done' && s2 !== 'confirm');
    if (!rest.length) { toast(`Willkommen zurück, ${(pr.name || '').split(' ')[0]}!`); return finish(); }
    next();
  };

  function register(mode = 'register'){
    if (mode === 'login') return login();
    frame(`${ICON}
      <h1>Willkommen bei Arenly</h1>
      <p class="lead">Erstelle dein Konto, um Ligen, Teams und Spiele zu verfolgen.</p>
      <form id="regForm" novalidate>
        <div class="form-error" id="formErr"></div>
        ${field('Name', 'Name', `autocomplete="name" placeholder="Max Mustermann" value="${esc(draft.name || '')}"`)}
        ${field('Mail', 'E-Mail', `type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="name@beispiel.de" value="${esc(draft.email || '')}"`)}
        ${field('Pass', 'Passwort', `type="password" autocomplete="new-password" placeholder="Mindestens 8 Zeichen"`, `<button type="button" class="eye" id="eye">Zeigen</button>`)}
        <div class="cta"><button class="btn block" id="regBtn" type="submit">Konto erstellen</button>
          ${appleBtn()}
          ${Auth.cloud ? `<div class="auth-switch">Schon ein Konto? <button type="button" id="toLogin">Anmelden</button></div>` : ''}
          <p class="note">Mit der Registrierung akzeptierst du die Nutzungsbedingungen und die Datenschutzerklärung.</p></div>
      </form>`, { back:false, step:'register' });
    const valid = wire(['Name', 'Mail', 'Pass']);
    bindApple();
    $('#toLogin')?.addEventListener('click', () => login($('#rMail').value));
    $('#regForm').onsubmit = async e => {
      e.preventDefault(); formMsg('');
      if (!valid()) return;
      const btn = $('#regBtn'); busy(btn, true, 'Wird erstellt …');
      try{
        const res = await Auth.register({ name: $('#rName').value, email: $('#rMail').value, password: $('#rPass').value });
        if (res.needsConfirm) return confirmMail(res.email, $('#rName').value);
        continueWith(res.profile);
      } catch(err){ formMsg(err.message); busy(btn, false, 'Konto erstellen'); }
    };
  }

  function login(prefill = ''){
    frame(`${ICON}
      <h1>Willkommen zurück</h1>
      <p class="lead">Melde dich mit deinem Arenly-Konto an.</p>
      <form id="logForm" novalidate>
        <div class="form-error" id="formErr"></div>
        ${field('Mail', 'E-Mail', `type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="name@beispiel.de" value="${esc(prefill || draft.email || '')}"`)}
        ${field('LPass', 'Passwort', `type="password" autocomplete="current-password" placeholder="Dein Passwort"`, `<button type="button" class="eye" id="eye">Zeigen</button>`)}
        <button type="button" class="link" id="forgot">Passwort vergessen?</button>
        <div class="cta"><button class="btn block" id="logBtn" type="submit">Anmelden</button>
          ${appleBtn()}
          <div class="auth-switch">Neu bei Arenly? <button type="button" id="toReg">Konto erstellen</button></div></div>
      </form>`, { back:false, step:'register' });
    const valid = wire(['Mail', 'LPass']);
    bindApple();
    $('#toReg').onclick = () => register();
    $('#forgot').onclick = () => forgot($('#rMail').value);
    $('#logForm').onsubmit = async e => {
      e.preventDefault(); formMsg('');
      if (!valid()) return;
      const btn = $('#logBtn'); busy(btn, true, 'Anmelden …');
      try { continueWith((await Auth.login({ email: $('#rMail').value, password: $('#rLPass').value })).profile); }
      catch(err){ formMsg(err.message); busy(btn, false, 'Anmelden'); }
    };
  }

  function forgot(prefill = ''){
    frame(`${ICON}
      <h1>Passwort vergessen</h1>
      <p class="lead">Wir schicken dir einen Link, mit dem du ein neues Passwort festlegst.</p>
      <form id="fgForm" novalidate>
        <div class="form-error" id="formErr"></div>
        ${field('Mail', 'E-Mail', `type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="name@beispiel.de" value="${esc(prefill)}"`)}
        <div class="cta"><button class="btn block" id="fgBtn" type="submit">Link senden</button>
          <div class="auth-switch"><button type="button" id="toLogin">Zurück zur Anmeldung</button></div></div>
      </form>`, { back:false, step:'register' });
    const valid = wire(['Mail']);
    $('#toLogin').onclick = () => login($('#rMail').value);
    $('#fgForm').onsubmit = async e => {
      e.preventDefault(); formMsg('');
      if (!valid()) return;
      const btn = $('#fgBtn'); busy(btn, true, 'Wird gesendet …');
      try { await Auth.resetPassword($('#rMail').value); formMsg('Falls ein Konto existiert, ist der Link unterwegs. Schau in dein Postfach.', true); busy(btn, false, 'Erneut senden'); }
      catch(err){ formMsg(err.message); busy(btn, false, 'Link senden'); }
    };
  }

  function confirmMail(email, name){
    draft.name = name; draft.email = email;
    store.set('fb.pending', { name, email });
    frame(`<div class="mail-icon">✉️</div>
      <h1 style="text-align:center">Bestätige deine E-Mail</h1>
      <p class="lead" style="text-align:center">Wir haben einen Link an <b>${esc(email)}</b> geschickt. Tippe darauf, um dein Konto zu aktivieren. Danach geht es hier weiter.</p>
      <div class="form-error" id="formErr"></div>
      <div class="cta"><button class="btn block" id="cfLogin">Ich habe bestätigt – anmelden</button>
        <div class="auth-switch">Keine Mail bekommen? <button type="button" id="cfResend">Erneut senden</button></div></div>`, { back:false, step:'register' });
    $('#cfLogin').onclick = () => login(email);
    $('#cfResend').onclick = async () => {
      try { await Auth.resend(email); formMsg('Neue Bestätigungs-Mail ist unterwegs.', true); } catch(err){ formMsg(err.message); }
    };
  }

  function newpass(){
    frame(`${ICON}
      <h1>Neues Passwort</h1>
      <p class="lead">Lege ein neues Passwort für dein Konto fest.</p>
      <form id="npForm" novalidate>
        <div class="form-error" id="formErr"></div>
        ${field('Pass', 'Neues Passwort', `type="password" autocomplete="new-password" placeholder="Mindestens 8 Zeichen"`, `<button type="button" class="eye" id="eye">Zeigen</button>`)}
        <div class="cta"><button class="btn block" id="npBtn" type="submit">Passwort speichern</button></div>
      </form>`, { back:false, step:'newpass' });
    const valid = wire(['Pass']);
    $('#npForm').onsubmit = async e => {
      e.preventDefault(); formMsg('');
      if (!valid()) return;
      const btn = $('#npBtn'); busy(btn, true, 'Speichern …');
      try { await Auth.updatePassword($('#rPass').value); toast('Passwort geändert'); finish(); }
      catch(err){ formMsg(err.message); busy(btn, false, 'Passwort speichern'); }
    };
  }

  /* --- 2. Favourite club --- */
  function club(){
    const leagues = LEAGUES.filter(l => !l.cup && l.group !== 'eu');
    let league = draft.club?.slug && leagues.some(l => l.slug === draft.club.slug) ? draft.club.slug : 'ger.1';
    let sel = draft.club || null, q = '';
    frame(`
      <h1>Dein Lieblingsverein</h1>
      <p class="lead">Arenly übernimmt seine Vereinsfarben.</p>
      <label class="search glass flat" id="cbox" style="margin:0 0 12px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cq" type="search" placeholder="Verein suchen" autocomplete="off">
      </label>
      <div class="chips" id="lchips">${leagues.map(l => `<button class="chip glass flat ${l.slug === league ? 'on' : ''}" data-l="${l.slug}"><small>${esc(l.country)}</small>${esc(l.name)}</button>`).join('')}</div>
      <div id="cprev"></div>
      <div id="cgrid">${skeleton(3, 110)}</div>
      <div class="cta"><button class="btn block" id="cNext" ${sel ? '' : 'disabled'}>${opts.edit ? 'Speichern' : 'Weiter'}</button></div>`, { step:'club' });

    const preview = async team => {
      $('#cprev').innerHTML = `<div class="swatch-row glass flat">${img(team.logo, '', team.name)}${esc(team.name)}<span class="sw"><i style="background:var(--glass-strong)"></i></span></div>`;
      const th = await teamColors(team);
      if (sel?.id !== team.id) return;
      draft.theme = th; applyTheme(th);
      $('#cprev').innerHTML = `<div class="swatch-row glass flat">${img(team.logo, '', team.name)}${esc(team.name)}<span class="sw"><i style="background:${th.p}"></i><i style="background:${th.s}"></i></span></div>`;
    };
    const grid = teams => {
      $('#cgrid').innerHTML = teams.length ? `<div class="pick-grid">${teams.map(t => `
        <button class="pick glass flat ${sel?.id === t.id ? 'sel' : ''}" data-id="${esc(t.id)}">${img(t.logo, '', t.name)}<span>${esc(t.name)}</span></button>`).join('')}</div>`
        : emptyBox('🔍', 'Kein Verein gefunden');
      $('#cgrid').querySelectorAll('.pick').forEach(b => b.onclick = () => {
        const t = teams.find(x => String(x.id) === b.dataset.id);
        sel = { id: String(t.id), slug: t.slug, name: t.name, logo: t.logo };
        $('#cgrid').querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x === b));
        $('#cNext').disabled = false;
        preview(sel);
      });
    };
    const load = async () => {
      $('#cgrid').innerHTML = skeleton(3, 110);
      try{
        if (q){
          const s2 = norm(q);
          const idx2 = await buildIndex();
          if (norm($('#cq')?.value.trim() || '') !== s2) return;
          grid(idx2.filter(t => t.L.group !== 'eu' && norm(t.full + ' ' + t.name + ' ' + t.en).includes(s2)).slice(0, 30).map(t => ({ ...t, slug: t.L.slug })));
        } else {
          const gs = await standings(league);
          grid(gs.flatMap(g => g.entries.map(e => ({ ...e.team, slug: league }))).sort((a, b) => a.name.localeCompare(b.name, 'de')));
        }
      } catch(err){ $('#cgrid').innerHTML = errorBox(err, false); }
    };
    $('#lchips').onclick = e => {
      const b = e.target.closest('.chip'); if (!b) return;
      league = b.dataset.l; q = ''; $('#cq').value = '';
      $('#lchips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
      load();
    };
    let deb; $('#cq').oninput = e => { clearTimeout(deb); deb = setTimeout(() => { q = e.target.value.trim(); load(); }, 180); };
    $('#cNext').onclick = async () => {
      if (!sel) return;
      draft.club = sel;
      draft.theme ||= await teamColors(sel);
      const pr = { ...(profile() || {}), ...draft };
      saveProfile(pr); applyTheme(pr.theme);
      addFav(sel);
      if (opts.edit) toast('Neue Vereinsfarben übernommen');
      next();
    };
    if (sel) preview(sel);
    load();
  }

  /* --- 3. Favourite league --- */
  function league(){
    const clubLeague = draft.club && LEAGUES.find(l => l.slug === draft.club.slug);
    let sel = draft.league?.slug || clubLeague?.slug || null;
    frame(`
      <h1>Deine Lieblingsliga</h1>
      <p class="lead">Tabelle und News dieser Liga erscheinen in deiner Übersicht.</p>
      ${GROUPS.map(([g, title]) => {
        const ls = LEAGUES.filter(l => l.group === g && !l.cup);
        return ls.length ? `<div class="group-title" style="margin-top:6px">${esc(title)}</div>
          <div class="pick-grid">${ls.map(l => `<button class="pick lg glass flat ${l.slug === sel ? 'sel' : ''}" data-slug="${l.slug}">
            <div class="lgw"><img src="${LOGO(l.logo)}" alt="" loading="lazy"></div><span>${esc(l.name)}</span><small>${esc(l.country)}</small></button>`).join('')}</div>` : '';
      }).join('')}
      <div class="cta"><button class="btn block" id="lNext" ${sel ? '' : 'disabled'}>${opts.edit || steps.length === 1 ? 'Speichern' : 'Weiter'}</button></div>`, { step:'league' });
    onb.querySelectorAll('.pick.lg').forEach(b => b.onclick = () => {
      sel = b.dataset.slug;
      onb.querySelectorAll('.pick.lg').forEach(x => x.classList.toggle('sel', x === b));
      $('#lNext').disabled = false;
    });
    $('#lNext').onclick = () => {
      const L = LEAGUES.find(l => l.slug === sel); if (!L) return;
      draft.league = { slug: L.slug, name: L.name, country: L.country, logo: LOGO(L.logo) };
      saveProfile({ ...(profile() || {}), ...draft });
      if (opts.edit || steps.length === 1) toast('Lieblingsliga gespeichert');
      next();
    };
  }

  /* --- 4. National team --- */
  function nation(){
    let sel = draft.nation || null;
    frame(`
      <h1>Deine Nationalmannschaft</h1>
      <p class="lead">Für Länderspiele, EM und WM.</p>
      <label class="search glass flat" style="margin:0 0 14px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="nq" type="search" placeholder="Land suchen" autocomplete="off">
      </label>
      <div id="ngrid">${skeleton(3, 100)}</div>
      <div class="cta"><button class="btn block" id="nNext" ${sel ? '' : 'disabled'}>${opts.edit ? 'Speichern' : 'Weiter'}</button></div>`, { step:'nation' });
    let all = [];
    const grid = () => {
      const s2 = norm($('#nq').value.trim());
      const list = s2 ? all.filter(t => norm(t.name + ' ' + t.en).includes(s2)) : all;
      $('#ngrid').innerHTML = list.length ? `<div class="pick-grid">${list.map(t => `
        <button class="pick nat glass flat ${sel?.id === t.id ? 'sel' : ''}" data-id="${esc(t.id)}">${img(t.logo, '', t.name)}<span>${esc(t.name)}</span></button>`).join('')}</div>`
        : emptyBox('🔍', 'Kein Land gefunden');
      $('#ngrid').querySelectorAll('.pick').forEach(b => b.onclick = () => {
        const t = all.find(x => x.id === b.dataset.id);
        sel = { id: t.id, slug: 'nation', name: t.name, logo: t.logo };
        $('#ngrid').querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x === b));
        $('#nNext').disabled = false;
      });
    };
    buildNationIndex().then(list => { all = list; grid(); }).catch(err => $('#ngrid').innerHTML = errorBox(err, false));
    $('#nq').oninput = () => all.length && grid();
    $('#nNext').onclick = () => {
      if (!sel) return;
      draft.nation = sel;
      saveProfile({ ...(profile() || {}), ...draft });
      addFav(sel);
      if (opts.edit) toast('Nationalmannschaft gespeichert');
      next();
    };
  }

  /* --- 4. Done --- */
  function done(){
    frame(`
      <div style="text-align:center;flex:1;display:flex;flex-direction:column">
        <div class="done-logos">${draft.club ? img(draft.club.logo, '', draft.club.name) : ''}${draft.nation ? img(draft.nation.logo, 'nat', draft.nation.name) : ''}</div>
        <h1>Hallo ${esc((draft.name || '').split(' ')[0])}!</h1>
        <p class="lead">${esc([draft.club?.name, draft.league?.name, draft.nation?.name].filter(Boolean).join(', ').replace(/, ([^,]*)$/, ' und $1'))} sind gespeichert – alles zusammen in deiner Übersicht.<br>Arenly trägt jetzt deine Vereinsfarben.</p>
        ${currentTheme ? `<div class="swatch-row glass flat" style="justify-content:center;align-self:center">Deine Farben<span class="sw" style="margin-left:6px"><i style="background:${esc(currentTheme.p)}"></i><i style="background:${esc(currentTheme.s)}"></i></span></div>` : ''}
        <div class="cta"><button class="btn block" id="go">Los geht's</button></div>
      </div>`, { back:false, step:'done' });
    $('#go').onclick = () => { location.hash = '#/'; finish(); };
  }

  show();
}
function addFav(t){ if (!isFav(t.id)) toggleFav(t); }

/* =============================================================
   INTRO  →  ONBOARDING / APP
   ============================================================= */
function runIntro(){
  return new Promise(resolve => {
    const intro = $('#intro'), vid = $('#introVideo'), snd = $('#introSound');
    let ended = false, started = false, fallbackTimer, guard;
    const end = () => {
      if (ended) return; ended = true;
      clearTimeout(fallbackTimer); clearTimeout(guard);
      intro.classList.add('gone');
      // fade the sound out together with the picture
      if (!vid.muted){ const t0 = performance.now(), v0 = vid.volume;
        const fade = () => { const k = Math.min(1, (performance.now() - t0) / 600); try { vid.volume = v0 * (1 - k); } catch {} if (k < 1) requestAnimationFrame(fade); }; fade(); }
      setTimeout(() => { try { vid.pause(); } catch {} intro.remove(); }, 800);
      resolve();
    };
    const useFallback = () => {
      if (ended || started || intro.classList.contains('fb')) return;
      intro.classList.add('fb');
      fallbackTimer = setTimeout(end, 1500);
    };
    const setSound = on => {
      vid.muted = !on; snd.classList.toggle('on', on);
      snd.querySelector('span').textContent = on ? 'Ton aus' : 'Ton an';
      snd.setAttribute('aria-label', on ? 'Ton ausschalten' : 'Ton einschalten');
      store.set('fb.introSound', on);
    };
    snd.onclick = () => { setSound(vid.muted); if (vid.paused) vid.play().catch(() => {}); };
    vid.addEventListener('playing', () => {
      started = true; clearTimeout(guard); vid.classList.add('playing');
      // only offer the sound button if this video actually has an audio track
      setTimeout(() => {
        const hasAudio = vid.audioTracks ? vid.audioTracks.length > 0
          : (vid.mozHasAudio || (vid.webkitAudioDecodedByteCount || 0) > 0);
        if (hasAudio && !ended) snd.hidden = false;
      }, 400);
    });
    vid.addEventListener('ended', end);
    vid.addEventListener('error', useFallback, true);
    vid.querySelector('source')?.addEventListener('error', useFallback);
    // slow network / Low Power Mode: show the animated logo instead of a black screen
    guard = setTimeout(() => { if (!started) useFallback(); }, 4000);

    // Browsers only autoplay muted. If the viewer turned sound on last time, try with sound first.
    const tryPlay = () => {
      const wantSound = store.get('fb.introSound', false);
      if (wantSound){ vid.muted = false; setSound(true); }
      vid.play().catch(() => {
        if (!vid.muted){ setSound(false); store.set('fb.introSound', true); vid.play().catch(useFallback); }
        else useFallback();
      });
    };
    fetch('assets/intro.mp4', { method:'HEAD' }).then(r => r.ok ? tryPlay() : useFallback()).catch(tryPlay);
  });
}

/* ---------- self-update: home-screen apps and browser caches keep old versions around ---------- */
async function checkForUpdate(){
  try{
    const html = await (await fetch('index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const live = (html.match(/const APP_BUILD = '([^']+)'/) || [])[1];
    if (!live || live === APP_BUILD) return;
    const k = 'fb.reloadedFor';
    if (sessionStorage.getItem(k) === live) return;            // never loop
    sessionStorage.setItem(k, live);
    const u = new URL(location.href); u.searchParams.set('v', live);
    location.replace(u.toString());                            // new URL → bypasses the cached page
  } catch {}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });

applyTheme(profile()?.theme);
route();
const authReady = Auth.init()
  .then(async user => {
    if (!Auth.cloud) return;
    if (!user){ try { localStorage.removeItem('fb.profile'); } catch {} return; }   // cloud mode: no session → not signed in
    const pending = store.get('fb.pending', null);                                    // name typed before e-mail confirmation
    if (pending && !profile()?.name) store.set('fb.profile', { name: pending.name, email: pending.email });
    try { localStorage.removeItem('fb.pending'); } catch {}
    const pr = await Auth.pull();
    applyTheme(pr?.theme); route();
  })
  .catch(err => { console.warn(err); toast('Anmeldedienst nicht erreichbar – lokaler Modus'); Auth.cloud = false; });
Promise.all([runIntro(), authReady]).then(() => {
  if (!$('#onb').hidden) return;                       // e.g. password-recovery screen already open
  const pr = profile();
  if (!pr) startOnboarding(['register', 'club', 'league', 'nation', 'done']);
  else if (!pr.club) startOnboarding(['club', 'league', 'nation', 'done']);
  else if (!pr.league && !pr.nation) startOnboarding(['league', 'nation', 'done']);
  else if (!pr.league) startOnboarding(['league']);          // existing accounts: one new question
  else if (!pr.nation) startOnboarding(['nation', 'done']);
  else document.body.classList.remove('locked');
});
