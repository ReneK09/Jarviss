<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arenly">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<title>Arenly</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS  —  "Liquid Glass"
   ============================================================ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;

  --bg: #07090e;
  --text: #f5f7fb;
  --text-2: rgba(235,240,255,.64);
  --text-3: rgba(235,240,255,.40);
  --sep: rgba(255,255,255,.08);

  --glass: rgba(255,255,255,.075);
  --glass-strong: rgba(255,255,255,.14);
  --glass-press: rgba(255,255,255,.18);
  --rim-a: rgba(255,255,255,.55);
  --rim-b: rgba(255,255,255,.06);
  --rim-c: rgba(255,255,255,.28);
  --sheen: rgba(255,255,255,.16);
  --shadow: 0 12px 40px -8px rgba(0,0,0,.55);
  --shadow-sm: 0 6px 20px -6px rgba(0,0,0,.45);

  --accent: #0a84ff;
  --on-accent: #fff;
  --blob-1: #0a84ff;
  --blob-2: #bf5af2;
  --blob-3: #30d1a0;
  --blob-4: #ff6b3d;

  --live: #ff453a;
  --win: #30d158;
  --draw: #ffd60a;
  --loss: #ff453a;

  --r-xl: 30px;
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 12px;

  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease: cubic-bezier(.22,.61,.36,1);

  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg: #eef1f7;
    --text: #0b0d12;
    --text-2: rgba(20,25,40,.62);
    --text-3: rgba(20,25,40,.40);
    --sep: rgba(10,20,40,.08);
    --glass: rgba(255,255,255,.48);
    --glass-strong: rgba(255,255,255,.70);
    --glass-press: rgba(255,255,255,.85);
    --rim-a: rgba(255,255,255,.95);
    --rim-b: rgba(255,255,255,.25);
    --rim-c: rgba(255,255,255,.75);
    --sheen: rgba(255,255,255,.55);
    --shadow: 0 12px 40px -10px rgba(30,40,80,.28);
    --shadow-sm: 0 6px 18px -6px rgba(30,40,80,.22);
    color-scheme: light;
  }
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ min-height:100%; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  letter-spacing: -.01em;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
img{ display:block; }

/* ============================================================
   LIVING BACKGROUND — colour blobs the glass refracts
   ============================================================ */
.backdrop{ position:fixed; inset:-20vmax; z-index:0; pointer-events:none; filter: blur(70px) saturate(140%); opacity:.85; }
@media (prefers-color-scheme: light){ .backdrop{ opacity:.55; } }
.blob{ position:absolute; border-radius:50%; mix-blend-mode:normal; transition: background 1.2s var(--ease); will-change: transform; }
.blob.b1{ width:55vmax; height:55vmax; left:5%;  top:0%;  background: radial-gradient(circle at 50% 50%, var(--blob-1), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
.blob.b2{ width:50vmax; height:50vmax; right:0%; top:20%; background: radial-gradient(circle at 50% 50%, var(--blob-2), transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
.blob.b3{ width:45vmax; height:45vmax; left:20%; bottom:0%; background: radial-gradient(circle at 50% 50%, var(--blob-3), transparent 65%); animation: drift3 29s ease-in-out infinite alternate; }
.blob.b4{ width:30vmax; height:30vmax; right:20%; bottom:15%; background: radial-gradient(circle at 50% 50%, var(--blob-4), transparent 65%); animation: drift1 36s ease-in-out infinite alternate-reverse; opacity:.7; }
@keyframes drift1{ to{ transform: translate(14vmax, 10vmax) scale(1.15); } }
@keyframes drift2{ to{ transform: translate(-16vmax, 12vmax) scale(.9); } }
@keyframes drift3{ to{ transform: translate(10vmax, -14vmax) scale(1.1); } }
.grain{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* ============================================================
   LIQUID GLASS MATERIAL
   ============================================================ */
.glass{
  position: relative;
  isolation: isolate;
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(185%);
  backdrop-filter: blur(26px) saturate(185%);
  border-radius: var(--r-lg);
  box-shadow:
    inset 0 1px 1px -0.5px var(--rim-a),
    inset 0 -1px 1px -0.5px var(--rim-b),
    var(--shadow);
}
/* specular rim (gradient border) */
.glass::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none; z-index:2;
  background: linear-gradient(155deg, var(--rim-a) 0%, var(--rim-b) 35%, var(--rim-b) 65%, var(--rim-c) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
/* inner sheen — light caught in the glass body */
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
  background:
    radial-gradient(120% 60% at 15% 0%, var(--sheen), transparent 55%),
    radial-gradient(80% 50% at 100% 100%, rgba(255,255,255,.06), transparent 60%);
}
.glass.strong{ background: var(--glass-strong); }
.glass.flat{ box-shadow: inset 0 1px 1px -0.5px var(--rim-a), inset 0 -1px 1px -0.5px var(--rim-b), var(--shadow-sm); }

.press{ transition: transform .35s var(--spring), background .2s; }
.press:active{ transform: scale(.965); background: var(--glass-press); }

/* ============================================================
   LAYOUT
   ============================================================ */
#app{ position:relative; z-index:1; max-width: 760px; margin: 0 auto; padding: calc(var(--safe-t) + 8px) 16px calc(120px + var(--safe-b)); }
.view{ animation: viewIn .45s var(--ease) both; }
@keyframes viewIn{ from{ opacity:0; transform: translateY(14px) scale(.99); filter: blur(4px);} to{ opacity:1; transform:none; filter:none; } }

/* nav bar (iOS style: large title collapses into a glass bar) */
.nav{
  position: sticky; top: calc(var(--safe-t) + 8px); z-index: 20;
  display:flex; align-items:center; gap:10px; height:52px; padding: 0 6px;
  margin: 0 -6px;
  border-radius: 26px;
  transition: background .3s, box-shadow .3s, backdrop-filter .3s;
}
.nav.scrolled{
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(185%);
  backdrop-filter: blur(26px) saturate(185%);
  box-shadow: inset 0 1px 1px -0.5px var(--rim-a), var(--shadow-sm);
}
.nav-title{ flex:1; text-align:center; font-weight:650; font-size:17px; opacity:0; transform: translateY(6px); transition: .3s var(--ease); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav.scrolled .nav-title{ opacity:1; transform:none; }
.nav-spacer{ width:44px; height:44px; flex:none; }
.icon-btn{
  width:44px; height:44px; flex:none; border-radius:50%;
  display:grid; place-items:center;
}
.icon-btn svg{ width:20px; height:20px; }
.icon-btn.on svg{ color: var(--draw); fill: var(--draw); }

.large-title{ font-size: 36px; font-weight: 800; letter-spacing: -.035em; line-height:1.05; margin: 6px 4px 4px; }
.subtitle{ color: var(--text-2); font-size:15px; margin: 0 4px 18px; }

.section-h{ display:flex; align-items:baseline; justify-content:space-between; margin: 26px 8px 10px; }
.section-h h2{ font-size: 21px; font-weight: 750; letter-spacing:-.02em; }
.section-h span{ color: var(--text-3); font-size: 13px; font-weight:600; }

/* brand */
.brand{ display:flex; align-items:center; gap:14px; margin: 6px 4px 4px; }
.brand-icon{ width:52px; height:52px; border-radius:12px; flex:none; box-shadow: 0 8px 22px -8px rgba(0,0,0,.55), inset 0 0 0 .5px rgba(255,255,255,.3); }
.brand .large-title{ margin:0; }
.brand-sport{ display:inline-flex; align-items:center; gap:6px; padding: 5px 12px; border-radius:999px; font-size:13px; font-weight:700; margin: 10px 4px 0; }
.nav-brand{ width:28px; height:28px; border-radius:7px; }
.foot img{ width:22px; height:22px; border-radius:6px; display:inline-block; vertical-align:middle; margin-right:6px; opacity:.85; }

/* ============================================================
   INTRO (video / animated fallback)
   ============================================================ */
body.locked{ overflow:hidden; }
body.locked #app, body.locked .tabbar{ visibility:hidden; }
.intro{ position:fixed; inset:0; z-index:300; background:#1b1739; display:grid; place-items:center; transition: opacity .7s var(--ease), visibility 0s .7s; }
.intro video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition: opacity .4s; }
.intro video.playing{ opacity:1; }
.intro .fallback{ display:grid; place-items:center; gap:18px; opacity:0; }
.intro.fb .fallback{ opacity:1; }
.intro .fallback img{ width:112px; height:112px; border-radius:25px; box-shadow: 0 24px 60px -16px rgba(0,0,0,.7); }
.intro.fb .fallback img{ animation: splashIn .8s var(--spring) both; }
.intro .fallback span{ font-weight:800; font-size:24px; letter-spacing:-.02em; color:#fff; opacity:0; }
.intro.fb .fallback span{ animation: fadeUp .6s var(--ease) .3s forwards; }
.intro .skip{ position:absolute; right:16px; top: calc(var(--safe-t) + 14px); padding: 9px 16px; border-radius:999px; font-size:14px; font-weight:650; color:#fff; background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 1px 1px -0.5px rgba(255,255,255,.6); z-index:2; }
.intro .sound{ position:absolute; left:16px; top: calc(var(--safe-t) + 14px); display:flex; align-items:center; gap:7px; padding: 9px 14px 9px 11px; border-radius:999px; font-size:14px; font-weight:650; color:#fff; background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 1px 1px -0.5px rgba(255,255,255,.6); z-index:2; animation: fadeUp .4s var(--ease) both; }
.intro .sound[hidden]{ display:none; }
.intro .sound svg{ width:18px; height:18px; }
.intro .sound .w1, .intro .sound .w2{ display:none; }
.intro .sound.on .w1, .intro .sound.on .w2{ display:inline; }
.intro .sound.on .x{ display:none; }
@media (orientation: landscape){ .intro video{ object-fit: contain; } }   /* portrait video: never crop the logo on wide screens */
.intro.gone{ opacity:0; visibility:hidden; }
.intro.gone .fallback img{ transform: scale(1.35); filter: blur(6px); transition: transform .6s var(--ease), filter .6s; }
@keyframes splashIn{ from{ transform: scale(.6); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes fadeUp{ from{ transform: translateY(10px); opacity:0; } to{ transform:none; opacity:.95; } }

/* ============================================================
   ONBOARDING  (register → club → national team → done)
   ============================================================ */
.onb{ position:fixed; inset:0; z-index:150; overflow-y:auto; -webkit-overflow-scrolling:touch; transition: opacity .5s var(--ease); }
.onb.gone{ opacity:0; pointer-events:none; }
.onb-inner{ max-width:540px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 20px); }
.onb-top{ display:flex; align-items:center; gap:12px; height:48px; margin-bottom:10px; }
.steps{ flex:1; display:flex; gap:6px; justify-content:center; }
.steps i{ width:26px; height:5px; border-radius:3px; background: var(--glass-strong); transition: all .45s var(--spring); }
.steps i.on{ background: var(--accent); width:46px; }
.steps i.done{ background: color-mix(in srgb, var(--accent) 55%, transparent); }
.onb-step{ flex:1; display:flex; flex-direction:column; animation: viewIn .5s var(--ease) both; }
.onb h1{ font-size:32px; font-weight:800; letter-spacing:-.035em; line-height:1.08; }
.onb .lead{ color: var(--text-2); margin: 8px 0 22px; font-size:16px; }
.onb .hero-icon{ width:84px; height:84px; border-radius:19px; margin: 18px 0 22px; box-shadow: 0 18px 40px -14px rgba(0,0,0,.6); animation: splashIn .7s var(--spring) both; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
.field > label{ font-size:13px; font-weight:650; color: var(--text-2); margin-left:16px; }
.input{ display:flex; align-items:center; height:54px; border-radius:18px; padding:0 16px; gap:10px; transition: box-shadow .25s; }
.input input{ flex:1; min-width:0; background:none; border:0; outline:0; color: var(--text); font: inherit; font-size:17px; }
.input input:-webkit-autofill, .input input:-webkit-autofill:hover, .input input:-webkit-autofill:focus{
  -webkit-text-fill-color: var(--text); caret-color: var(--text);
  -webkit-box-shadow: 0 0 0 1000px transparent inset; box-shadow: 0 0 0 1000px transparent inset;
  transition: background-color 600000s 0s, color 600000s 0s; }
.input input::placeholder{ color: var(--text-3); }
.input:focus-within{ box-shadow: inset 0 0 0 2px var(--accent), var(--shadow-sm); }
.input.invalid{ box-shadow: inset 0 0 0 1.5px var(--loss), var(--shadow-sm); }
.input .eye{ color: var(--text-2); font-size:13px; font-weight:650; padding:6px; }
.hint{ font-size:12px; color: var(--loss); margin-left:16px; min-height:16px; }
.note{ font-size:12px; color: var(--text-3); text-align:center; margin-top:12px; }
.cta{ margin-top:auto; padding-top:18px; position:sticky; bottom: calc(-1 * (var(--safe-b) + 20px)); padding-bottom: calc(var(--safe-b) + 20px); margin-bottom: calc(-1 * (var(--safe-b) + 20px));
}
.btn.block{ width:100%; height:54px; font-size:17px; margin-top:0; }
.btn:disabled{ opacity:.4; box-shadow:none; cursor:default; }
.pick-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(98px,1fr)); gap:10px; margin-bottom:12px; }
.pick{ padding: 14px 6px 10px; border-radius:18px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; font-size:12.5px; font-weight:600; line-height:1.15; transition: transform .35s var(--spring), box-shadow .3s; }
.pick img{ width:46px; height:46px; object-fit:contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
.pick.nat img{ width:52px; height:36px; object-fit:cover; border-radius:7px; filter:none; box-shadow: 0 4px 12px -4px rgba(0,0,0,.4), 0 0 0 .5px rgba(0,0,0,.2); }
.pick.sel{ transform: scale(1.04); box-shadow: inset 0 0 0 2.5px var(--accent), 0 12px 28px -10px var(--accent); }
.swatch-row{ display:flex; align-items:center; gap:10px; padding: 10px 14px; border-radius:999px; font-size:14px; font-weight:600; margin-bottom:12px; }
.swatch-row img{ width:26px; height:26px; object-fit:contain; }
.swatch-row .sw{ display:flex; gap:6px; margin-left:auto; }
.swatch-row .sw i{ width:20px; height:20px; border-radius:50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55), 0 2px 6px rgba(0,0,0,.3); }
.done-logos{ display:flex; justify-content:center; align-items:center; gap:22px; margin: 34px 0 22px; }
.done-logos img{ width:110px; height:110px; object-fit:contain; filter: drop-shadow(0 18px 40px color-mix(in srgb, var(--accent) 70%, transparent)); animation: float 6s ease-in-out infinite; }
.done-logos img.nat{ width:76px; height:54px; object-fit:cover; border-radius:10px; animation-delay: -3s; }

.auth-switch{ text-align:center; margin-top:14px; font-size:15px; color: var(--text-2); }
.auth-switch button, .link{ color: var(--accent); font-weight:650; }
.link{ font-size:14px; align-self:flex-end; margin: -2px 6px 8px 0; }
.form-error{ display:none; padding: 12px 14px; border-radius:14px; font-size:14px; font-weight:550; margin-bottom:12px;
  background: color-mix(in srgb, var(--loss) 16%, transparent); color: var(--loss); }
.form-error.on{ display:block; }
.form-error.ok{ background: color-mix(in srgb, var(--win) 16%, transparent); color: var(--win); }
.divider{ display:flex; align-items:center; gap:12px; color: var(--text-3); font-size:13px; margin: 16px 0; }
.divider::before, .divider::after{ content:""; flex:1; height:1px; background: var(--sep); }
.btn.apple{ background:#000; color:#fff; box-shadow: inset 0 1px 1px -0.5px rgba(255,255,255,.4); }
@media (prefers-color-scheme: dark){ .btn.apple{ background:#fff; color:#000; } }
.mail-icon{ font-size:64px; margin: 30px 0 10px; text-align:center; }

/* ============================================================
   OVERVIEW
   ============================================================ */
.trio{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin: 8px 0 2px; }
.trio a{ padding: 14px 6px 12px; border-radius: var(--r-md); display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; min-width:0; }
.trio .ico{ height:46px; display:grid; place-items:center; }
.trio .ico img.club{ width:44px; height:44px; object-fit:contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
.trio .ico img.nat{ width:54px; height:38px; object-fit:cover; border-radius:7px; box-shadow: 0 4px 12px -4px rgba(0,0,0,.45), 0 0 0 .5px rgba(0,0,0,.2); }
.trio .ico .lgw{ width:44px; height:44px; border-radius:12px; background: rgba(255,255,255,.94); display:grid; place-items:center; box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); }
.trio .ico .lgw img{ width:32px; height:32px; object-fit:contain; }
.trio small{ font-size:10px; font-weight:750; letter-spacing:.07em; text-transform:uppercase; color: var(--text-3); }
.trio span{ font-size:13px; font-weight:650; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.ov-h{ display:flex; align-items:center; gap:10px; margin: 28px 6px 12px; }
.ov-h img{ width:28px; height:28px; object-fit:contain; flex:none; }
.ov-h img.nat{ width:30px; height:21px; object-fit:cover; border-radius:4px; }
.ov-h .lgw{ width:28px; height:28px; border-radius:8px; background: rgba(255,255,255,.94); display:grid; place-items:center; flex:none; }
.ov-h .lgw img{ width:21px; height:21px; }
.ov-h h2{ flex:1; min-width:0; font-size:20px; font-weight:750; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ov-h .more-link{ font-size:14px; font-weight:650; color: var(--accent); flex:none; }
.ov-pair{ display:grid; gap:14px; }
@media (min-width: 620px){ .ov-pair{ grid-template-columns: 1fr 1fr; } }
.ov-label{ font-size:11px; font-weight:750; letter-spacing:.07em; text-transform:uppercase; color: var(--text-3); margin: 0 8px 7px; }
.ov-none{ padding: 18px; border-radius: var(--r-md); text-align:center; color: var(--text-2); font-size:14px; }
.news{ border-radius: var(--r-lg); overflow:hidden; }
.news a{ display:flex; gap:12px; padding: 14px 16px; position:relative; transition: background .2s; }
.news a:active{ background: var(--glass-press); }
.news a + a::before{ content:""; position:absolute; top:0; left:16px; right:16px; height:1px; background: var(--sep); }
.news .nb{ flex:1; min-width:0; }
.news .nt{ font-weight:650; font-size:15px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.news .nd{ font-size:13px; color: var(--text-2); line-height:1.35; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.news .nm{ font-size:12px; color: var(--text-3); margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-weight:550; }
.news img.th{ width:76px; height:76px; border-radius:12px; object-fit:cover; flex:none; background: var(--glass-strong); }
.badge{ font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding: 3px 8px; border-radius:999px; }
.badge.rumor{ background: rgba(255,159,10,.2); color:#ff9f0a; }
.badge.done{ background: rgba(48,209,88,.2); color:#30d158; }
.badge.src{ background: var(--glass-strong); color: var(--text-2); }
@media (prefers-color-scheme: light){ .badge.rumor{ color:#b25e00; } .badge.done{ color:#1a8a3c; } }
.pick.lg .lgw{ width:48px; height:48px; border-radius:13px; background: rgba(255,255,255,.94); display:grid; place-items:center; box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); }
.pick.lg .lgw img{ width:36px; height:36px; filter:none; }
.pick small{ font-size:11px; color: var(--text-2); font-weight:550; margin-top:-4px; }

/* profile */
.profile-card{ display:flex; align-items:center; gap:16px; padding:18px; border-radius: var(--r-xl); margin-bottom: 8px; }
.avatar{ width:64px; height:64px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:24px; font-weight:800; color: var(--on-accent);
  background: linear-gradient(140deg, var(--blob-1), var(--blob-2)); box-shadow: inset 0 1px 1px -0.5px rgba(255,255,255,.7), 0 10px 24px -10px var(--accent); }
.profile-card h2{ font-size:22px; font-weight:800; letter-spacing:-.02em; }
.profile-card p{ color: var(--text-2); font-size:14px; }
.row.danger .t1{ color: var(--loss); }

/* list (inset grouped, glass) */
.list{ border-radius: var(--r-lg); overflow:hidden; }
.row{
  display:flex; align-items:center; gap:14px; padding: 12px 16px; min-height:60px; position:relative;
  transition: background .2s;
}
.row + .row::before{ content:""; position:absolute; top:0; left:66px; right:0; height:1px; background: var(--sep); }
.row:active{ background: var(--glass-press); }
.row .grow{ flex:1; min-width:0; }
.row .t1{ font-weight: 600; font-size: 16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .t2{ color: var(--text-2); font-size: 13px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chev{ width:8px; height:14px; color: var(--text-3); flex:none; }

.logo{ width:36px; height:36px; flex:none; object-fit:contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
.logo.sm{ width:24px; height:24px; }
.logo.xs{ width:20px; height:20px; }
.logo-wrap{ width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none; background: rgba(255,255,255,.9); }
.logo-wrap .logo{ width:28px; height:28px; filter:none; }
.ph-logo{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background: var(--glass-strong); color: var(--text-2); flex:none; }

/* league cards (grid) */
.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
.tile{ padding: 16px; display:flex; flex-direction:column; gap:12px; min-height:128px; border-radius: var(--r-lg); }
.tile .tl-logo{ width:46px; height:46px; border-radius:14px; background: rgba(255,255,255,.92); display:grid; place-items:center; box-shadow: 0 4px 14px -4px rgba(0,0,0,.35); }
.tile .tl-logo img{ width:34px; height:34px; object-fit:contain; }
.tile .tl-name{ font-weight:700; font-size:16px; letter-spacing:-.015em; line-height:1.15; }
.tile .tl-sub{ color: var(--text-2); font-size:13px; margin-top:2px; }

/* team tiles */
.team-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(104px,1fr)); gap: 10px; }
.team-tile{ padding: 16px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; border-radius: var(--r-md); }
.team-tile img{ width:48px; height:48px; object-fit:contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
.team-tile span{ font-size:13px; font-weight:600; line-height:1.15; }

/* fav strip */
.hscroll{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding: 4px 4px 14px; margin: 0 -16px; padding-left:16px; padding-right:16px; scroll-snap-type: x proximity; }
.hscroll::-webkit-scrollbar{ display:none; }
.fav-chip{ flex:none; display:flex; flex-direction:column; align-items:center; gap:8px; width:86px; padding: 14px 6px 10px; border-radius: var(--r-md); scroll-snap-align:start; }
.fav-chip img{ width:42px; height:42px; object-fit:contain; }
.fav-chip span{ font-size:12px; font-weight:600; text-align:center; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

/* ============================================================
   SEGMENTED CONTROL (sliding glass thumb)
   ============================================================ */
.seg{
  position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  padding:4px; border-radius: 999px; margin: 4px 0 18px;
}
.seg-thumb{
  position:absolute; top:4px; bottom:4px; left:4px;
  width: calc((100% - 8px) / var(--n));
  transform: translateX(calc(100% * var(--i)));
  border-radius:999px;
  background: var(--glass-strong);
  box-shadow: inset 0 1px 1px -0.5px var(--rim-a), 0 4px 14px -4px rgba(0,0,0,.35);
  transition: transform .5s var(--spring);
  z-index:0;
}
.seg button{ position:relative; z-index:1; height:36px; font-size:14px; font-weight:600; color: var(--text-2); border-radius:999px; transition: color .25s; }
.seg button.on{ color: var(--text); }

/* date chips */
.chips{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin: 0 -16px 16px; padding: 4px 16px 10px; scroll-snap-type:x proximity; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding: 8px 14px; border-radius:999px; font-size:14px; font-weight:600; color: var(--text-2); display:flex; flex-direction:column; align-items:center; min-width:62px; scroll-snap-align:center; transition: .3s var(--ease); }
.chip small{ font-size:11px; font-weight:600; opacity:.75; text-transform:uppercase; letter-spacing:.04em; }
.chip.on{ color: var(--on-accent); background: var(--accent); box-shadow: 0 8px 22px -6px var(--accent), inset 0 1px 1px -0.5px rgba(255,255,255,.7); }
.chip.on::after, .chip.on::before{ display:none; }

/* ============================================================
   MATCH CARD
   ============================================================ */
.matches{ display:flex; flex-direction:column; gap:10px; }
.match{
  display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:10px;
  padding: 14px 14px; border-radius: var(--r-md);
}
.match .side{ display:flex; align-items:center; gap:10px; min-width:0; }
.match .side.away{ flex-direction: row-reverse; text-align:right; }
.match .side .nm{ font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.match .side.loser .nm{ color: var(--text-2); font-weight:500; }
.match .mid{ display:flex; flex-direction:column; align-items:center; min-width:74px; }
.match .score{ font-size:22px; font-weight:800; letter-spacing:.02em; font-variant-numeric: tabular-nums; }
.match .time{ font-size:18px; font-weight:700; font-variant-numeric: tabular-nums; }
.match .st{ font-size:11px; font-weight:700; color: var(--text-3); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
.match .st.live{ color: var(--live); display:flex; align-items:center; gap:5px; }
.match .meta{ grid-column: 1 / -1; display:flex; justify-content:center; font-size:12px; color: var(--text-3); margin-top:-2px; }
.pulse{ width:7px; height:7px; border-radius:50%; background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 1.6s infinite; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(255,69,58,.7);} 70%{ box-shadow:0 0 0 8px rgba(255,69,58,0);} 100%{ box-shadow:0 0 0 0 rgba(255,69,58,0);} }

.league-head{ display:flex; align-items:center; gap:10px; margin: 22px 6px 10px; font-weight:700; font-size:15px; }
.league-head img{ width:22px; height:22px; object-fit:contain; background:rgba(255,255,255,.92); border-radius:7px; padding:2px; }
.league-head .cnt{ margin-left:auto; color: var(--text-3); font-size:13px; font-weight:600; }

/* ============================================================
   STANDINGS TABLE
   ============================================================ */
.table{ border-radius: var(--r-lg); overflow:hidden; padding: 6px 0; }
.trow{ display:grid; grid-template-columns: 30px 1fr 30px 40px 40px; align-items:center; gap:6px; padding: 9px 14px 9px 10px; font-size:14px; position:relative; font-variant-numeric: tabular-nums; }
.trow.wide{ grid-template-columns: 30px 1fr 30px 30px 30px 30px 54px 40px 40px; }
.trow.head{ color: var(--text-3); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding-top:8px; padding-bottom:8px; }
.trow .c{ text-align:center; }
.trow .pts{ font-weight:800; text-align:center; }
.trow .team{ display:flex; align-items:center; gap:10px; min-width:0; font-weight:600; }
.trow .team span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trow .rk{ text-align:center; font-weight:700; color: var(--text-2); }
.trow .zone{ position:absolute; left:3px; top:9px; bottom:9px; width:3px; border-radius:3px; }
.trow:not(.head):active{ background: var(--glass-press); }
.trow.hl{ background: color-mix(in srgb, var(--accent) 22%, transparent); }
.trow + .trow:not(.head)::before{ content:""; position:absolute; top:0; left:44px; right:14px; height:1px; background: var(--sep); }
.col-wide{ display:none; }
@media (min-width: 560px){ .col-wide{ display:block; } }
.legend{ display:flex; flex-wrap:wrap; gap:8px 16px; margin: 14px 8px 0; font-size:12px; color: var(--text-2); }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.group-title{ margin: 20px 8px 8px; font-weight:700; font-size:15px; color: var(--text-2); }

/* ============================================================
   TEAM / MATCH HERO
   ============================================================ */
.hero{ padding: 26px 18px 22px; border-radius: var(--r-xl); text-align:center; margin: 4px 0 16px; overflow:hidden; }
.hero .glow{ position:absolute; inset:-40%; z-index:-2; background: radial-gradient(40% 40% at 50% 35%, var(--accent), transparent 70%); opacity:.45; filter: blur(30px); }
.hero .big-logo{ width:96px; height:96px; object-fit:contain; margin: 0 auto 14px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.4)); animation: float 6s ease-in-out infinite; }
@keyframes float{ 50%{ transform: translateY(-5px); } }
.hero h1{ font-size: 28px; font-weight: 800; letter-spacing:-.03em; line-height:1.1; }
.hero p{ color: var(--text-2); font-size:14px; margin-top:6px; }
.pills{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px; }
.pill{ padding: 6px 12px; border-radius:999px; font-size:13px; font-weight:650; background: var(--glass-strong); box-shadow: inset 0 1px 1px -0.5px var(--rim-a); }
.pill b{ font-weight:800; }

.scoreboard{ display:grid; grid-template-columns: 1fr auto 1fr; align-items:start; gap: 8px; }
.scoreboard .tm{ display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0; }
.scoreboard .tm img{ width:72px; height:72px; object-fit:contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
.scoreboard .tm span{ font-weight:700; font-size:15px; line-height:1.15; }
.scoreboard .res{ padding-top: 16px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.scoreboard .res .num{ font-size: 46px; font-weight: 800; letter-spacing:-.02em; font-variant-numeric: tabular-nums; line-height:1; }
.scoreboard .res .num.pre{ font-size:30px; }
.scoreboard .res .stt{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color: var(--text-2); }
.scoreboard .res .stt.live{ color: var(--live); display:flex; align-items:center; gap:6px; }
.hero .info{ margin-top:18px; font-size:13px; color: var(--text-2); display:flex; justify-content:center; gap: 6px 14px; flex-wrap:wrap; }

.nb-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding: 7px 7px 7px 14px; border-radius:999px; }
.nb-bar .cd{ font-weight:700; font-size:14px; font-variant-numeric: tabular-nums; }
.nb-bar .cal{ padding: 7px 13px; border-radius:999px; font-size:13px; font-weight:700; background: var(--accent); color: var(--on-accent);
  box-shadow: 0 6px 16px -6px var(--accent), inset 0 1px 1px -0.5px rgba(255,255,255,.6); white-space:nowrap; transition: transform .3s var(--spring); }
.nb-bar .cal:active{ transform: scale(.94); }
.tv{ margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:7px; }
.tv .chs{ display:flex; flex-wrap:wrap; justify-content:center; gap:7px; align-items:center; }
.tv .lbl{ font-size:12px; font-weight:700; color: var(--text-2); }
.tv .ch{ padding: 6px 12px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:-.01em; background: var(--glass-strong);
  box-shadow: inset 0 1px 1px -0.5px var(--rim-a); }
.tv .note{ font-size:11.5px; color: var(--text-3); max-width: 320px; text-align:center; line-height:1.35; }

/* timeline */
.timeline{ padding: 8px 0; border-radius: var(--r-lg); }
.ev{ display:grid; grid-template-columns: 1fr 52px 1fr; align-items:center; padding: 10px 14px; gap:8px; font-size:14px; }
.ev .min{ text-align:center; font-weight:800; font-size:13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ev .l{ text-align:right; display:flex; justify-content:flex-end; align-items:center; gap:8px; }
.ev .r{ display:flex; align-items:center; gap:8px; }
.ev .who{ display:flex; flex-direction:column; }
.ev .l .who{ align-items:flex-end; }
.ev .who b{ font-weight:650; }
.ev .who small{ color: var(--text-2); font-size:12px; }
.ev.divider{ grid-template-columns: 1fr; text-align:center; color: var(--text-3); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding: 6px; }
.ic{ width:20px; height:20px; flex:none; display:grid; place-items:center; font-size:15px; }
.card-y, .card-r{ width:11px; height:15px; border-radius:2.5px; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.card-y{ background:#ffd60a; } .card-r{ background:#ff3b30; }
.sub-i{ color: var(--win); font-weight:900; } .sub-o{ color: var(--loss); font-weight:900; }

/* stats bars */
.stats{ padding: 8px 16px 14px; border-radius: var(--r-lg); }
.stat{ padding: 12px 0 6px; }
.stat + .stat{ border-top: 1px solid var(--sep); }
.stat .top{ display:flex; justify-content:space-between; font-size:14px; font-weight:700; font-variant-numeric: tabular-nums; margin-bottom:8px; }
.stat .top span:nth-child(2){ color: var(--text-2); font-weight:600; font-size:13px; }
.bars{ display:flex; gap:6px; height:8px; }
.bars div{ flex:1; border-radius:6px; background: var(--sep); overflow:hidden; display:flex; }
.bars div:first-child{ justify-content:flex-end; }
.bars i{ display:block; height:100%; border-radius:6px; transition: width .9s var(--spring); }
.bars .hb{ background: var(--home-c, var(--accent)); }
.bars .ab{ background: var(--away-c, #8e8e93); }

/* lineups */
.lineup-head{ display:flex; align-items:center; gap:10px; margin: 18px 8px 10px; font-weight:700; }
.lineup-head .form{ margin-left:auto; color: var(--text-2); font-size:13px; font-weight:700; }
.num{ font-variant-numeric: tabular-nums; }
.jersey{ width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:13px; font-weight:800; background: var(--glass-strong); box-shadow: inset 0 1px 1px -0.5px var(--rim-a); }
.tag{ font-size:11px; font-weight:700; padding: 3px 8px; border-radius:999px; background: var(--glass-strong); color: var(--text-2); flex:none; }
.flag{ width:20px; height:14px; object-fit:cover; border-radius:3px; flex:none; box-shadow: 0 0 0 .5px rgba(0,0,0,.2); }

/* ---------- lineup pitch ---------- */
.pitch-wrap{ border-radius: var(--r-xl); padding: 10px; margin-bottom: 8px; }
.pitch{ position:relative; width:100%; aspect-ratio: 10 / 17; border-radius: 22px; overflow:hidden;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 6.25%, transparent 6.25% 12.5%),
    linear-gradient(180deg, #2f8f55, #237546 50%, #2f8f55);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 10px 40px rgba(0,0,0,.25); }
.pitch svg.lines{ position:absolute; inset:0; width:100%; height:100%; }
.tm-tag{ display:flex; align-items:center; gap:8px; padding: 4px 6px 10px; font-size:14px; font-weight:700; }
.tm-tag.bot{ padding: 10px 6px 4px; }
.tm-tag img{ width:22px; height:22px; object-fit:contain; }
.tm-tag span{ margin-left:auto; color: var(--text-2); font-weight:700; font-size:13px; font-variant-numeric: tabular-nums; }
.pl{ position:absolute; transform: translate(-50%, -50%); display:flex; flex-direction:column; align-items:center; width: var(--pw, 70px); z-index:2;
  animation: plIn .5s var(--spring) both; cursor:pointer; }
@keyframes plIn{ from{ opacity:0; transform: translate(-50%, -30%) scale(.6); } }
.pl .ph{ position:relative; width:var(--ps, 38px); height:var(--ps, 38px); border-radius:50%;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--tc) 70%, #fff), var(--tc));
  box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 6px 14px -4px rgba(0,0,0,.5); display:grid; place-items:center; }
.pl .ph .face{ position:absolute; inset:0; border-radius:50%; overflow:hidden; }
.pl .ph .face img{ width:100%; height:100%; object-fit:cover; object-position: 50% 12%; transform: scale(1.12) translateY(6%); opacity:0; transition: opacity .4s; }
.pl .ph .face img.ok{ opacity:1; }
.pl .ph .no{ font-weight:800; font-size:14px; color: var(--tn); }
.pl .ph .face:has(img.ok) + .no{ display:none; }
.pl .num{ position:absolute; left:-5px; bottom:-3px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; font-size:10.5px; font-weight:800;
  display:grid; place-items:center; color: var(--tn); background: var(--tc); box-shadow: 0 0 0 1.5px #fff; }
.pl .bdg{ position:absolute; right:-7px; top:-5px; display:flex; gap:2px; }
.pl .bdg i{ font-style:normal; display:grid; place-items:center; height:17px; min-width:17px; padding:0 3px; border-radius:9px; font-size:10px; font-weight:800;
  background:#fff; color:#111; box-shadow: 0 2px 5px rgba(0,0,0,.35); }
.pl .bdg i.card{ min-width:11px; width:11px; height:15px; border-radius:2.5px; padding:0; }
.pl .bdg i.y{ background:#ffd60a; } .pl .bdg i.r{ background:#ff3b30; }
.pl .bdg i.out{ background:#ff453a; color:#fff; }
.pl .pn{ margin-top:4px; max-width:100%; padding: 1px 5px; border-radius:6px; font-size: var(--fs, 10.5px); height:15px; box-sizing:border-box; font-weight:700; color:#fff; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background: rgba(0,0,0,.3); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.av{ position:relative; width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; overflow:hidden;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--tc) 70%, #fff), var(--tc)); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6); }
.av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 12%; transform: scale(1.12) translateY(6%); opacity:0; transition: opacity .4s; }
.av img.ok{ opacity:1; }
.av b{ font-size:13px; font-weight:800; color: var(--tn); }
.av:has(img.ok) b{ display:none; }
.ply-photo{ width:86px; height:86px; --tc: var(--accent); --tn:#fff; }
.ply-photo b{ font-size:26px; }

/* search */
.search{ display:flex; align-items:center; gap:10px; padding: 0 16px; height:50px; border-radius:999px; margin: 6px 0 16px; }
.search svg{ width:18px; height:18px; color: var(--text-2); flex:none; }
.search input{ flex:1; background:none; border:0; outline:0; color: var(--text); font: inherit; font-size:17px; min-width:0; }
.search input::-webkit-search-cancel-button{ -webkit-appearance:none; display:none; }
.search input::placeholder{ color: var(--text-3); }
.search .clear{ width:22px; height:22px; border-radius:50%; background: var(--text-3); color: var(--bg); font-size:13px; font-weight:800; display:none; place-items:center; }
.search.has .clear{ display:grid; }

/* empty / error / loading */
.empty{ text-align:center; padding: 40px 24px; border-radius: var(--r-lg); color: var(--text-2); }
.empty .em{ font-size:40px; margin-bottom:10px; }
.empty b{ display:block; color: var(--text); font-size:17px; margin-bottom:4px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding: 11px 20px; border-radius:999px; font-weight:650; margin-top:16px; background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 22px -8px var(--accent), inset 0 1px 1px -0.5px rgba(255,255,255,.7); }
.btn.ghost{ background: var(--glass-strong); color: var(--text); box-shadow: inset 0 1px 1px -0.5px var(--rim-a); }
.more{ display:block; width:100%; text-align:center; padding: 14px; margin-top:10px; border-radius: var(--r-md); font-weight:650; color: var(--accent); }

.skel{ border-radius: var(--r-md); height: 64px; margin-bottom:10px; background: var(--glass); overflow:hidden; position:relative; }
.skel::after{ content:""; position:absolute; inset:0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); animation: shimmer 1.3s infinite; }
@keyframes shimmer{ to{ transform: translateX(100%); } }

/* ============================================================
   FLOATING TAB BAR  (liquid lens)
   ============================================================ */
.tabbar{
  position: fixed; z-index: 50; left:50%; bottom: calc(14px + var(--safe-b));
  transform: translateX(-50%);
  width: min(460px, calc(100% - 24px));
  display:grid; grid-template-columns: repeat(5,1fr);
  padding: 6px; border-radius: 999px;
}
.tabbar .lens{
  position:absolute; top:6px; bottom:6px; left:6px;
  width: calc((100% - 12px) / 5);
  transform: translateX(calc(100% * var(--i, 0)));
  border-radius:999px;
  background: var(--glass-strong);
  box-shadow: inset 0 1px 1.5px -0.5px var(--rim-a), inset 0 -1px 1px -0.5px var(--rim-b), 0 6px 18px -6px rgba(0,0,0,.4);
  transition: transform .55s var(--spring);
  z-index:0;
}
.tabbar .lens.squish{ animation: squish .55s var(--ease); }
@keyframes squish{ 0%{ scale: 1 1; } 35%{ scale: 1.18 .86; } 70%{ scale: .97 1.04; } 100%{ scale: 1 1; } }
.tab span{ white-space:nowrap; }
.tab{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:54px; border-radius:999px; color: var(--text-2); font-size:10.5px; font-weight:650; transition: color .25s; }
.tab svg{ width:24px; height:24px; transition: transform .45s var(--spring); }
.tab.on{ color: var(--text); }
.tab.on svg{ color: var(--accent); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent)); }
.tab.on svg{ transform: scale(1.08); color: var(--accent); }
.tab:active svg{ transform: scale(.85); }

/* ============================================================
   SHEET (player detail)
   ============================================================ */
.scrim{ position:fixed; inset:0; z-index:80; background: rgba(0,0,0,.35); opacity:0; transition: opacity .35s; pointer-events:none; }
.scrim.on{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:90; left:50%; bottom: calc(10px + var(--safe-b));
  width: min(560px, calc(100% - 20px));
  transform: translate(-50%, 120%);
  transition: transform .55s var(--spring);
  border-radius: 34px; padding: 10px 20px 24px;
  background: var(--glass-strong);
  max-height: 82vh; overflow:auto;
  visibility:hidden; transition: transform .55s var(--spring), visibility 0s .55s;
}
.sheet.on{ transform: translate(-50%, 0); visibility:visible; transition: transform .55s var(--spring), visibility 0s; }
.grabber{ width:40px; height:5px; border-radius:3px; background: var(--text-3); margin: 0 auto 14px; }
.ply-hero{ display:flex; align-items:center; gap:16px; margin-bottom:18px; }
.ply-hero .jersey.big{ width:64px; height:64px; font-size:24px; }
.ply-hero h3{ font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
.ply-hero p{ color: var(--text-2); font-size:14px; margin-top:4px; display:flex; align-items:center; gap:6px; }
.kv{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.kv div{ padding: 12px 14px; border-radius: var(--r-md); background: var(--glass); box-shadow: inset 0 1px 1px -0.5px var(--rim-a); }
.kv small{ display:block; font-size:12px; color: var(--text-2); font-weight:600; margin-bottom:3px; }
.kv b{ font-size:16px; font-weight:700; }

.foot{ text-align:center; color: var(--text-3); font-size:12px; margin-top: 30px; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>

function hslHex(h, s2, l){
  const k = n => (n + h/30) % 12, a = s2 * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, 9-k(n), 1));
  return rgbHex(f(0)*255, f(8)*255, f(4)*255);
}
const lumOf = hex => { const [r,g,b] = hexRgb(hex); return (0.299*r + 0.587*g + 0.114*b) / 255; };
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

/* Reads the dominant colours out of a crest (ESPN logos are served with CORS). */
function logoColors(url){
  return new Promise(resolve => {
    if (!url) return resolve([]);
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try{
        const N = 56, c = document.createElement('canvas'); c.width = c.height = N;
        const x = c.getContext('2d', { willReadFrequently:true }); x.drawImage(im, 0, 0, N, N);
        const d = x.getImageData(0, 0, N, N).data, buckets = new Map(); let dark = 0, colourful = 0;
        for (let i = 0; i < d.length; i += 4){
          if (d[i+3] < 200) continue;
          const [h, sat, l] = rgbHsl(d[i], d[i+1], d[i+2]);
          if (l < .14 && sat < .5){ dark++; continue; }
          if (sat < .28 || l > .9 || l < .12) continue;
          colourful++;
          const key = Math.round(h / 15) + ':' + Math.round(l * 5);
          const w = sat * sat;                                   // pure colours win over anti-aliased edges
          const bk = buckets.get(key) || { n:0, w:0, r:0, g:0, b:0, h };
          bk.n++; bk.w += w; bk.r += d[i]*w; bk.g += d[i+1]*w; bk.b += d[i+2]*w; buckets.set(key, bk);
        }
        const list = [...buckets.values()].sort((a, b) => b.w - a.w)
          .map(bk => ({ hex: rgbHex(bk.r/bk.w, bk.g/bk.w, bk.b/bk.w), h: bk.h, n: bk.n }));
        const out = [];
        for (const c2 of list){
          if (c2.n < colourful * 0.10) break;
          if (out.every(o => hueDist(o.h, c2.h) > 45)) out.push(c2);
          if (out.length === 3) break;
        }
        const res = out.map(o => o.hex);
        if (dark > colourful * 0.12) res.splice(1, 0, '#16161a');   // black is a real club colour (Frankfurt, Juventus …)
        resolve(res);
      } catch { resolve([]); }
    };
    im.onerror = () => resolve([]);
    im.src = url;
  });
}
const usable = hex => { if (!hex) return false; const [, sat, l] = rgbHsl(...hexRgb(hex)); return sat > .35 && l > .15 && l < .85; };

/* Club colours = ESPN's colour (if it's a real colour) + colours read from the crest. */
async function teamColors(team){
  if (!team.color && team.slug && team.slug !== 'nation' && team.id){
    try { team = { ...team, color: (await api(`site/v2/sports/soccer/${team.slug}/teams/${team.id}/schedule`)).team?.color }; } catch {}
  }
  const espn = team.color ? '#' + String(team.color).replace('#','') : null;
  const fromLogo = await logoColors(team.logo);
  const cols = [];
  if (usable(espn)) cols.push(espn);
  for (const c of fromLogo){
    if (cols.length >= 2) break;
    const [h] = rgbHsl(...hexRgb(c));
    if (cols.every(x => hueDist(rgbHsl(...hexRgb(x))[0], h) > 45 || Math.abs(lumOf(x) - lumOf(c)) > .35)) cols.push(c);
  }
  if (!cols.length) return { p: '#b8bcc6', s: '#2c2c32' };            // monochrome crest → graphite
  const [h0, s0] = rgbHsl(...hexRgb(cols[0]));
  return { p: cols[0], s: cols[1] || hslHex(h0, Math.min(s0, .8), .2) };   // one-colour crest → deep shade of it
}

const darkMQ = matchMedia('(prefers-color-scheme: dark)');
let currentTheme = null;
function applyTheme(theme){
  currentTheme = theme || null;
  const r = document.documentElement.style;
  if (!theme){
    r.setProperty('--accent', DEFAULT_ACCENT[0]); r.setProperty('--on-accent', '#fff');
    DEFAULT_ACCENT.forEach((c, i) => r.setProperty(`--blob-${i+1}`, c));
    return;
  }
  const { p, s: sec } = theme;
  const [h, sat, l] = rgbHsl(...hexRgb(p));
  // UI accent must stay readable on the current background
  let accent = p;
  if (darkMQ.matches && l < .38) accent = hslHex(h, Math.max(sat, .5), .58);
  if (!darkMQ.matches && l > .6) accent = hslHex(h, sat, .42);
  if (sat < .15) accent = darkMQ.matches ? '#d1d1d6' : '#3a3a3c';
  r.setProperty('--accent', accent);
  r.setProperty('--on-accent', lumOf(accent) > .62 ? '#111' : '#fff');
  const [h2, s2, l2] = rgbHsl(...hexRgb(sec));
  const secBlob = l2 < .12 ? (darkMQ.matches ? hslHex(h, Math.min(sat, .6), .22) : '#2a2a30') : sec;
  r.setProperty('--blob-1', p);
  r.setProperty('--blob-2', secBlob);
  r.setProperty('--blob-3', hslHex(h, Math.min(1, sat + .1), Math.min(.7, l + .12)));
  r.setProperty('--blob-4', secBlob);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.content = darkMQ.matches ? '#07090e' : '#eef1f7');
}
darkMQ.addEventListener?.('change', () => applyTheme(currentTheme));
/* Pages no longer re-tint the whole app; only the hero of a viewed team takes its colour. */
function setAccent(){}
async function tintHero(el, team){
  if (!el || !team) return;
  const espn = team.color ? '#' + String(team.color).replace('#','') : null;
  if (usable(espn)) { el.style.setProperty('--accent', espn); return; }
  const t = await teamColors(team);
  el.style.setProperty('--accent', t.p);
}

/* =============================================================
   PROFILE & AUTH
   ============================================================= */
const profile = () => store.get('fb.profile', null);
const saveProfile = pr => { store.set('fb.profile', pr); Auth.syncSoon(); };

/* =============================================================
   AUTH — Supabase (cloud) with a local fallback
   Fill in config.js to switch on real accounts. Without it the app
   keeps working in LOCAL MODE (profile only on this device).
   ============================================================= */
const CFG = window.ARENLY_CONFIG || {};
const SUPABASE_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js';
const loadScript = src => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('Supabase konnte nicht geladen werden.')); document.head.appendChild(sc); });
const AUTH_ERR = [
  [/already registered|already been registered|User already/i, 'Diese E-Mail ist bereits registriert. Melde dich stattdessen an.'],
  [/Invalid login credentials/i, 'E-Mail oder Passwort ist falsch.'],
  [/Email not confirmed/i, 'Bitte bestätige zuerst deine E-Mail-Adresse.'],
  [/rate limit|too many|For security purposes/i, 'Zu viele Versuche. Bitte warte kurz und versuche es erneut.'],
  [/Password should be|weak password/i, 'Das Passwort ist zu schwach. Bitte wähle ein längeres Passwort.'],
  [/invalid.*email|Unable to validate email/i, 'Diese E-Mail-Adresse ist ungültig.'],
  [/Error sending (confirmation|recovery|magic link|email change)|sending.*e?mail/i, 'Die E-Mail konnte gerade nicht verschickt werden. Bitte versuche es später erneut.'],
  [/Signups not allowed|signup.*disabled/i, 'Registrierungen sind im Moment nicht möglich.'],
  [/Failed to fetch|NetworkError|network/i, 'Keine Verbindung. Bitte prüfe deine Internetverbindung.'],
];
const authMsg = err => (AUTH_ERR.find(([re]) => re.test(err?.message || '')) || [0, err?.message || 'Unbekannter Fehler.'])[1];
const redirectUrl = () => location.origin + location.pathname;

const Auth = {
  cloud: !!(CFG.supabaseUrl && CFG.supabaseAnonKey),
  sb: null,
  user: null,
  _t: null,

  async init(){
    if (!this.cloud) return null;
    if (!window.supabase) await loadScript(SUPABASE_CDN);
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    this.sb.auth.onAuthStateChange((event, session) => {
      this.user = session?.user || null;
      if (event === 'PASSWORD_RECOVERY') startOnboarding(['newpass'], { edit:true, noBack:true });
    });
    const { data } = await this.sb.auth.getSession();
    this.user = data.session?.user || null;
    return this.user;
  },

  /* returns { profile } or { needsConfirm:true } */
  async register({ name, email, password }){
    name = name.trim(); email = email.trim().toLowerCase();
    if (!this.sb){
      const pr = { name, email, createdAt: new Date().toISOString() };
      saveProfile(pr); return { profile: pr };
    }
    const { data, error } = await this.sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: redirectUrl() } });
    if (error) throw new Error(authMsg(error));
    // Supabase answers an existing, confirmed address with a user without identities
    if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw new Error(authMsg({ message:'already registered' }));
    if (!data.session) return { needsConfirm: true, email };
    this.user = data.user;
    const pr = { name, email, createdAt: new Date().toISOString() };
    store.set('fb.profile', pr); await this.pushNow();
    return { profile: pr };
  },

  async login({ email, password }){
    const { data, error } = await this.sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
    if (error) throw new Error(authMsg(error));
    this.user = data.user;
    return { profile: await this.pull() };
  },

  async resetPassword(email){
    const { error } = await this.sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: redirectUrl() });
    if (error) throw new Error(authMsg(error));
  },
  async updatePassword(password){
    const { error } = await this.sb.auth.updateUser({ password });
    if (error) throw new Error(authMsg(error));
  },
  async resend(email){
    const { error } = await this.sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: redirectUrl() } });
    if (error) throw new Error(authMsg(error));
  },
  async apple(){
    const { error } = await this.sb.auth.signInWithOAuth({ provider: 'apple', options: { redirectTo: redirectUrl() } });
    if (error) throw new Error(authMsg(error));
  },

  /* ---- profile sync: table public.profiles (see supabase/schema.sql) ---- */
  async pull(){
    if (!this.sb || !this.user) return profile();
    const { data, error } = await this.sb.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
    if (error) { console.warn('profile pull', error); return profile(); }
    const meta = this.user.user_metadata || {};
    const pr = {
      ...(profile() || {}),
      name: data?.name || meta.name || meta.full_name || profile()?.name || (this.user.email || '').split('@')[0],
      email: this.user.email,
      ...(data?.club ? { club: data.club } : {}),
      ...(data?.nation ? { nation: data.nation } : {}),
      ...(data?.league ? { league: data.league } : {}),
      ...(data?.theme ? { theme: data.theme } : {}),
    };
    store.set('fb.profile', pr);
    if (Array.isArray(data?.favs)) store.set('fb.favs', data.favs);
    if (!data) await this.pushNow();         // first login on a fresh account → create the row
    return pr;
  },
  async pushNow(){
    if (!this.sb || !this.user) return;
    const pr = profile() || {};
    const row = {
      id: this.user.id, name: pr.name || null, club: pr.club || null, nation: pr.nation || null,
      theme: pr.theme || null, favs: favs(), updated_at: new Date().toISOString(),
    };
    if (!this.noLeagueCol) row.league = pr.league || null;
    let { error } = await this.sb.from('profiles').upsert(row);
    if (error && /league/.test(error.message || '')){        // database not migrated yet → save the rest anyway
      this.noLeagueCol = true; delete row.league;
      ({ error } = await this.sb.from('profiles').upsert(row));
    }
    if (error) console.warn('profile push', error);
  },
  syncSoon(){
    if (!this.sb || !this.user) return;
    clearTimeout(this._t); this._t = setTimeout(() => this.pushNow(), 600);
  },

  async signOut(){
    try { await this.sb?.auth.signOut(); } catch {}
    this.user = null;
    try { localStorage.removeItem('fb.profile'); localStorage.removeItem('fb.favs'); } catch {}
  },
};

/* ---------- normalise an ESPN event ---------- */
function normEvent(e, slug){
  const c = e.competitions?.[0] || {};
  const status = c.status || e.status || {};
  const t = status.type || {};
  const pick = side => c.competitors?.find(x => x.homeAway === side) || {};
  const team = x => ({
    id: x.team?.id,
    name: cn(tn(x.team?.shortDisplayName || x.team?.displayName || '—')),
    full: cn(tn(x.team?.displayName)),
    logo: x.team?.logo || x.team?.logos?.[0]?.href,
    color: x.team?.color,
    score: typeof x.score === 'object' ? x.score?.displayValue : x.score,
    winner: x.winner,
  });
  return {
    id: e.id, slug, date: e.date,
    state: t.state, name: t.name, detail: t.shortDetail || t.detail, completed: t.completed,
    clock: status.displayClock,
    home: team(pick('home')), away: team(pick('away')),
    venue: c.venue?.fullName || e.venue?.displayName,
  };
}
/* ---------- Where is it on TV? (Germany, rights 2026/27) ----------
   Derived from who owns which rights package, by competition, weekday and kick-off time (Berlin).
   Only competitions with confirmed rights are listed – everything else shows nothing. */
function tvGermany(m){
  if (!m || m.state === 'post' || !m.date) return null;
  const d = new Date(m.date);
  const day = d.toLocaleDateString('en-GB', { weekday:'short', timeZone:'Europe/Berlin' });      // Mon … Sun
  const hm  = d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/Berlin' });
  const GER = '481', home = String(m.home?.id), away = String(m.away?.id);
  switch (m.slug){
    case 'ger.1':
      if (day === 'Sun') return { ch:['DAZN'] };
      if (day === 'Sat') return hm === '15:30' ? { ch:['Sky', 'DAZN'], note:'Einzelspiel bei Sky, Konferenz bei DAZN' } : { ch:['Sky'] };
      if (day === 'Fri') return { ch:['Sky'] };
      return { ch:['Sky', 'DAZN'], note:'Englische Woche: Einzelspiele bei Sky, Konferenz bei DAZN' };
    case 'ger.2':
      return day === 'Sat' && hm === '20:30' ? { ch:['RTL', 'Sky'], note:'Topspiel frei bei RTL' } : { ch:['Sky'] };
    case 'ger.dfb_pokal':  return { ch:['Sky'], note:'Ausgewählte Spiele auch frei bei ARD, ZDF oder RTL' };
    case 'uefa.champions': return day === 'Tue' ? { ch:['DAZN', 'Prime Video'], note:'Das Dienstags-Topspiel zeigt Prime Video, alle anderen Spiele DAZN' } : { ch:['DAZN'] };
    case 'uefa.europa':
    case 'uefa.europa.conf': return { ch:['RTL+'], note:'Ein ausgewähltes Spiel pro Spieltag frei bei RTL oder NITRO' };
    case 'eng.1': return { ch:['Sky'] };
    case 'esp.1': return { ch:['DAZN'] };
    case 'ita.1': return { ch:['DAZN'] };
  }
  if (home === GER || away === GER){
    if (['uefa.nations', 'fifa.worldq.uefa', 'uefa.euroq'].includes(m.slug))
      return away === GER ? { ch:['RTL'] } : { ch:['ARD', 'ZDF'], note:'Heimspiele zeigen ARD oder ZDF im Wechsel' };
    if (m.slug === 'fifa.friendly') return { ch:['ARD', 'ZDF', 'RTL'], note:'Testspiele laufen bei ARD, ZDF oder RTL' };
  }
  return null;
}

function statusLabel(m){
  if (m.name === 'STATUS_POSTPONED') return { txt:'Verlegt' };
  if (m.name === 'STATUS_CANCELED') return { txt:'Abgesagt' };
  if (m.state === 'in'){
    if (m.name === 'STATUS_HALFTIME') return { txt:'Halbzeit', live:true };
    return { txt: m.clock || 'Live', live:true };
  }
  if (m.state === 'post'){
    const d = (m.detail || '').toUpperCase();
    if (d.includes('PEN')) return { txt:'n. E.' };
    if (d.includes('AET')) return { txt:'n. V.' };
    return { txt:'Ende' };
  }
  return { txt: fmtDay(m.date) };
}
/* ---------- countdown & "add to calendar" for the next match ---------- */
function countdownText(iso){
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'Anpfiff!';
  const min = Math.floor(ms / 60000), h = Math.floor(min / 60), d = Math.floor(h / 24);
  if (min < 60) return `in ${min} Min.`;
  if (h < 24) return `in ${h} Std. ${min % 60} Min.`;
  return `in ${d} ${d === 1 ? 'Tag' : 'Tagen'} ${h % 24} Std.`;
}
const calMatches = new Map();
function nextBar(m){
  if (!m || m.state !== 'pre') return '';
  calMatches.set(String(m.id), m);
  return `<div class="nb-bar glass flat"><span class="cd" data-t="${esc(m.date)}">⏱ ${esc(countdownText(m.date))}</span>
    <button class="cal" data-cal="${esc(m.id)}" aria-label="In Kalender eintragen">📅 In Kalender</button></div>`;
}
setInterval(() => document.querySelectorAll('.cd[data-t]').forEach(el => { el.textContent = '⏱ ' + countdownText(el.dataset.t); }), 20000);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cal]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const m = calMatches.get(b.dataset.cal); if (m) addToCalendar(m);
});
function addToCalendar(m){
  const z = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const icsText = x => String(x || '').replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
  const start = new Date(m.date), end = new Date(start.getTime() + 115 * 60000);
  const tv = tvGermany(m);
  const title = `${m.home.full || m.home.name} – ${m.away.full || m.away.name}`;
  const desc = [compName(m.slug), tv ? 'Live bei ' + tv.ch.join(' / ') : '', location.origin + location.pathname + `#/match/${m.slug}/${m.id}`].filter(Boolean).join('\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Arenly//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT', `UID:arenly-${m.id}@arenly`, `DTSTAMP:${z(new Date())}`, `DTSTART:${z(start)}`, `DTEND:${z(end)}`,
    `SUMMARY:⚽ ${icsText(title)}`, m.venue ? `LOCATION:${icsText(m.venue)}` : '', `DESCRIPTION:${icsText(desc)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', `DESCRIPTION:${icsText('Anpfiff in 30 Minuten: ' + title)}`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
  // home-screen apps on iOS can't download files – a data URL opens the "add to calendar" sheet directly
  if (navigator.standalone){ location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics); return; }
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.setAttribute('download', `arenly-${norm(m.home.name + '-' + m.away.name).replace(/[^a-z0-9-]+/g, '-')}.ics`);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast('Termin wird zum Kalender hinzugefügt');
}

function matchCard(m, { showDate = false, comp = false, tv = false } = {}){
  const st = statusLabel(m);
  const played = m.state !== 'pre' && m.home.score != null;
  const hl = played && m.state === 'post' && m.away.winner ? 'loser' : '';
  const al = played && m.state === 'post' && m.home.winner ? 'loser' : '';
  const mid = played
    ? `<div class="score">${esc(m.home.score)} : ${esc(m.away.score)}</div>`
    : `<div class="time">${m.name === 'STATUS_POSTPONED' ? '–:–' : fmtTime(m.date)}</div>`;
  const stHtml = st.live ? `<div class="st live"><span class="pulse"></span>${esc(st.txt)}</div>` : `<div class="st">${esc(played ? st.txt : (showDate ? fmtDay(m.date) : st.txt))}</div>`;
  return `<a class="match glass flat press" href="#/match/${esc(m.slug)}/${esc(m.id)}">
    <div class="side ${hl}">${img(m.home.logo, 'logo sm', m.home.name)}<span class="nm">${esc(m.home.name)}</span></div>
    <div class="mid">${mid}${stHtml}</div>
    <div class="side away ${al}">${img(m.away.logo, 'logo sm', m.away.name)}<span class="nm">${esc(m.away.name)}</span></div>
    ${(() => { const t = tv && !played ? tvGermany(m) : null;
      const meta = [comp && compName(m.slug), showDate && played && fmtDay(m.date), t && '📺 ' + t.ch.join(' / ')].filter(Boolean).join(' · ');
      return meta ? `<div class="meta">${esc(meta)}</div>` : ''; })()}
  </a>`;
}

/* ---------- League ---------- */
async function standings(slug){
  const d = await api(`v2/sports/soccer/${slug}/standings`, { ttl: 5 * 60_000 });
  const groups = (d.children || (d.standings ? [d] : [])).map(g => ({
    name: g.name,
    entries: (g.standings?.entries || []).map(e => {
      const s = {}; (e.stats || []).forEach(x => s[x.name] = x.displayValue ?? x.value);
      return {
        team: { id: e.team.id, name: tn(e.team.shortDisplayName || e.team.displayName), full: tn(e.team.displayName), en: e.team.displayName, logo: e.team.logos?.[0]?.href },
        s, note: e.note,
      };
    }).sort((a, b) => (+a.s.rank || 99) - (+b.s.rank || 99)),
  })).filter(g => g.entries.length);
  return groups;
}

async function paneLeague(slug, tab, my){
  const pane = $('#pane');
  pane.innerHTML = skeleton(6, tab === 'teams' ? 110 : 52);
  try{
    if (tab === 'table'){
      const groups = await standings(slug);
      if (my !== token) return;
      if (!groups.length){ pane.innerHTML = emptyBox('📋', 'Keine Tabelle verfügbar'); return; }
      const favIds = new Set(favs().map(f => f.id));
      const notes = new Map();
      pane.innerHTML = groups.map(g => `
        ${groups.length > 1 ? `<div class="group-title">${esc(g.name)}</div>` : ''}
        <div class="table glass">
          <div class="trow head wide-able">
            <span class="c">#</span><span>Team</span><span class="c">Sp</span>
            <span class="c col-wide">S</span><span class="c col-wide">U</span><span class="c col-wide">N</span><span class="c col-wide">Tore</span>
            <span class="c">TD</span><span class="c">Pkt</span>
          </div>
          ${g.entries.map(e => {
            if (e.note) notes.set(e.note.color, e.note.description);
            return `<a class="trow wide-able ${favIds.has(e.team.id) ? 'hl' : ''}" href="#/team/${esc(slug)}/${esc(e.team.id)}">
              ${e.note ? `<span class="zone" style="background:${esc(e.note.color)}"></span>` : ''}
              <span class="rk">${esc(e.s.rank)}</span>
              <span class="team">${img(e.team.logo, 'logo xs', e.team.name)}<span>${esc(e.team.name)}</span></span>
              <span class="c">${esc(e.s.gamesPlayed)}</span>
              <span class="c col-wide">${esc(e.s.wins)}</span><span class="c col-wide">${esc(e.s.ties)}</span><span class="c col-wide">${esc(e.s.losses)}</span>
              <span class="c col-wide">${esc(e.s.pointsFor)}:${esc(e.s.pointsAgainst)}</span>
              <span class="c">${esc(e.s.pointDifferential)}</span>
              <span class="pts">${esc(e.s.points)}</span>
            </a>`;
          }).join('')}
        </div>`).join('') +
        (notes.size ? `<div class="legend">${[...notes].map(([c, d]) => `<span><i style="background:${esc(c)}"></i>${esc(de(d))}</span>`).join('')}</div>` : '');
      // wide layout toggles grid columns
      const wide = matchMedia('(min-width:560px)').matches;
      pane.querySelectorAll('.wide-able').forEach(r => r.classList.toggle('wide', wide));
    }

    if (tab === 'teams'){
      const groups = await standings(slug);
      if (my !== token) return;
      const teams = groups.flatMap(g => g.entries.map(e => e.team)).sort((a, b) => a.name.localeCompare(b.name, 'de'));
      pane.innerHTML = teams.length ? `<div class="team-grid">${teams.map(t => `
        <a class="team-tile glass flat press" href="#/team/${esc(slug)}/${esc(t.id)}">${img(t.logo, '', t.name)}<span>${esc(t.name)}</span></a>`).join('')}</div>`
        : emptyBox('👥', 'Keine Teams gefunden');
    }

    if (tab === 'games'){
      const base = await api(`site/v2/sports/soccer/${slug}/scoreboard`);
      if (my !== token) return;
      let cal = base.leagues?.[0]?.calendar || [];
      cal = cal.flatMap(c => typeof c === 'string' ? [c] : (c.entries || []).map(x => x.startDate || x.value)).filter(Boolean);
      const days = [...new Set(cal.map(c => c.slice(0, 10)))].sort();
      const today = new Date(); const todayKey = today.toISOString().slice(0, 10);
      let sel = state.leagueTab[slug + ':day'];
      if (!sel || !days.includes(sel)){
        // pick today, else nearest upcoming within 4 days, else most recent past day
        sel = days.find(d => d === todayKey)
          || days.find(d => d > todayKey && (new Date(d) - today) < 4 * 864e5)
          || [...days].reverse().find(d => d < todayKey)
          || days[0];
      }
      const chips = days.length ? `<div class="chips" id="dchips">${days.map(d => {
        const dt = new Date(d + 'T12:00:00');
        return `<button class="chip glass flat ${d === sel ? 'on' : ''}" data-d="${d}"><small>${dt.toLocaleDateString('de-DE',{weekday:'short'})}</small>${dt.toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</button>`;
      }).join('')}</div>` : '';
      pane.innerHTML = chips + `<div id="dlist">${skeleton(4)}</div>`;
      const loadDay = async d => {
        state.leagueTab[slug + ':day'] = d;
        const list = $('#dlist'); if (!list) return;
        list.innerHTML = skeleton(4);
        try{
          const data = d ? await api(`site/v2/sports/soccer/${slug}/scoreboard?dates=${d.replace(/-/g, '')}`) : base;
          if (my !== token) return;
          const ms = (data.events || []).map(e => normEvent(e, slug)).sort((a, b) => new Date(a.date) - new Date(b.date));
          list.innerHTML = ms.length ? `<div class="matches">${ms.map(m => matchCard(m)).join('')}</div>` : emptyBox('🗓️', 'Keine Spiele an diesem Tag');
          scheduleRefresh(ms.some(m => m.state === 'in'));
        } catch(err){ list.innerHTML = errorBox(err); }
      };
      $('#dchips')?.addEventListener('click', e => {
        const b = e.target.closest('.chip'); if (!b) return;
        $('#dchips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
        b.scrollIntoView({ inline:'center', behavior:'smooth', block:'nearest' });
        loadDay(b.dataset.d);
      });
      $('#dchips .chip.on')?.scrollIntoView({ inline:'center', block:'nearest' });
      loadDay(sel);
    }
  } catch(err){
    if (my === token) pane.innerHTML = errorBox(err);
  }
}

/* ---------- Team ---------- */
async function loadSchedules(slug, id){
  if (slug !== 'nation'){
    const [results, fixtures] = await Promise.all([
      api(`site/v2/sports/soccer/${slug}/teams/${id}/schedule`),
      api(`site/v2/sports/soccer/${slug}/teams/${id}/schedule?fixture=true`).catch(() => ({ events: [] })),
    ]);
    return { results, fixtures };
  }
  const tag = (d, sl) => (d.events || []).map(e => (e.__slug = sl, e));
  const all = await Promise.allSettled((await nationSlugs(id)).flatMap(sl => [
    api(`site/v2/sports/soccer/${sl}/teams/${id}/schedule`).then(d => ({ d, sl, fx:false })),
    api(`site/v2/sports/soccer/${sl}/teams/${id}/schedule?fixture=true`).then(d => ({ d, sl, fx:true })),
  ]));
  const ok = all.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (!ok.length) throw all[0].reason;
  const team = ok.find(x => x.d.team)?.d.team || {};
  const uniq = list => [...new Map(list.map(e => [e.id, e])).values()].sort((a, b) => new Date(a.date) - new Date(b.date));
  const evs = uniq(ok.flatMap(x => tag(x.d, x.sl)));
  return {
    results:  { team: { ...team, standingSummary: '', recordSummary: '' }, events: evs.filter(e => (e.competitions?.[0]?.status?.type?.state) !== 'pre') },
    fixtures: { team, events: evs.filter(e => (e.competitions?.[0]?.status?.type?.state) === 'pre') },
  };
}

/* ---------- Player sheet ---------- */
function openPlayer(a, team){
  const cm = a.height ? Math.round(a.height * 2.54) : null;
  const kg = a.weight ? Math.round(a.weight * 0.4536) : null;
  const born = a.dateOfBirth ? new Date(a.dateOfBirth).toLocaleDateString('de-DE', { day:'numeric', month:'long', year:'numeric' }) : null;
  const place = a.birthPlace ? [a.birthPlace.city, cn(a.birthPlace.country)].filter(Boolean).join(', ') : null;
  const kv = [
    ['Position', POS[a.position?.name] || a.position?.displayName],
    ['Rückennummer', a.jersey],
    ['Alter', a.age ? `${a.age} Jahre` : null],
    ['Nationalität', cn(a.citizenship)],
    ['Geboren', born],
    ['Geburtsort', place],
    ['Größe', cm ? `${(cm/100).toFixed(2).replace('.', ',')} m` : null],
    ['Gewicht', kg ? `${kg} kg` : null],
  ].filter(x => x[1]);
  $('#sheet').innerHTML = `<div class="grabber"></div>
    <div class="ply-hero">
      <div class="av ply-photo"><img alt="" data-pid="${esc(a.id)}" data-pname="${esc(a.displayName)}" data-pteam="${esc(team.displayName || '')}" data-pfb="${esc(a.headshot?.href || '')}"><b>${esc(a.jersey || '–')}</b></div>
      <div><h3>${esc(a.displayName)}</h3>
      <p>${a.flag?.href ? `<img class="flag" src="${esc(a.flag.href)}" alt="">` : ''}${esc(team.shortDisplayName || team.displayName || '')}</p></div>
    </div>
    <div class="kv">${kv.map(([k, v]) => `<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>
    <button class="btn ghost" style="width:100%;margin-top:18px" onclick="closeSheet()">Schließen</button>`;
  hydratePhotos($('#sheet'));
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').onclick = closeSheet;
(() => { // swipe down to dismiss
  let y0 = null; const s = $('#sheet');
  s.addEventListener('touchstart', e => { if (s.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive:true });
  s.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); s.style.transition = 'none'; s.style.transform = `translate(-50%, ${dy}px)`; }, { passive:true });
  s.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; s.style.transition = ''; s.style.transform = ''; y0 = null; if (dy > 90) closeSheet(); });
})();
