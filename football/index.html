/* ---------- Player sheet ---------- */
function openPlayer(a, team){
  const cm = a.height ? Math.round(a.height * 2.54) : null;
  const kg = a.weight ? Math.round(a.weight * 0.4536) : null;
  const born = a.dateOfBirth ? new Date(a.dateOfBirth).toLocaleDateString('de-DE', { day:'numeric', month:'long', year:'numeric' }) : null;
  const place = a.birthPlace ? [a.birthPlace.city, cn(a.birthPlace.country)].filter(Boolean).join(', ') : null;
  const kv = [
    ['Position', POS[a.position?.name] || a.position?.displayName],
    ['Rückennummer', a.jersey],
    ['Alter', a.age ? `${a.age} Jahre` : null],
    ['Nationalität', cn(a.citizenship)],
    ['Geboren', born],
    ['Geburtsort', place],
    ['Größe', cm ? `${(cm/100).toFixed(2).replace('.', ',')} m` : null],
    ['Gewicht', kg ? `${kg} kg` : null],
  ].filter(x => x[1]);
  $('#sheet').innerHTML = `<div class="grabber"></div>
    <div class="ply-hero">
      <div class="av ply-photo"><img alt="" data-pid="${esc(a.id)}" data-pname="${esc(a.displayName)}" data-pteam="${esc(team.displayName || '')}" data-pfb="${esc(a.headshot?.href || '')}"><b>${esc(a.jersey || '–')}</b></div>
      <div><h3>${esc(a.displayName)}</h3>
      <p>${a.flag?.href ? `<img class="flag" src="${esc(a.flag.href)}" alt="">` : ''}${esc(team.shortDisplayName || team.displayName || '')}</p></div>
    </div>
    <div class="kv">${kv.map(([k, v]) => `<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>
    <a class="btn" style="width:100%;margin-top:18px" href="#/player/${esc(a.id)}">Spielerprofil öffnen</a>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">Schließen</button>`;
  hydratePhotos($('#sheet'));
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').onclick = closeSheet;
(() => { // swipe down to dismiss
  let y0 = null; const s = $('#sheet');
  s.addEventListener('touchstart', e => { if (s.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive:true });
  s.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); s.style.transition = 'none'; s.style.transform = `translate(-50%, ${dy}px)`; }, { passive:true });
  s.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; s.style.transition = ''; s.style.transform = ''; y0 = null; if (dy > 90) closeSheet(); });
})();

/* ---------- Match ---------- */
async function renderMatch(slug, id, fresh = false){
  const my = ++token;
  if (!fresh) view.innerHTML = `<div class="view">${navBar('Spiel')}<div id="mbody">${skeleton(1, 230)}${skeleton(6, 48)}</div></div>`;
  try{
    const d = await api(`site/v2/sports/${sp(slug)}/summary?event=${id}`, { fresh, ttl: 20_000 });
    if (my !== token) return;
    const comp = d.header?.competitions?.[0];
    const m = normEvent({ id, date: comp?.date, competitions: [comp], status: comp?.status }, slug);
    m.home.logo ||= comp.competitors.find(c => c.homeAway === 'home')?.team?.logos?.[0]?.href;
    m.away.logo ||= comp.competitors.find(c => c.homeAway === 'away')?.team?.logos?.[0]?.href;
    $('.nav-title').textContent = `${m.home.name} – ${m.away.name}`;
    const st = statusLabel(m);
    const played = m.state !== 'pre';
    const L = leagueBy(slug);
    const gi = d.gameInfo || {};
    const ref = gi.officials?.find(o => o.position?.name === 'Referee')?.displayName;

    if (!isSoccer(slug)) return renderUsMatch(d, m, slug, comp, my);
    const hasEvents = (d.keyEvents || []).length > 0;
    const hasStats = m.state !== 'pre' && (d.boxscore?.teams || []).some(t => (t.statistics || []).some(x => parseFloat(x.displayValue) > 0));
    const hasLineups = (d.rosters || []).some(r => (r.roster || []).length);
    const hasTicker = (d.commentary || []).length > 0;
    const tabs = [hasTicker && ['ticker','Ticker'], hasEvents && ['events','Verlauf'], hasStats && ['stats','Statistik'], hasLineups && ['lineups','Aufstellung']].filter(Boolean);
    if (m.state === 'in' && hasTicker && !state.matchTabChosen) state.matchTab = 'ticker';
    if (!tabs.some(t => t[0] === state.matchTab) && tabs.length) state.matchTab = tabs[0][0];

    $('#mbody').innerHTML = `
      <section class="hero glass" id="mhero">
        <div class="glow"></div>
        <div style="font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px">${esc(L.logo ? L.name : (compName(slug) || L.name))}</div>
        <div class="scoreboard">
          <a class="tm" href="#/team/${esc(slug)}/${esc(m.home.id)}">${img(m.home.logo, '', m.home.name)}<span>${esc(m.home.full || m.home.name)}</span></a>
          <div class="res">
            ${played ? `<div class="num">${esc(m.home.score ?? 0)}:${esc(m.away.score ?? 0)}</div>` : `<div class="num pre">${fmtTime(m.date)}</div>`}
            <div class="stt ${st.live ? 'live' : ''}">${st.live ? '<span class="pulse"></span>' : ''}${esc(played ? st.txt : fmtDay(m.date))}</div>
          </div>
          <a class="tm" href="#/team/${esc(slug)}/${esc(m.away.id)}">${img(m.away.logo, '', m.away.name)}<span>${esc(m.away.full || m.away.name)}</span></a>
        </div>
        <div class="info">
          ${played ? `<span>🗓 ${esc(new Date(m.date).toLocaleDateString('de-DE',{ weekday:'short', day:'numeric', month:'short' }))}, ${fmtTime(m.date)}</span>` : ''}
          ${gi.venue?.fullName ? `<span>🏟 ${esc(gi.venue.fullName)}${gi.venue.address?.city ? ', ' + esc(gi.venue.address.city) : ''}</span>` : ''}
          ${gi.attendance ? `<span>👥 ${Number(gi.attendance).toLocaleString('de-DE')}</span>` : ''}
          ${ref ? `<span>🧑‍⚖️ ${esc(ref)}</span>` : ''}
        </div>
        ${(() => { const tv = tvGermany(m); return tv ? `<div class="tv">
          <div class="chs"><span class="lbl">📺 ${m.state === 'in' ? 'Läuft live bei' : 'Live bei'}</span>${tv.ch.map(c => `<span class="ch">${esc(c)}</span>`).join('')}</div>
          <div class="note">${tv.note ? esc(tv.note) + ' · ' : ''}TV in Deutschland laut Rechtevergabe, ohne Gewähr</div>
        </div>` : ''; })()}
      </section>
      ${tabs.length > 1 ? seg('mseg', tabs, state.matchTab) : ''}
      <div id="pane"></div>`;

    tintHero($('#mhero'), { color: m.home.color, logo: m.home.logo });
    goalWatch(m);
    const homeId = m.home.id;
    const pane = k => {
      state.matchTab = k;
      const p = $('#pane');
      if (!tabs.length){ p.innerHTML = emptyBox('⏳', played ? 'Keine Details verfügbar' : 'Das Spiel hat noch nicht begonnen', played ? '' : 'Aufstellungen erscheinen kurz vor Anpfiff.'); return; }
      if (k === 'ticker') p.innerHTML = tickerView(d.commentary, m.state === 'in');
      if (k === 'events') p.innerHTML = timeline(d.keyEvents, homeId);
      if (k === 'stats') p.innerHTML = statsView(d.boxscore.teams, homeId, m);
      if (k === 'lineups'){
        p.innerHTML = lineups(d.rosters, d.keyEvents, m);
        hydratePhotos(p);
        p.querySelectorAll('[data-ply]').forEach(el => el.onclick = () => {
          const id = el.dataset.ply;
          for (const r of d.rosters || []){
            const pl = (r.roster || []).find(x => String(x.athlete?.id) === id);
            if (pl){
              const tc = getComputedStyle(el.querySelector('.ph, .av') || el).getPropertyValue('--tc') || 'var(--accent)';
              const e = {}; (d.keyEvents || []).forEach(k => { if (k.participants?.[0]?.athlete?.id !== id) return; const t = k.type?.type || '';
                if (t === 'yellow-card') e.y = 1; else if (t.includes('red')) e.r = 1; else if ((t.startsWith('goal') || k.scoringPlay) && t !== 'own-goal' && !k.shootout) e.g = (e.g || 0) + 1; });
              return openLineupPlayer(pl, r, tc.trim() || 'var(--accent)', e);
            }
          }
        });
      }
      if (k === 'stats') requestAnimationFrame(() => p.querySelectorAll('.bars i').forEach(i => i.style.width = i.dataset.w));
    };
    bindSeg('mseg', k => { state.matchTabChosen = true; pane(k); });
    pane(state.matchTab);
    scheduleRefresh(m.state === 'in');
  } catch(err){
    if (my === token) $('#mbody').innerHTML = errorBox(err);
  }
}

/* ---------- live table: fold in the current score of running matches ---------- */
function applyLive(groups, liveMatches){
  const num = v => +String(v ?? 0).replace('+', '') || 0;
  return groups.map(g => {
    const entries = g.entries.map(e => ({ ...e, s: { ...e.s }, oldRank: num(e.s.rank) }));
    const by = id => entries.find(e => String(e.team.id) === String(id));
    let touched = false;
    for (const m of liveMatches){
      const H = by(m.home.id), A = by(m.away.id); if (!H || !A) continue;
      touched = true;
      const hs = +m.home.score || 0, as = +m.away.score || 0;
      for (const [E, f, a] of [[H, hs, as], [A, as, hs]]){
        E.s.gamesPlayed = num(E.s.gamesPlayed) + 1;
        E.s.pointsFor = num(E.s.pointsFor) + f; E.s.pointsAgainst = num(E.s.pointsAgainst) + a;
        E.s.points = num(E.s.points) + (f > a ? 3 : f === a ? 1 : 0);
        if (f > a) E.s.wins = num(E.s.wins) + 1; else if (f === a) E.s.ties = num(E.s.ties) + 1; else E.s.losses = num(E.s.losses) + 1;
        const d = E.s.pointsFor - E.s.pointsAgainst; E.s.pointDifferential = d > 0 ? '+' + d : String(d);
        E.live = { score: E === H ? `${hs}:${as}` : `${as}:${hs}`, res: f > a ? 'S' : f === a ? 'U' : 'N' };
      }
    }
    if (!touched) return g;
    entries.sort((x, y) => num(y.s.points) - num(x.s.points) || num(y.s.pointDifferential) - num(x.s.pointDifferential) || num(y.s.pointsFor) - num(x.s.pointsFor));
    entries.forEach((e, i) => { e.s.rank = i + 1; e.delta = e.oldRank - (i + 1); });
    return { ...g, entries, live: true };
  });
}

function timeline(events, homeId){

      icon = '<span class="ic">⚽</span>';

async function tsdbSearch(q){                       // free API: stay below ~30 requests per minute
  for (;;){
    const now = Date.now(); tsdbStamps = tsdbStamps.filter(t => now - t < 60000);
    if (tsdbStamps.length < 25) break;
    await sleep(60050 - (now - tsdbStamps[0]));
  }
  tsdbStamps.push(Date.now());
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p=${encodeURIComponent(q)}`);
  if (r.status === 429){ for (let i = 0; i < 25; i++) tsdbStamps.push(Date.now()); return tsdbSearch(q); }
  const d = await r.json();

}
const tsdbImg = x => x && (x.strCutout || x.strThumb || x.strRender);
async function lookupPhoto({ name, team, fallback }){
  try{
    const l1 = await tsdbSearch(name);
    let hit = l1.find(x => tsdbImg(x) && samePerson(x.strPlayer, name));
    if (!hit){                                       // spelling variants: search the surname, keep the one from this club
      const last = fold(name).split(' ').pop();
      if (last && last.length >= 3){
        const l2 = await tsdbSearch(last);
        hit = l2.find(x => tsdbImg(x) && sameTeam(x.strTeam, team) && fold(x.strPlayer).split(' ').includes(last))
           || l2.find(x => tsdbImg(x) && samePerson(x.strPlayer, name));

  } catch { return fallback || null; }
}
function playerPhoto(id, name, team, fallback){
  if (fallback && /\/headshots\/(?!soccer)/.test(fallback)) return Promise.resolve(fallback);
  const c = photoMem[id];
  if (c && (c.u || Date.now() - c.t < 7 * 864e5)) return Promise.resolve(c.u || fallback || null);
  return new Promise(res => { photoQueue.push({ id, name, team, fallback, res }); pumpPhotos(); });

  while (photoWorkers < 3 && photoQueue.length){

function posDepth(a){
  a = (a || '').toUpperCase();
  if (a === 'G' || a === 'GK') return 0;
  if (/WB/.test(a)) return 1.5;
  if (/^(CD|CB|LB|RB|SW|D\b|D-)/.test(a)) return 1;
  if (/^(DM|CDM)/.test(a)) return 2;
  if (/^(CM|LM|RM|M\b|M-)/.test(a)) return 3;
  if (/^(AM|CAM|LW|RW)/.test(a)) return 4;
  if (/^(CF|SS)/.test(a)) return 5;

}
function posSide(a){                       // -2 left … +2 right, from the team's own view
  a = (a || '').toUpperCase();

function formationLines(starters, formation){

  const keeper = gk[0] || starters.slice().sort((a, b) => (+a.formationPlace || 99) - (+b.formationPlace || 99))[0];
  const out = starters.filter(p => p !== keeper)
    .sort((a, b) => posDepth(a.position?.abbreviation) - posDepth(b.position?.abbreviation) || (+a.formationPlace || 99) - (+b.formationPlace || 99));
  const counts = String(formation || '').split('-').map(Number).filter(n => n > 0);
  let lines = [];
  if (counts.length && counts.reduce((x, y) => x + y, 0) === out.length){
    let i = 0; lines = counts.map(c => out.slice(i, i += c));
  } else {                                  // no/odd formation: group by role
    const by = new Map(); out.forEach(p => { const d = Math.round(posDepth(p.position?.abbreviation)); (by.get(d) || by.set(d, []).get(d)).push(p); });
    lines = [...by.keys()].sort((a, b) => a - b).map(k => by.get(k));

  };
  const half = (r, tc, top) => {
    const { keeper, lines } = formationLines(r.roster.filter(p => p.starter), r.formation);
    const n = lines.length;
    const widest = Math.max(1, ...lines.map(l => l.length));
    const colGap = k => k > 1 ? Math.min(22, 80 / (k - 1)) : 0;
    const g = geo(n);
    const size = Math.min(g.ps, widest > 1 ? Math.floor(colGap(widest) / 100 * W) - 8 : 42);
    const place = (x, y) => top ? [100 - x, 100 - y] : [x, y];       // away team attacks downwards
    let html = keeper ? player(keeper, ...place(50, g.gkY), r, tc, size, 84) : '';
    lines.forEach((line, i) => {
      const y = g.gkY - (i + 1) * g.gap;
      const k = line.length, gap = colGap(k), pw = k > 1 ? Math.min(84, gap / 100 * W - 4) : 84;
      line.forEach((p, j) => { html += player(p, ...place(50 + (j - (k - 1) / 2) * gap, y), r, tc, size, pw); });
    });
    return html;
  };
  const tag = (r, cls) => `<div class="tm-tag ${cls}">${img(r.team?.logos?.[0]?.href || r.team?.logo, '', '')}${esc(teamName(r))}${r.formation ? `<span>${esc(r.formation)}</span>` : ''}</div>`;
  const lines = `<svg class="lines" viewBox="0 0 100 170" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".5">
    <rect x="4" y="4" width="92" height="162" rx="1.5"/><line x1="4" y1="85" x2="96" y2="85"/><circle cx="50" cy="85" r="12"/><circle cx="50" cy="85" r=".9" fill="rgba(255,255,255,.7)"/>
    <rect x="22" y="4" width="56" height="24"/><rect x="36" y="4" width="28" height="8"/><path d="M40 28 a12 10 0 0 0 20 0"/>
    <rect x="22" y="142" width="56" height="24"/><rect x="36" y="158" width="28" height="8"/><path d="M40 142 a12 10 0 0 1 20 0"/></svg>`;

  const bench = (r, tc) => {
    const list = r.roster.filter(p => !p.starter);
    if (!list.length) return '';
    return `<div class="lineup-head">${img(r.team?.logos?.[0]?.href || r.team?.logo, 'logo sm', '')}Bank · ${esc(teamName(r))}</div>
      <div class="list glass">${list.sort((a, b) => (b.subbedIn ? 1 : 0) - (a.subbedIn ? 1 : 0)).map(p => {
        const a = p.athlete || {}, e = ev[a.id] || {};
        return `<div class="row" data-ply="${esc(a.id)}" style="cursor:pointer">
          <div class="av" style="--tc:${tc};--tn:${readableOn(tc)}"><img alt="" data-pid="${esc(a.id)}" data-pname="${esc(a.displayName)}" data-pteam="${esc(r.team?.displayName || '')}" data-pfb="${esc(a.headshot?.href || '')}"><b>${esc(p.jersey || '')}</b></div>
          <div class="grow"><div class="t1">${esc(a.displayName)}</div><div class="t2">${esc(posDE(p.position))}</div></div>
          ${e.g ? `<span>⚽${e.g > 1 ? '×' + e.g : ''}</span>` : ''}${e.r ? '<span class="card-r"></span>' : e.y ? '<span class="card-y"></span>' : ''}
          ${p.subbedIn ? '<span class="sub-i" title="eingewechselt">↑</span>' : ''}
        </div>`; }).join('')}</div>`;
  };

  return `<div class="pitch-wrap glass">
      ${away ? tag(away, 'top') : ''}
      <div class="pitch" style="aspect-ratio:${W.toFixed(0)} / ${H.toFixed(0)}">${lines}${away ? half(away, ac, true) : ''}${half(home, hc, false)}</div>
      ${tag(home, 'bot')}
    </div>
    ${bench(home, hc)}${away ? bench(away, ac) : ''}`;
}

/* ---------- Search ---------- */
let teamIndex = null;
async function buildIndex(){
  if (teamIndex) return teamIndex;
  const res = await Promise.allSettled(LEAGUES.filter(l => !l.cup && l.sport !== 'racing').map(L => standings(L.slug).then(gs => ({ L, gs }))));
  const seen = new Map();
  res.filter(r => r.status === 'fulfilled').forEach(({ value: { L, gs } }) => gs.forEach(g => g.entries.forEach(e => {
    // domestic league wins over European cup as "home" league
    if (!seen.has(e.team.id) || seen.get(e.team.id).L.group === 'eu') seen.set(e.team.id, { ...e.team, L });
  })));
  teamIndex = [...seen.values()];
  return teamIndex;
}

const textCache = new Map();
async function getText(url, ttl = 10 * 60_000){
  const hit = textCache.get(url);
  if (hit && Date.now() - hit.t < ttl) return hit.data;
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.text(); textCache.set(url, { t: Date.now(), data }); return data;
}
const htmlText = h => new DOMParser().parseFromString(String(h || ''), 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
function parseRss(xml, source){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  return [...doc.querySelectorAll('item')].map(it => {
    const g = n => it.getElementsByTagName(n)[0]?.textContent?.trim() || '';
    return { title: htmlText(g('title')), link: g('link') || g('guid'), date: new Date(g('pubDate')), desc: htmlText(g('description')),
      cats: [...it.getElementsByTagName('category')].map(c => c.textContent.trim()), source, lang:'de' };
  }).filter(n => n.title && n.link);
}
const kicker = path => getText(`https://newsfeed.kicker.de/${path}`).then(x => parseRss(x, 'kicker'));
const transfermarkt = () => getText('https://www.transfermarkt.de/rss/news').then(x => parseRss(x, 'Transfermarkt'));
const espnNews = (slug, team) => api(`site/v2/sports/${sp(slug)}/news?limit=12${team ? '&team=' + team : ''}`, { ttl: 10 * 60_000 })
  .then(d => (d.articles || []).map(a => ({ title: a.headline, link: a.links?.web?.href, date: new Date(a.published), desc: a.description || '',
    img: a.images?.[0]?.url, cats: (a.categories || []).map(c => c.description).filter(Boolean), source:'ESPN', lang:'en' })).filter(n => n.link));

function teamWords(t){
  const base = [t.name, tn(t.name), ...(TEAM_ALIASES[String(t.id)] || [])].filter(Boolean);
  return [...new Set(base.map(w => w.replace(/^(1\. )?(FC|SV|VfL|VfB|TSG|SC|FSV|SpVgg|TSV) /, '').trim()).filter(w => w.length >= 3))];
}
const titleMentions = (n, words) => mentions({ title: n.title }, words);
const mentions = (n, words) => { const hay = ' ' + [n.title, n.desc, ...(n.cats || [])].join(' ') + ' ';
  return words.some(w => new RegExp(`(^|[^\\p{L}])${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^\\p{L}]|$)`, 'iu').test(hay)); };

const RUMOR = /gerücht|interesse an|interessiert|im visier|buhlt|angeblich|offenbar|liebäugel|heiß auf|kandidat|wechselabsichten|soll .{0,40}(wechseln|kommen|holen)|könnte .{0,30}(wechseln|kommen)|transfer (rumou?rs|talk)|rumou?r|linked with|target|eyeing|interest in|in talks/i;
const DONE = /verpflichtet|unterschreibt|unterschrieben|wechselt (zu|nach|zum|zur|in)|transfer perfekt|ist perfekt|offiziell|leiht .{0,30}aus|ausgeliehen|vertrag verlängert|verlängert (seinen |den )?vertrag|neuzugang|ablösefrei|kauft|holt .{0,30}(von|aus)|sign(s|ed)? (a )?(new )?([\w'’.-]+ ){0,3}(contract|deal|extension)|sign(s|ed) (for|with)|completes? (a |his )?(move|transfer|signing)|joins|extends? contract|new contract/i;
const TRANSFERISH = /transfer|wechsel|vertrag|verpflicht|leih|ablöse|klausel|neuzugang|abgang|unterschr|signs|signed|signing|joins|contract|loan|deal|move to|rumou?r|target|interess|visier|gerücht/i;
function transferKind(n){
  const t = n.title;                       // headline only – teasers mention "Neuzugang" etc. far too loosely
  if (!TRANSFERISH.test(t)) return null;
  if (RUMOR.test(t)) return 'rumor';
  if (DONE.test(t)) return 'done';
  return null;
}
function relTime(d){
  const m = Math.round((Date.now() - d) / 60000);
  if (!isFinite(m)) return '';
  if (m < 1) return 'gerade eben'; if (m < 60) return `vor ${m} Min.`;
  const h = Math.round(m / 60); if (h < 24) return `vor ${h} Std.`;
  const dd = Math.round(h / 24); if (dd === 1) return 'gestern'; if (dd < 7) return `vor ${dd} Tagen`;
  return d.toLocaleDateString('de-DE', { day:'numeric', month:'short' });
}

async function mergedSchedules(slugs, id){
  const all = await Promise.allSettled(slugs.flatMap(sl => [
    api(`site/v2/sports/${sp(sl)}/teams/${id}/schedule`).then(d => ({ d, sl })),
    api(`site/v2/sports/${sp(sl)}/teams/${id}/schedule?fixture=true`).then(d => ({ d, sl })),
  ]));
  const ok = all.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (!ok.length) throw all[0]?.reason || new Error('Keine Spiele gefunden');
  const evs = [...new Map(ok.flatMap(x => (x.d.events || []).map(e => [e.id, normEvent(e, x.sl)]))).values()]
    .filter(m => m.date).sort((a, b) => new Date(a.date) - new Date(b.date));
  const upcoming = evs.filter(m => m.state === 'pre' && m.name !== 'STATUS_POSTPONED' && new Date(m.date) > Date.now() - 3 * 3600e3);
  const past = evs.filter(m => m.state === 'post' || m.state === 'in').reverse();
  return { last: past.find(m => m.state === 'in') || past[0], next: upcoming[0], upcoming, past };
}

const lgIcon = (logo, cls = 'lgw') => `<div class="${cls}"><img src="${esc(logo)}" alt="" onerror="this.style.visibility='hidden'"></div>`;
function newsRow(n, kind){
  const badge = kind === 'rumor' ? '<span class="badge rumor">Gerücht</span>' : kind === 'done' ? '<span class="badge done">Offiziell</span>' : '';
  return `<a href="${esc(n.link)}" target="_blank" rel="noopener">
    <div class="nb"><div class="nt">${esc(n.title)}</div>${n.desc && !kind ? `<div class="nd">${esc(n.desc)}</div>` : ''}
      <div class="nm">${badge}<span class="badge src">${esc(n.source)}${n.lang === 'en' ? ' · EN' : ''}</span>${esc(relTime(n.date))}${n.about ? ' · ' + esc(n.about) : ''}</div></div>
    ${n.img ? `<img class="th" src="${esc(n.img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
  </a>`;
}

    <div class="ov-pair" id="ovClub">${skeleton(2, 92)}</div>

    <div id="ovLeague">${skeleton(1, 230)}</div>` : ''}

    <div id="ovTransfers"></div>
    <div id="ovNews"><div class="ov-h"><h2>News</h2></div>${skeleton(4, 78)}</div>
  </div>`;

    const lastDone = data.past.find(m => m.state === 'post');
    el.innerHTML = `<div><div class="ov-label">Letztes Spiel</div>${lastDone ? matchCard(lastDone, { showDate:true, comp:true }) : `<div class="ov-none glass flat">Noch kein Spiel</div>`}</div>`;
    const heroEl = $('#ovHero');
    if (heroEl) heroEl.innerHTML = matchdayCard(data.past.find(m => m.state === 'in') || data.next || lastDone, C);
    const liveM = data.past.find(m => m.state === 'in'); if (liveM) goalWatch(liveM);
  };

  jobs.push(mergedSchedules([C.slug, ...(CUPS[C.slug] || []), ...EURO_CUPS.filter(x => x !== C.slug)], C.id)
    .then(d => { live ||= d.last?.state === 'in'; pair('#ovClub', d); })
    .catch(() => { const el = $('#ovClub'); if (el && my === token) el.innerHTML = `<div class="ov-none glass flat">Spiele konnten nicht geladen werden</div>`; }));

      el.innerHTML = `
        ${liveNow.length ? `<div class="ov-label">Läuft gerade</div><div class="matches" style="margin-bottom:14px">${liveNow.map(m => matchCard(m, o)).join('')}</div>` : ''}

  // ---- news & transfers ----
  const cWords = teamWords(C), nWords = N ? [N.name, ...(TEAM_ALIASES[N.id] || [])] : [];

/* ---------- Push notifications (Web Push via service worker + Supabase) ---------- */
const PUSH_PREFS_KEY = 'fb.pushPrefs';
const Push = {
  supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  ios: /iPhone|iPad|iPod/.test(navigator.userAgent),
  standalone: () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches,
  prefs: () => ({ goals: true, matchday: true, lineup: true, ...store.get(PUSH_PREFS_KEY, {}) }),
  key(){
    const b = (CFG.vapidPublicKey || '').replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b + '='.repeat((4 - b.length % 4) % 4));
    return Uint8Array.from(raw, ch => ch.charCodeAt(0));
  },
  async registration(){ return navigator.serviceWorker.register('sw.js'); },
  async current(){
    if (!this.supported()) return null;
    const r = await navigator.serviceWorker.getRegistration();
    return r ? r.pushManager.getSubscription() : null;
  },
  async enable(){
    if (!Auth.sb || !Auth.user) throw new Error('Bitte melde dich zuerst an.');
    if (!CFG.vapidPublicKey) throw new Error('Push ist noch nicht eingerichtet.');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error(perm === 'denied'
      ? 'Mitteilungen sind blockiert. Erlaube sie in den iPhone-Einstellungen unter Mitteilungen → Arenly.' : 'Ohne Erlaubnis keine Mitteilungen.');
    const reg = await this.registration(); await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this.key() });
    await this.save(sub);
  },
  async save(sub){
    sub ||= await this.current(); if (!sub || !Auth.sb || !Auth.user) return;
    const j = sub.toJSON(), pr = profile() || {};
    const { error } = await Auth.sb.from('push_subscriptions').upsert({
      endpoint: j.endpoint, user_id: Auth.user.id, p256dh: j.keys.p256dh, auth: j.keys.auth,
      club_id: pr.club?.id || null, club_slug: pr.club?.slug || null, nation_id: pr.nation?.id || null,
      prefs: this.prefs(), app_url: location.origin + location.pathname, updated_at: new Date().toISOString(),
    });
    if (error) throw new Error(/push_subscriptions/.test(error.message) ? 'Die Datenbank ist für Push noch nicht eingerichtet.' : error.message);
  },
  async disable(){
    const sub = await this.current(); if (!sub) return;
    try { await Auth.sb?.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); } catch {}
    try { await sub.unsubscribe(); } catch {}
  },
  _t: null,
  resyncSoon(){ clearTimeout(this._t); this._t = setTimeout(() => this.current().then(s => s && this.save(s)).catch(() => {}), 900); },
  async test(){
    const reg = await navigator.serviceWorker.ready;
    const pr = profile() || {};
    await reg.showNotification('⚽ TOR für ' + (pr.club?.name || 'dein Team') + '!', {
      body: 'So sieht eine Arenly-Mitteilung aus.', icon: 'assets/icon-192.png', badge: 'assets/icon-192.png', tag: 'arenly-test', data: { url: './' } });
  },
};
// keep the service worker registered once notifications are allowed
if (Push.supported() && Notification.permission === 'granted') Push.registration().catch(() => {});

/* ---------- Tippspiel ---------- */
function tipPoints(t, hs, as){
  if (t.home === hs && t.away === as) return 4;
  const td = t.home - t.away, rd = hs - as;
  if (Math.sign(td) !== Math.sign(rd)) return 0;
  return rd !== 0 && td === rd ? 3 : 2;
}
const tipCounts = (t, m) => m && m.state === 'post' && new Date(t.updated_at) < new Date(m.date);   // saved before the real kick-off
function matchdays(cal){
  const days = [...new Set(cal.map(c => c.slice(0, 10)))].sort();
  const groups = [];
  for (const d of days){
    const last = groups[groups.length - 1];
    if (last && (new Date(d) - new Date(last[last.length - 1])) / 864e5 <= 3) last.push(d); else groups.push([d]);
  }
  return groups;
}
const mdLabel = g => { const f = d => new Date(d + 'T12:00:00'); const a = f(g[0]), b = f(g[g.length - 1]);
  return g.length === 1 ? a.toLocaleDateString('de-DE', { weekday:'short', day:'numeric', month:'short' })
    : `${a.getDate()}.${a.getMonth() !== b.getMonth() ? (a.getMonth() + 1) + '.' : ''}–${b.toLocaleDateString('de-DE', { day:'numeric', month:'short' })}`; };
async function resultsFor(tips){                       // event id → normalised match (from monthly scoreboards)
  const need = new Map();
  tips.forEach(t => { const d = new Date(t.kickoff); const mo = `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, '0')}`; (need.get(t.slug) || need.set(t.slug, new Set()).get(t.slug)).add(mo); });
  const out = new Map();
  await Promise.all([...need].flatMap(([slug, mos]) => [...mos].map(mo =>
    api(`site/v2/sports/${sp(slug)}/scoreboard?dates=${mo}&limit=500`, { ttl: 5 * 60_000 })
      .then(d => (d.events || []).forEach(e => out.set(String(e.id), normEvent(e, slug)))).catch(() => {}))));
  return out;
}
const tipNeedsSetup = err => /tip_|tips|create_tip_group|join_tip_group|schema cache/i.test(err?.message || '');
const tipSetupBox = () => emptyBox('🛠️', 'Tippspiel noch nicht eingerichtet', 'Das Datenbank-Skript supabase/tipp.sql muss einmal in Supabase ausgeführt werden.');

    let cal = (base.leagues?.[0]?.calendar || []).flatMap(c => typeof c === 'string' ? [c] : (c.entries || []).map(x => x.startDate || x.value)).filter(Boolean);
    const mds = matchdays(cal), todayKey = new Date().toISOString().slice(0, 10);
    let idx = mds.findIndex(g => g[g.length - 1] >= todayKey); if (idx < 0) idx = mds.length - 1;

function tipCard(m, t){
  const open = m.state === 'pre' && new Date(m.date) > Date.now();
  const when = new Date(m.date).toLocaleDateString('de-DE', { weekday:'short', day:'numeric', month:'short' }) + ', ' + fmtTime(m.date);
  const team = (x) => `<span class="tn">${img(x.logo, 'logo sm', x.name)}<span>${esc(x.name)}</span></span>`;
  if (open){
    const st = (side, v) => `<div class="stepper" data-side="${side}"><button data-d="-1" aria-label="weniger">−</button><b class="${v == null ? 'unset' : ''}">${v ?? '–'}</b><button data-d="1" aria-label="mehr">+</button></div>`;
    return `<div class="tipcard glass flat" data-ev="${esc(m.id)}" data-open="1">
      <div class="tiprow">${team(m.home)}${st('home', t?.home)}</div>
      <div class="tiprow">${team(m.away)}${st('away', t?.away)}</div>
      <div class="tipmeta"><span>${esc(when)}</span><span class="tst ${t ? 'saved' : ''}">${t ? '✓ getippt' : 'noch nicht getippt'}</span></div></div>`;
  }
  const played = m.state !== 'pre' && m.home.score != null;
  const valid = t && tipCounts(t, m), p = valid ? tipPoints(t, +m.home.score, +m.away.score) : null;
  const late = t && m.state === 'post' && !valid;
  return `<a class="tipcard glass flat" href="#/match/${esc(m.slug)}/${esc(m.id)}">
    <div class="tiprow">${team(m.home)}<span class="lockedtip">${t ? esc(t.home) : '–'}</span><span class="res">${played ? esc(m.home.score) : ''}</span></div>
    <div class="tiprow">${team(m.away)}<span class="lockedtip">${t ? esc(t.away) : '–'}</span><span class="res">${played ? esc(m.away.score) : ''}</span></div>
    <div class="tipmeta"><span>${m.state === 'in' ? '<span style="color:var(--live)">● läuft</span>' : esc(when)} · Tipp | Ergebnis</span>
      ${p != null ? `<span class="ptsb p${p}">+${p}</span>` : late ? '<span class="ptsb p0">zu spät</span>' : t ? '<span>gesperrt</span>' : '<span>nicht getippt</span>'}</div></a>`;
}
function bindTipCard(card, m, myTips){
  let saveT;
  const val = side => { const b = card.querySelector(`.stepper[data-side="${side}"] b`); return b.classList.contains('unset') ? null : +b.textContent; };
  const set = (side, v) => { const b = card.querySelector(`.stepper[data-side="${side}"] b`); b.textContent = v; b.classList.remove('unset'); };
  card.querySelectorAll('.stepper button').forEach(btn => btn.onclick = () => {
    const side = btn.closest('.stepper').dataset.side, other = side === 'home' ? 'away' : 'home';
    const cur = val(side);
    set(side, Math.max(0, Math.min(15, (cur ?? (+btn.dataset.d > 0 ? 0 : 1)) + +btn.dataset.d)));
    if (val(other) == null) set(other, 0);
    const stEl = card.querySelector('.tst'); stEl.textContent = 'speichert …'; stEl.classList.remove('saved');
    clearTimeout(saveT);
    saveT = setTimeout(async () => {

    }, 650);
  });
}

/* ---------- Matchday card (next / running match of the favourite club) ---------- */
const RING_C = 2 * Math.PI * 48;
function ringFor(iso){
  const ms = new Date(iso) - Date.now(), week = 7 * 864e5;
  const frac = Math.max(0.02, Math.min(1, 1 - ms / week));
  const min = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(min / 60), d = Math.floor(h / 24);
  const [big, small] = ms <= 0 ? ['Gleich', 'Anpfiff'] : d >= 1 ? [`${d} ${d === 1 ? 'Tag' : 'Tage'}`, `${h % 24} Std.`] : h >= 1 ? [`${h}:${String(min % 60).padStart(2, '0')}`, 'Stunden'] : [`${min}`, 'Minuten'];
  return { off: RING_C * (1 - frac), big, small };
}
function matchdayCard(m, C){
  if (!m) return `<div class="md-card glass"><div class="md-top"><span>Dein Verein</span></div><div class="ov-none" style="padding:30px 0">Kein Spiel geplant</div></div>`;

         <circle class="val" cx="56" cy="56" r="48" fill="none" stroke-width="7" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${r.off.toFixed(1)}"/></svg>
         <div class="in"><b>${esc(r.big)}</b><small>${esc(r.small)}</small></div></div>`
    : `<div class="md-ring"><svg viewBox="0 0 112 112"><circle class="trk" cx="56" cy="56" r="48" fill="none" stroke-width="7"/>${m.state === 'in'
         ? `<circle class="val" cx="56" cy="56" r="48" fill="none" stroke-width="7" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${(RING_C * (1 - Math.min(1, (parseInt(m.clock) || 0) / 90))).toFixed(1)}" style="stroke:var(--live)"/>` : ''}</svg>
         <div class="in"><b class="score">${esc(m.home.score ?? 0)}:${esc(m.away.score ?? 0)}</b><small style="${m.state === 'in' ? 'color:var(--live)' : ''}">${esc(st.txt)}</small></div></div>`;

/* ---------- goal celebration while the app is open ---------- */
const goalSeen = new Map();
function goalWatch(m){
  const cid = profile()?.club?.id; if (!cid || !m || m.state !== 'in') return;
  const side = String(m.home.id) === String(cid) ? 'home' : String(m.away.id) === String(cid) ? 'away' : null; if (!side) return;
  const sc = +m[side].score || 0, prev = goalSeen.get(m.id);
  goalSeen.set(m.id, sc);
  if (prev != null && sc > prev) celebrate(`${m.home.name} ${m.home.score}:${m.away.score} ${m.away.name}`);
}
function celebrate(line){
  document.querySelector('.goal-burst')?.remove();
  const wrap = document.createElement('div'); wrap.className = 'goal-burst';
  wrap.innerHTML = `<canvas></canvas><div class="gb"><b>TOR!</b>${line ? `<span>${esc(line)}</span>` : ''}</div>`;
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 3100);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = wrap.querySelector('canvas'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const cols = [currentTheme?.p || getComputedStyle(document.documentElement).getPropertyValue('--accent'), currentTheme?.s || '#ffffff', '#ffffff', '#ffd60a'];
  const parts = Array.from({ length: 150 }, (_, i) => ({ x: innerWidth / 2 + (Math.random() - .5) * 60, y: innerHeight * .45, vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 4,
    w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, rot: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[i % cols.length] }));
  const t0 = performance.now();
  const tick = t => {
    const k = (t - t0) / 1000; if (k > 2.9 || !wrap.isConnected) return;
    g.clearRect(0, 0, innerWidth, innerHeight);
    for (const q of parts){ q.vy += .38; q.vx *= .992; q.x += q.vx; q.y += q.vy; q.rot += q.vr;
      g.save(); g.globalAlpha = Math.max(0, 1 - Math.max(0, k - 2.1) / .8); g.translate(q.x, q.y); g.rotate(q.rot); g.fillStyle = q.c; g.fillRect(-q.w / 2, -q.h / 2, q.w, q.h * Math.abs(Math.cos(q.rot * 2))); g.restore(); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function setTab(i){
  const lens = $('#lens');
  if (+lens.style.getPropertyValue('--i') !== i){
    lens.classList.remove('squish'); void lens.offsetWidth; lens.classList.add('squish');
  }

function route(fresh = false, silent = false){
  clearTimeout(refreshTimer);
  closeSheet();

  const [r, a, b] = parts;
  if (fresh && !silent) cache.clear();
  if (silent) [...cache.keys()].forEach(k => /scoreboard|summary/.test(k) && cache.delete(k));
  if (!silent) window.scrollTo({ top: 0 });
  switch (r){
    case 'leagues': lastTab = 1; setTab(1); renderHome(); break;

const DEPTH = { '':0, leagues:0, today:0, search:0, me:0, favs:0, tipp:1, league:1, team:2, gp:2, match:3, player:4 };
let curDepth = DEPTH[(location.hash.replace(/^#\/?/, '').split('/')[0]) || ''] ?? 0;

/* ---------- pull to refresh (home-screen apps have none) ---------- */
(() => {
  let y0 = null, pull = 0, busy = false;
  const ptr = $('#ptr');
  const blocked = () => document.body.classList.contains('locked') || $('#sheet').classList.contains('on');
  addEventListener('touchstart', e => { y0 = scrollY <= 0 && !busy && !blocked() ? e.touches[0].clientY : null; pull = 0; }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    pull = Math.max(0, e.touches[0].clientY - y0);
    if (scrollY > 0){ y0 = null; pull = 0; }
    const k = Math.min(1, pull / 80);
    ptr.style.transition = 'none';
    ptr.style.opacity = k;
    ptr.style.transform = `translateY(${-70 + Math.min(pull * .6, 64)}px) scale(${.6 + .4 * k})`;
    ptr.firstElementChild.style.transform = `rotate(${pull * 3}deg)`;
  }, { passive: true });
  addEventListener('touchend', () => {
    if (y0 == null) return; y0 = null;
    ptr.style.transition = 'transform .45s var(--spring), opacity .3s';
    if (pull > 80){
      busy = true; ptr.classList.add('spin'); ptr.style.transform = 'translateY(-6px) scale(1)'; ptr.style.opacity = 1;
      route(true);
      setTimeout(() => { ptr.classList.remove('spin'); ptr.style.transform = 'translateY(-70px) scale(.6)'; ptr.style.opacity = 0; busy = false; }, 900);
    } else { ptr.style.transform = 'translateY(-70px) scale(.6)'; ptr.style.opacity = 0; }
    pull = 0;
  });
})();

let nationIndex = null;
async function buildNationIndex(){
  if (nationIndex) return nationIndex;
  const res = await Promise.allSettled(NATION_LISTS.map(sl => api(`v2/sports/${sp(sl)}/standings`, { ttl: 60 * 60_000 })));
  const seen = new Map();
  res.filter(r => r.status === 'fulfilled').forEach(r => (r.value.children || []).forEach(g => (g.standings?.entries || []).forEach(e => {
    const t = e.team; if (!seen.has(t.id)) seen.set(t.id, { id: t.id, en: t.displayName, name: cn(t.displayName), logo: t.logos?.[0]?.href });
  })));
  const rank = t => { const i = POPULAR_NATIONS.indexOf(t.en); return i < 0 ? 999 : i; };
  nationIndex = [...seen.values()].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'de'));

}

/* =============================================================
   INTRO  →  ONBOARDING / APP
   ============================================================= */
function runIntro(){
  return new Promise(resolve => {
    const intro = $('#intro'), vid = $('#introVideo'), snd = $('#introSound');
    let ended = false, started = false, fallbackTimer, guard;
    const end = () => {
      if (ended) return; ended = true;
      clearTimeout(fallbackTimer); clearTimeout(guard);
      intro.classList.add('gone');
      // fade the sound out together with the picture
      if (!vid.muted){ const t0 = performance.now(), v0 = vid.volume;
        const fade = () => { const k = Math.min(1, (performance.now() - t0) / 600); try { vid.volume = v0 * (1 - k); } catch {} if (k < 1) requestAnimationFrame(fade); }; fade(); }
      setTimeout(() => { try { vid.pause(); } catch {} intro.remove(); }, 800);
      resolve();
    };
    const useFallback = () => {
      if (ended || started || intro.classList.contains('fb')) return;
      intro.classList.add('fb');
      fallbackTimer = setTimeout(end, 1500);
    };
    const setSound = on => {
      vid.muted = !on; snd.classList.toggle('on', on);
      snd.querySelector('span').textContent = on ? 'Ton aus' : 'Ton an';
      snd.setAttribute('aria-label', on ? 'Ton ausschalten' : 'Ton einschalten');
      store.set('fb.introSound', on);
    };
    snd.onclick = () => { setSound(vid.muted); if (vid.paused) vid.play().catch(() => {}); };
    vid.addEventListener('playing', () => {
      started = true; clearTimeout(guard); vid.classList.add('playing');
      // only offer the sound button if this video actually has an audio track
      setTimeout(() => {
        const hasAudio = vid.audioTracks ? vid.audioTracks.length > 0
          : (vid.mozHasAudio || (vid.webkitAudioDecodedByteCount || 0) > 0);
        if (hasAudio && !ended) snd.hidden = false;
      }, 400);
    });
    vid.addEventListener('ended', end);
    vid.addEventListener('error', useFallback, true);
    vid.querySelector('source')?.addEventListener('error', useFallback);
    // slow network / Low Power Mode: show the animated logo instead of a black screen
    guard = setTimeout(() => { if (!started) useFallback(); }, 4000);

    // Browsers only autoplay muted. If the viewer turned sound on last time, try with sound first.
    const tryPlay = () => {
      const wantSound = store.get('fb.introSound', false);
      if (wantSound){ vid.muted = false; setSound(true); }
      vid.play().catch(() => {
        if (!vid.muted){ setSound(false); store.set('fb.introSound', true); vid.play().catch(useFallback); }
        else useFallback();
      });
    };
    fetch('assets/intro.mp4', { method:'HEAD' }).then(r => r.ok ? tryPlay() : useFallback()).catch(tryPlay);
  });
}

/* ---------- self-update: home-screen apps and browser caches keep old versions around ---------- */
async function checkForUpdate(){
  try{
    const html = await (await fetch('index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const live = (html.match(/const APP_BUILD = '([^']+)'/) || [])[1];
    if (!live || live === APP_BUILD) return;
    const k = 'fb.reloadedFor';
    if (sessionStorage.getItem(k) === live) return;            // never loop
    sessionStorage.setItem(k, live);
    const u = new URL(location.href); u.searchParams.set('v', live);
    location.replace(u.toString());                            // new URL → bypasses the cached page
  } catch {}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });

applyTheme(profile()?.theme);
route();
const authReady = Auth.init()
  .then(async user => {
    if (!Auth.cloud) return;
    if (!user){ try { localStorage.removeItem('fb.profile'); } catch {} return; }   // cloud mode: no session → not signed in
    const pending = store.get('fb.pending', null);                                    // name typed before e-mail confirmation
    if (pending && !profile()?.name) store.set('fb.profile', { name: pending.name, email: pending.email });
    try { localStorage.removeItem('fb.pending'); } catch {}
    const pr = await Auth.pull();
    applyTheme(pr?.theme); route();
  })
  .catch(err => { console.warn(err); toast('Anmeldedienst nicht erreichbar – lokaler Modus'); Auth.cloud = false; });
Promise.all([runIntro(), authReady]).then(() => {
  if (!$('#onb').hidden) return;                       // e.g. password-recovery screen already open
  const pr = profile();
  if (!pr) startOnboarding(['register', 'club', 'league', 'nation', 'done']);
  else if (!pr.club) startOnboarding(['club', 'league', 'nation', 'done']);
  else if (!pr.league && !pr.nation) startOnboarding(['league', 'nation', 'done']);
  else if (!pr.league) startOnboarding(['league']);          // existing accounts: one new question
  else if (!pr.nation) startOnboarding(['nation', 'done']);
  else document.body.classList.remove('locked');
});
</script>
