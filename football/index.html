<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arenly">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<title>Arenly</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS  —  "Liquid Glass"
   ============================================================ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;

  --bg: #07090e;
  --text: #f5f7fb;
  --text-2: rgba(235,240,255,.64);
  --text-3: rgba(235,240,255,.40);
  --sep: rgba(255,255,255,.08);

  --glass: rgba(255,255,255,.075);
  --glass-strong: rgba(255,255,255,.14);
  --glass-press: rgba(255,255,255,.18);
  --rim-a: rgba(255,255,255,.55);
  --rim-b: rgba(255,255,255,.06);
  --rim-c: rgba(255,255,255,.28);
  --sheen: rgba(255,255,255,.16);
  --shadow: 0 12px 40px -8px rgba(0,0,0,.55);
  --shadow-sm: 0 6px 20px -6px rgba(0,0,0,.45);

  --accent: #0a84ff;
  --blob-1: #0a84ff;
  --blob-2: #bf5af2;
  --blob-3: #30d1a0;
  --blob-4: #ff6b3d;

  --live: #ff453a;
  --win: #30d158;
  --draw: #ffd60a;
  --loss: #ff453a;

  --r-xl: 30px;
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 12px;

  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease: cubic-bezier(.22,.61,.36,1);

  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg: #eef1f7;
    --text: #0b0d12;
    --text-2: rgba(20,25,40,.62);
    --text-3: rgba(20,25,40,.40);
    --sep: rgba(10,20,40,.08);
    --glass: rgba(255,255,255,.48);
    --glass-strong: rgba(255,255,255,.70);
    --glass-press: rgba(255,255,255,.85);
    --rim-a: rgba(255,255,255,.95);
    --rim-b: rgba(255,255,255,.25);
    --rim-c: rgba(255,255,255,.75);
    --sheen: rgba(255,255,255,.55);
    --shadow: 0 12px 40px -10px rgba(30,40,80,.28);
    --shadow-sm: 0 6px 18px -6px rgba(30,40,80,.22);
    color-scheme: light;
  }
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ min-height:100%; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  letter-spacing: -.01em;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
img{ display:block; }

/* ============================================================
   LIVING BACKGROUND — colour blobs the glass refracts
   ============================================================ */
.backdrop{ position:fixed; inset:-20vmax; z-index:0; pointer-events:none; filter: blur(70px) saturate(140%); opacity:.85; }
@media (prefers-color-scheme: light){ .backdrop{ opacity:.55; } }
.blob{ position:absolute; border-radius:50%; mix-blend-mode:normal; transition: background 1.2s var(--ease); will-change: transform; }
.blob.b1{ width:55vmax; height:55vmax; left:5%;  top:0%;  background: radial-gradient(circle at 50% 50%, var(--blob-1), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
.blob.b2{ width:50vmax; height:50vmax; right:0%; top:20%; background: radial-gradient(circle at 50% 50%, var(--blob-2), transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
.blob.b3{ width:45vmax; height:45vmax; left:20%; bottom:0%; background: radial-gradient(circle at 50% 50%, var(--blob-3), transparent 65%); animation: drift3 29s ease-in-out infinite alternate; }
.blob.b4{ width:30vmax; height:30vmax; right:20%; bottom:15%; background: radial-gradient(circle at 50% 50%, var(--blob-4), transparent 65%); animation: drift1 36s ease-in-out infinite alternate-reverse; opacity:.7; }
@keyframes drift1{ to{ transform: translate(14vmax, 10vmax) scale(1.15); } }
@keyframes drift2{ to{ transform: translate(-16vmax, 12vmax) scale(.9); } }
@keyframes drift3{ to{ transform: translate(10vmax, -14vmax) scale(1.1); } }
.grain{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* ============================================================
   LIQUID GLASS MATERIAL
   ============================================================ */
.glass{
  position: relative;
  isolation: isolate;
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(185%);
  backdrop-filter: blur(26px) saturate(185%);
  border-radius: var(--r-lg);
  box-shadow:
    inset 0 1px 1px -0.5px var(--rim-a),
    inset 0 -1px 1px -0.5px var(--rim-b),
    var(--shadow);
}
/* specular rim (gradient border) */
.glass::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none; z-index:2;
  background: linear-gradient(155deg, var(--rim-a) 0%, var(--rim-b) 35%, var(--rim-b) 65%, var(--rim-c) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
/* inner sheen — light caught in the glass body */
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
  background:
    radial-gradient(120% 60% at 15% 0%, var(--sheen), transparent 55%),
    radial-gradient(80% 50% at 100% 100%, rgba(255,255,255,.06), transparent 60%);
}
.glass.strong{ background: var(--glass-strong); }
.glass.flat{ box-shadow: inset 0 1px 1px -0.5px var(--rim-a), inset 0 -1px 1px -0.5px var(--rim-b), var(--shadow-sm); }

.press{ transition: transform .35s var(--spring), background .2s; }
.press:active{ transform: scale(.965); background: var(--glass-press); }

/* ============================================================
   LAYOUT
   ============================================================ */
#app{ position:relative; z-index:1; max-width: 760px; margin: 0 auto; padding: calc(var(--safe-t) + 8px) 16px calc(120px + var(--safe-b)); }
.view{ animation: viewIn .45s var(--ease) both; }
@keyframes viewIn{ from{ opacity:0; transform: translateY(14px) scale(.99); filter: blur(4px);} to{ opacity:1; transform:none; filter:none; } }

/* nav bar (iOS style: large title collapses into a glass bar) */
.nav{
  position: sticky; top: calc(var(--safe-t) + 8px); z-index: 20;
  display:flex; align-items:center; gap:10px; height:52px; padding: 0 6px;
  margin: 0 -6px;
  border-radius: 26px;
  transition: background .3s, box-shadow .3s, backdrop-filter .3s;
}
.nav.scrolled{
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(185%);
  backdrop-filter: blur(26px) saturate(185%);
  box-shadow: inset 0 1px 1px -0.5px var(--rim-a), var(--shadow-sm);
}
.nav-title{ flex:1; text-align:center; font-weight:650; font-size:17px; opacity:0; transform: translateY(6px); transition: .3s var(--ease); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav.scrolled .nav-title{ opacity:1; transform:none; }
.nav-spacer{ width:44px; height:44px; flex:none; }
.icon-btn{
  width:44px; height:44px; flex:none; border-radius:50%;
  display:grid; place-items:center;
}
.icon-btn svg{ width:20px; height:20px; }
.icon-btn.on svg{ color: var(--draw); fill: var(--draw); }

.large-title{ font-size: 36px; font-weight: 800; letter-spacing: -.035em; line-height:1.05; margin: 6px 4px 4px; }
.subtitle{ color: var(--text-2); font-size:15px; margin: 0 4px 18px; }

.section-h{ display:flex; align-items:baseline; justify-content:space-between; margin: 26px 8px 10px; }
.section-h h2{ font-size: 21px; font-weight: 750; letter-spacing:-.02em; }
.section-h span{ color: var(--text-3); font-size: 13px; font-weight:600; }

/* brand */
.brand{ display:flex; align-items:center; gap:14px; margin: 6px 4px 4px; }
.brand-icon{ width:52px; height:52px; border-radius:12px; flex:none; box-shadow: 0 8px 22px -8px rgba(0,0,0,.55), inset 0 0 0 .5px rgba(255,255,255,.3); }
.brand .large-title{ margin:0; }
.brand-sport{ display:inline-flex; align-items:center; gap:6px; padding: 5px 12px; border-radius:999px; font-size:13px; font-weight:700; margin: 10px 4px 0; }
.nav-brand{ width:28px; height:28px; border-radius:7px; }
.foot img{ width:22px; height:22px; border-radius:6px; display:inline-block; vertical-align:middle; margin-right:6px; opacity:.85; }

/* launch splash */
.splash{ position:fixed; inset:0; z-index:200; display:grid; place-items:center; background: #0a0e22; transition: opacity .6s var(--ease) .1s, visibility 0s .7s; }
.splash img{ width:112px; height:112px; border-radius:25px; box-shadow: 0 24px 60px -16px rgba(0,0,0,.7); animation: splashIn .7s var(--spring) both; }
.splash span{ position:absolute; bottom: calc(18% + var(--safe-b)); font-weight:800; font-size:22px; letter-spacing:-.02em; color:#fff; opacity:0; animation: fadeUp .6s var(--ease) .25s forwards; }
.splash.gone{ opacity:0; visibility:hidden; }
.splash.gone img{ transform: scale(1.35); filter: blur(6px); transition: transform .6s var(--ease), filter .6s; }
@keyframes splashIn{ from{ transform: scale(.6); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes fadeUp{ from{ transform: translateY(10px); opacity:0; } to{ transform:none; opacity:.9; } }

/* list (inset grouped, glass) */
.list{ border-radius: var(--r-lg); overflow:hidden; }
.row{
  display:flex; align-items:center; gap:14px; padding: 12px 16px; min-height:60px; position:relative;
  transition: background .2s;
}
.row + .row::before{ content:""; position:absolute; top:0; left:66px; right:0; height:1px; background: var(--sep); }
.row:active{ background: var(--glass-press); }
.row .grow{ flex:1; min-width:0; }
.row .t1{ font-weight: 600; font-size: 16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .t2{ color: var(--text-2); font-size: 13px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chev{ width:8px; height:14px; color: var(--text-3); flex:none; }

.logo{ width:36px; height:36px; flex:none; object-fit:contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
.logo.sm{ width:24px; height:24px; }
.logo.xs{ width:20px; height:20px; }
.logo-wrap{ width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none; background: rgba(255,255,255,.9); }
.logo-wrap .logo{ width:28px; height:28px; filter:none; }
.ph-logo{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background: var(--glass-strong); color: var(--text-2); flex:none; }

/* league cards (grid) */
.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
.tile{ padding: 16px; display:flex; flex-direction:column; gap:12px; min-height:128px; border-radius: var(--r-lg); }
.tile .tl-logo{ width:46px; height:46px; border-radius:14px; background: rgba(255,255,255,.92); display:grid; place-items:center; box-shadow: 0 4px 14px -4px rgba(0,0,0,.35); }
.tile .tl-logo img{ width:34px; height:34px; object-fit:contain; }
.tile .tl-name{ font-weight:700; font-size:16px; letter-spacing:-.015em; line-height:1.15; }
.tile .tl-sub{ color: var(--text-2); font-size:13px; margin-top:2px; }

/* team tiles */
.team-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(104px,1fr)); gap: 10px; }
.team-tile{ padding: 16px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; border-radius: var(--r-md); }
.team-tile img{ width:48px; height:48px; object-fit:contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
.team-tile span{ font-size:13px; font-weight:600; line-height:1.15; }

/* fav strip */
.hscroll{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding: 4px 4px 14px; margin: 0 -16px; padding-left:16px; padding-right:16px; scroll-snap-type: x proximity; }
.hscroll::-webkit-scrollbar{ display:none; }
.fav-chip{ flex:none; display:flex; flex-direction:column; align-items:center; gap:8px; width:86px; padding: 14px 6px 10px; border-radius: var(--r-md); scroll-snap-align:start; }
.fav-chip img{ width:42px; height:42px; object-fit:contain; }
.fav-chip span{ font-size:12px; font-weight:600; text-align:center; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

/* ============================================================
   SEGMENTED CONTROL (sliding glass thumb)
   ============================================================ */
.seg{
  position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  padding:4px; border-radius: 999px; margin: 4px 0 18px;
}
.seg-thumb{
  position:absolute; top:4px; bottom:4px; left:4px;
  width: calc((100% - 8px) / var(--n));
  transform: translateX(calc(100% * var(--i)));
  border-radius:999px;
  background: var(--glass-strong);
  box-shadow: inset 0 1px 1px -0.5px var(--rim-a), 0 4px 14px -4px rgba(0,0,0,.35);
  transition: transform .5s var(--spring);
  z-index:0;
}
.seg button{ position:relative; z-index:1; height:36px; font-size:14px; font-weight:600; color: var(--text-2); border-radius:999px; transition: color .25s; }
.seg button.on{ color: var(--text); }

/* date chips */
.chips{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin: 0 -16px 16px; padding: 4px 16px 10px; scroll-snap-type:x proximity; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding: 8px 14px; border-radius:999px; font-size:14px; font-weight:600; color: var(--text-2); display:flex; flex-direction:column; align-items:center; min-width:62px; scroll-snap-align:center; transition: .3s var(--ease); }
.chip small{ font-size:11px; font-weight:600; opacity:.75; text-transform:uppercase; letter-spacing:.04em; }
.chip.on{ color: #fff; background: var(--accent); box-shadow: 0 8px 22px -6px var(--accent), inset 0 1px 1px -0.5px rgba(255,255,255,.7); }
.chip.on::after, .chip.on::before{ display:none; }

/* ============================================================
   MATCH CARD
   ============================================================ */
.matches{ display:flex; flex-direction:column; gap:10px; }
.match{
  display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:10px;
  padding: 14px 14px; border-radius: var(--r-md);
}
.match .side{ display:flex; align-items:center; gap:10px; min-width:0; }
.match .side.away{ flex-direction: row-reverse; text-align:right; }
.match .side .nm{ font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.match .side.loser .nm{ color: var(--text-2); font-weight:500; }
.match .mid{ display:flex; flex-direction:column; align-items:center; min-width:74px; }
.match .score{ font-size:22px; font-weight:800; letter-spacing:.02em; font-variant-numeric: tabular-nums; }
.match .time{ font-size:18px; font-weight:700; font-variant-numeric: tabular-nums; }
.match .st{ font-size:11px; font-weight:700; color: var(--text-3); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
.match .st.live{ color: var(--live); display:flex; align-items:center; gap:5px; }
.match .meta{ grid-column: 1 / -1; display:flex; justify-content:center; font-size:12px; color: var(--text-3); margin-top:-2px; }
.pulse{ width:7px; height:7px; border-radius:50%; background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 1.6s infinite; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(255,69,58,.7);} 70%{ box-shadow:0 0 0 8px rgba(255,69,58,0);} 100%{ box-shadow:0 0 0 0 rgba(255,69,58,0);} }

.league-head{ display:flex; align-items:center; gap:10px; margin: 22px 6px 10px; font-weight:700; font-size:15px; }
.league-head img{ width:22px; height:22px; object-fit:contain; background:rgba(255,255,255,.92); border-radius:7px; padding:2px; }
.league-head .cnt{ margin-left:auto; color: var(--text-3); font-size:13px; font-weight:600; }

/* ============================================================
   STANDINGS TABLE
   ============================================================ */
.table{ border-radius: var(--r-lg); overflow:hidden; padding: 6px 0; }
.trow{ display:grid; grid-template-columns: 30px 1fr 30px 40px 40px; align-items:center; gap:6px; padding: 9px 14px 9px 10px; font-size:14px; position:relative; font-variant-numeric: tabular-nums; }
.trow.wide{ grid-template-columns: 30px 1fr 30px 30px 30px 30px 54px 40px 40px; }
.trow.head{ color: var(--text-3); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding-top:8px; padding-bottom:8px; }
.trow .c{ text-align:center; }
.trow .pts{ font-weight:800; text-align:center; }
.trow .team{ display:flex; align-items:center; gap:10px; min-width:0; font-weight:600; }
.trow .team span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trow .rk{ text-align:center; font-weight:700; color: var(--text-2); }
.trow .zone{ position:absolute; left:3px; top:9px; bottom:9px; width:3px; border-radius:3px; }
.trow:not(.head):active{ background: var(--glass-press); }
.trow.hl{ background: color-mix(in srgb, var(--accent) 22%, transparent); }
.trow + .trow:not(.head)::before{ content:""; position:absolute; top:0; left:44px; right:14px; height:1px; background: var(--sep); }
.col-wide{ display:none; }
@media (min-width: 560px){ .col-wide{ display:block; } }
.legend{ display:flex; flex-wrap:wrap; gap:8px 16px; margin: 14px 8px 0; font-size:12px; color: var(--text-2); }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.group-title{ margin: 20px 8px 8px; font-weight:700; font-size:15px; color: var(--text-2); }

/* ============================================================
   TEAM / MATCH HERO
   ============================================================ */
.hero{ padding: 26px 18px 22px; border-radius: var(--r-xl); text-align:center; margin: 4px 0 16px; overflow:hidden; }
.hero .glow{ position:absolute; inset:-40%; z-index:-2; background: radial-gradient(40% 40% at 50% 35%, var(--accent), transparent 70%); opacity:.45; filter: blur(30px); }
.hero .big-logo{ width:96px; height:96px; object-fit:contain; margin: 0 auto 14px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.4)); animation: float 6s ease-in-out infinite; }
@keyframes float{ 50%{ transform: translateY(-5px); } }
.hero h1{ font-size: 28px; font-weight: 800; letter-spacing:-.03em; line-height:1.1; }
.hero p{ color: var(--text-2); font-size:14px; margin-top:6px; }
.pills{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px; }
.pill{ padding: 6px 12px; border-radius:999px; font-size:13px; font-weight:650; background: var(--glass-strong); box-shadow: inset 0 1px 1px -0.5px var(--rim-a); }
.pill b{ font-weight:800; }

.scoreboard{ display:grid; grid-template-columns: 1fr auto 1fr; align-items:start; gap: 8px; }
.scoreboard .tm{ display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0; }
.scoreboard .tm img{ width:72px; height:72px; object-fit:contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
.scoreboard .tm span{ font-weight:700; font-size:15px; line-height:1.15; }
.scoreboard .res{ padding-top: 16px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.scoreboard .res .num{ font-size: 46px; font-weight: 800; letter-spacing:-.02em; font-variant-numeric: tabular-nums; line-height:1; }
.scoreboard .res .num.pre{ font-size:30px; }
.scoreboard .res .stt{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color: var(--text-2); }
.scoreboard .res .stt.live{ color: var(--live); display:flex; align-items:center; gap:6px; }
.hero .info{ margin-top:18px; font-size:13px; color: var(--text-2); display:flex; justify-content:center; gap: 6px 14px; flex-wrap:wrap; }

/* timeline */
.timeline{ padding: 8px 0; border-radius: var(--r-lg); }
.ev{ display:grid; grid-template-columns: 1fr 52px 1fr; align-items:center; padding: 10px 14px; gap:8px; font-size:14px; }
.ev .min{ text-align:center; font-weight:800; font-size:13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ev .l{ text-align:right; display:flex; justify-content:flex-end; align-items:center; gap:8px; }
.ev .r{ display:flex; align-items:center; gap:8px; }
.ev .who{ display:flex; flex-direction:column; }
.ev .l .who{ align-items:flex-end; }

const cache = new Map();
async function api(path, { ttl = 60_000, fresh = false } = {}){
  const hit = cache.get(path);
  if (!fresh && hit && Date.now() - hit.t < ttl) return hit.data;
  const res = await fetch(`${API}/${path}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  cache.set(path, { t: Date.now(), data });
  return data;
}

  const diff = Math.round((new Date(d.toDateString()) - new Date(t.toDateString())) / 864e5);
  if (diff === 0) return 'Heute';
  if (diff === 1) return 'Morgen';
  if (diff === -1) return 'Gestern';
  return d.toLocaleDateString('de-DE', { weekday:'short', day:'numeric', month:'short', ...opts });
}

/* ---------- favourites ---------- */
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const favs = () => store.get('fb.favs', []);
const isFav = id => favs().some(f => f.id === id);
function toggleFav(team){
  const list = favs();
  const i = list.findIndex(f => f.id === team.id);
  if (i >= 0) list.splice(i, 1); else list.push(team);
  store.set('fb.favs', list);
  return i < 0;
}

/* ---------- accent colour (tints the background blobs) ---------- */
const DEFAULT_ACCENT = ['#0a84ff', '#bf5af2', '#30d1a0', '#ff6b3d'];
function setAccent(hex, hex2){
  const r = document.documentElement.style;
  if (!hex){
    r.setProperty('--accent', DEFAULT_ACCENT[0]);
    DEFAULT_ACCENT.forEach((c, i) => r.setProperty(`--blob-${i+1}`, c));
    return;
  }
  const c = '#' + hex.replace('#','');
  const c2 = hex2 ? '#' + hex2.replace('#','') : DEFAULT_ACCENT[1];
  // too dark/light accents get a readable fallback for text
  const lum = (() => { const n = parseInt(c.slice(1), 16); const R=(n>>16)&255,G=(n>>8)&255,B=n&255; return (0.299*R+0.587*G+0.114*B)/255; })();
  r.setProperty('--accent', lum < 0.12 || lum > 0.9 ? DEFAULT_ACCENT[0] : c);
  r.setProperty('--blob-1', c);
  r.setProperty('--blob-2', c2);
  r.setProperty('--blob-3', DEFAULT_ACCENT[0]);
  r.setProperty('--blob-4', c);
}

/* ---------- normalise an ESPN event ---------- */
function normEvent(e, slug){
  const c = e.competitions?.[0] || {};
  const status = c.status || e.status || {};
  const t = status.type || {};
  const pick = side => c.competitors?.find(x => x.homeAway === side) || {};
  const team = x => ({
    id: x.team?.id,
    name: tn(x.team?.shortDisplayName || x.team?.displayName || '—'),
    full: tn(x.team?.displayName),
    logo: x.team?.logo || x.team?.logos?.[0]?.href,
    color: x.team?.color,
    score: typeof x.score === 'object' ? x.score?.displayValue : x.score,
    winner: x.winner,
  });
  return {
    id: e.id, slug, date: e.date,
    state: t.state, name: t.name, detail: t.shortDetail || t.detail, completed: t.completed,
    clock: status.displayClock,
    home: team(pick('home')), away: team(pick('away')),
    venue: c.venue?.fullName || e.venue?.displayName,
  };
}
function statusLabel(m){
  if (m.name === 'STATUS_POSTPONED') return { txt:'Verlegt' };
  if (m.name === 'STATUS_CANCELED') return { txt:'Abgesagt' };
  if (m.state === 'in'){
    if (m.name === 'STATUS_HALFTIME') return { txt:'Halbzeit', live:true };
    return { txt: m.clock || 'Live', live:true };
  }
  if (m.state === 'post'){
    const d = (m.detail || '').toUpperCase();
    if (d.includes('PEN')) return { txt:'n. E.' };
    if (d.includes('AET')) return { txt:'n. V.' };
    return { txt:'Ende' };
  }
  return { txt: fmtDay(m.date) };
}
function matchCard(m, { showDate = false } = {}){
  const st = statusLabel(m);
  const played = m.state !== 'pre' && m.home.score != null;
  const hl = played && m.state === 'post' && m.away.winner ? 'loser' : '';
  const al = played && m.state === 'post' && m.home.winner ? 'loser' : '';
  const mid = played
    ? `<div class="score">${esc(m.home.score)} : ${esc(m.away.score)}</div>`
    : `<div class="time">${m.name === 'STATUS_POSTPONED' ? '–:–' : fmtTime(m.date)}</div>`;
  const stHtml = st.live ? `<div class="st live"><span class="pulse"></span>${esc(st.txt)}</div>` : `<div class="st">${esc(played ? st.txt : (showDate ? fmtDay(m.date) : st.txt))}</div>`;
  return `<a class="match glass flat press" href="#/match/${esc(m.slug)}/${esc(m.id)}">
    <div class="side ${hl}">${img(m.home.logo, 'logo sm', m.home.name)}<span class="nm">${esc(m.home.name)}</span></div>
    <div class="mid">${mid}${stHtml}</div>
    <div class="side away ${al}">${img(m.away.logo, 'logo sm', m.away.name)}<span class="nm">${esc(m.away.name)}</span></div>
    ${showDate && played ? `<div class="meta">${esc(fmtDay(m.date))}</div>` : ''}
  </a>`;
}

/* ---------- UI chrome helpers ---------- */
function navBar(title, { back = true, right = '' } = {}){
  return `<header class="nav" id="nav">
    ${back ? `<button class="icon-btn glass flat press" id="back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>` : `<div class="nav-spacer"></div>`}
    <div class="nav-title">${esc(title)}</div>
    ${right || `<div class="nav-spacer"></div>`}
  </header>`;
}
function seg(id, options, active){
  const i = Math.max(0, options.findIndex(o => o[0] === active));
  return `<div class="seg glass flat" id="${id}" style="--n:${options.length};--i:${i}">
    <div class="seg-thumb"></div>
    ${options.map(([k, label], j) => `<button data-k="${k}" data-i="${j}" class="${k === active ? 'on' : ''}">${esc(label)}</button>`).join('')}
  </div>`;
}
function bindSeg(id, onChange){
  const el = $('#' + id); if (!el) return;
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.classList.contains('on')) return;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    el.style.setProperty('--i', b.dataset.i);
    onChange(b.dataset.k);
  });
}
const skeleton = (n = 5, h = 64) => Array.from({ length: n }, () => `<div class="skel" style="height:${h}px"></div>`).join('');
function errorBox(err, retry = true){

}

/* ---------- League ---------- */
async function standings(slug){
  const d = await api(`v2/sports/soccer/${slug}/standings`, { ttl: 5 * 60_000 });
  const groups = (d.children || (d.standings ? [d] : [])).map(g => ({
    name: g.name,
    entries: (g.standings?.entries || []).map(e => {
      const s = {}; (e.stats || []).forEach(x => s[x.name] = x.displayValue ?? x.value);
      return {
        team: { id: e.team.id, name: tn(e.team.shortDisplayName || e.team.displayName), full: tn(e.team.displayName), en: e.team.displayName, logo: e.team.logos?.[0]?.href },
        s, note: e.note,
      };
    }).sort((a, b) => (+a.s.rank || 99) - (+b.s.rank || 99)),
  })).filter(g => g.entries.length);
  return groups;
}

      const wide = matchMedia('(min-width:560px)').matches;

    if (tab === 'teams'){
      const groups = await standings(slug);
      if (my !== token) return;
      const teams = groups.flatMap(g => g.entries.map(e => e.team)).sort((a, b) => a.name.localeCompare(b.name, 'de'));

        : emptyBox('👥', 'Keine Teams gefunden');
    }

    if (tab === 'games'){
      const base = await api(`site/v2/sports/soccer/${slug}/scoreboard`);
      if (my !== token) return;
      let cal = base.leagues?.[0]?.calendar || [];
      cal = cal.flatMap(c => typeof c === 'string' ? [c] : (c.entries || []).map(x => x.startDate || x.value)).filter(Boolean);
      const days = [...new Set(cal.map(c => c.slice(0, 10)))].sort();
      const today = new Date(); const todayKey = today.toISOString().slice(0, 10);
      let sel = state.leagueTab[slug + ':day'];
      if (!sel || !days.includes(sel)){
        // pick today, else nearest upcoming within 4 days, else most recent past day
        sel = days.find(d => d === todayKey)
          || days.find(d => d > todayKey && (new Date(d) - today) < 4 * 864e5)
          || [...days].reverse().find(d => d < todayKey)
          || days[0];
      }
      const chips = days.length ? `<div class="chips" id="dchips">${days.map(d => {
        const dt = new Date(d + 'T12:00:00');

      const loadDay = async d => {
        state.leagueTab[slug + ':day'] = d;

        list.innerHTML = skeleton(4);
        try{
          const data = d ? await api(`site/v2/sports/soccer/${slug}/scoreboard?dates=${d.replace(/-/g, '')}`) : base;
          if (my !== token) return;
          const ms = (data.events || []).map(e => normEvent(e, slug)).sort((a, b) => new Date(a.date) - new Date(b.date));
          list.innerHTML = ms.length ? `<div class="matches">${ms.map(m => matchCard(m)).join('')}</div>` : emptyBox('🗓️', 'Keine Spiele an diesem Tag');
          scheduleRefresh(ms.some(m => m.state === 'in'));
        } catch(err){ list.innerHTML = errorBox(err); }
      };
      $('#dchips')?.addEventListener('click', e => {
        const b = e.target.closest('.chip'); if (!b) return;
        $('#dchips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
        b.scrollIntoView({ inline:'center', behavior:'smooth', block:'nearest' });
        loadDay(b.dataset.d);
      });
      $('#dchips .chip.on')?.scrollIntoView({ inline:'center', block:'nearest' });
      loadDay(sel);
    }
  } catch(err){
    if (my === token) pane.innerHTML = errorBox(err);
  }
}

function openPlayer(a, team){

  const kv = [
    ['Position', POS[a.position?.name] || a.position?.displayName],

    ['Größe', cm ? `${(cm/100).toFixed(2).replace('.', ',')} m` : null],

function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').onclick = closeSheet;
(() => { // swipe down to dismiss
  let y0 = null; const s = $('#sheet');
  s.addEventListener('touchstart', e => { if (s.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive:true });
  s.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); s.style.transition = 'none'; s.style.transform = `translate(-50%, ${dy}px)`; }, { passive:true });
  s.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; s.style.transition = ''; s.style.transform = ''; y0 = null; if (dy > 90) closeSheet(); });
})();

          <a class="tm" href="#/team/${esc(slug)}/${esc(m.home.id)}">${img(m.home.logo, '', m.home.name)}<span>${esc(m.home.full || m.home.name)}</span></a>
          <div class="res">
            ${played ? `<div class="num">${esc(m.home.score ?? 0)}:${esc(m.away.score ?? 0)}</div>` : `<div class="num pre">${fmtTime(m.date)}</div>`}
            <div class="stt ${st.live ? 'live' : ''}">${st.live ? '<span class="pulse"></span>' : ''}${esc(played ? st.txt : fmtDay(m.date))}</div>
          </div>
          <a class="tm" href="#/team/${esc(slug)}/${esc(m.away.id)}">${img(m.away.logo, '', m.away.name)}<span>${esc(m.away.full || m.away.name)}</span></a>
        </div>
        <div class="info">
          ${played ? `<span>🗓 ${esc(new Date(m.date).toLocaleDateString('de-DE',{ weekday:'short', day:'numeric', month:'short' }))}, ${fmtTime(m.date)}</span>` : ''}
          ${gi.venue?.fullName ? `<span>🏟 ${esc(gi.venue.fullName)}${gi.venue.address?.city ? ', ' + esc(gi.venue.address.city) : ''}</span>` : ''}
          ${gi.attendance ? `<span>👥 ${Number(gi.attendance).toLocaleString('de-DE')}</span>` : ''}
          ${ref ? `<span>🧑‍⚖️ ${esc(ref)}</span>` : ''}
        </div>
      </section>
      ${tabs.length > 1 ? seg('mseg', tabs, state.matchTab) : ''}
      <div id="pane"></div>`;

    const homeId = m.home.id;
    const pane = k => {
      state.matchTab = k;
      const p = $('#pane');
      if (!tabs.length){ p.innerHTML = emptyBox('⏳', played ? 'Keine Details verfügbar' : 'Das Spiel hat noch nicht begonnen', played ? '' : 'Aufstellungen erscheinen kurz vor Anpfiff.'); return; }
      if (k === 'events') p.innerHTML = timeline(d.keyEvents, homeId);
      if (k === 'stats') p.innerHTML = statsView(d.boxscore.teams, homeId, m);
      if (k === 'lineups') p.innerHTML = lineups(d.rosters);
      if (k === 'stats') requestAnimationFrame(() => p.querySelectorAll('.bars i').forEach(i => i.style.width = i.dataset.w));
    };
    bindSeg('mseg', pane);
    pane(state.matchTab);
    scheduleRefresh(m.state === 'in');
  } catch(err){
    if (my === token) $('#mbody').innerHTML = errorBox(err);
  }
}

function timeline(events, homeId){
  const rows = [];
  for (const e of events){
    const t = e.type?.type || '';
    const min = e.clock?.displayValue || '';
    const side = e.team?.id === homeId ? 'l' : 'r';
    const p = e.participants || [];
    let icon = '', main = '', sub = '';
    if (t === 'halftime'){ rows.push(`<div class="ev divider">Halbzeit</div>`); continue; }
    if (t === 'end-regular-time'){ rows.push(`<div class="ev divider">Abpfiff</div>`); continue; }
    if (t.startsWith('goal') || t === 'own-goal' || t.startsWith('penalty---scored') || (e.scoringPlay && !e.shootout)){
      icon = '<span class="ic">⚽</span>';
      main = p[0]?.athlete?.displayName || 'Tor';
      sub = t === 'own-goal' ? 'Eigentor' : t.includes('penalty') ? 'Elfmeter' : (p[1] ? `Vorlage: ${p[1].athlete.displayName}` : (t.includes('header') ? 'Kopfball' : 'Tor'));
    } else if (t === 'yellow-card'){
      icon = '<span class="ic"><span class="card-y"></span></span>'; main = p[0]?.athlete?.displayName || 'Gelb'; sub = 'Gelbe Karte';
    } else if (t === 'red-card' || t.includes('red')){
      icon = '<span class="ic"><span class="card-r"></span></span>'; main = p[0]?.athlete?.displayName || 'Rot'; sub = t.includes('yellow') ? 'Gelb-Rot' : 'Rote Karte';
    } else if (t === 'substitution'){
      const mm = (e.text || '').match(/\.\s*(.+?) replaces (.+?)\.?$/);
      icon = '<span class="ic" style="font-size:13px">⇄</span>';
      main = `<span class="sub-i">↑</span> ${esc(mm ? mm[1] : (p[0]?.athlete?.displayName || ''))}`;
      sub = `<span class="sub-o">↓</span> ${esc(mm ? mm[2] : (p[1]?.athlete?.displayName || ''))}`;
      rows.push(evRow(side, min, icon, main, sub, true)); continue;
    } else continue;
    rows.push(evRow(side, min, icon, esc(main), esc(sub), true));
  }
  return rows.length ? `<div class="timeline glass">${rows.join('')}</div>` : emptyBox('⏱️', 'Noch keine Ereignisse');
}
function evRow(side, min, icon, main, sub){
  const who = `<span class="who"><b>${main}</b><small>${sub}</small></span>`;
  return `<div class="ev">
    <div class="l">${side === 'l' ? who + icon : ''}</div>
    <div class="min">${esc(min)}</div>
    <div class="r">${side === 'r' ? icon + who : ''}</div>
  </div>`;
}

function statsView(teams, homeId, m){
  const H = teams.find(t => t.team?.id === homeId) || teams[0];
  const A = teams.find(t => t !== H) || teams[1];
  const get = (t, n) => t?.statistics?.find(s => s.name === n)?.displayValue;
  const rows = [
    ['possessionPct','Ballbesitz','%'], ['totalShots','Schüsse'], ['shotsOnTarget','Schüsse aufs Tor'],
    ['wonCorners','Ecken'], ['totalPasses','Pässe'], ['accuratePasses','Angekommene Pässe'],
    ['foulsCommitted','Fouls'], ['offsides','Abseits'], ['saves','Paraden'],
    ['yellowCards','Gelbe Karten'], ['redCards','Rote Karten'],
  ].map(([n, label, unit = '']) => {
    const h = parseFloat(get(H, n)), a = parseFloat(get(A, n));
    if (isNaN(h) && isNaN(a)) return '';
    const hv = isNaN(h) ? 0 : h, av = isNaN(a) ? 0 : a, tot = hv + av || 1;
    return `<div class="stat">
      <div class="top"><span>${hv}${unit}</span><span>${label}</span><span>${av}${unit}</span></div>
      <div class="bars"><div><i class="hb" style="width:0" data-w="${hv/tot*100}%"></i></div><div><i class="ab" style="width:0" data-w="${av/tot*100}%"></i></div></div>
    </div>`;
  }).join('');
  const hc = m.home.color ? '#' + m.home.color : '';
  let ac = m.away.color ? '#' + m.away.color : '';
  if (ac && hc && ac.toLowerCase() === hc.toLowerCase()) ac = '#8e8e93';
  return `<div class="stats glass" style="${hc ? `--home-c:${esc(hc)};` : ''}${ac ? `--away-c:${esc(ac)}` : ''}">
    <div class="stat" style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:var(--text-2)">
      <span style="display:flex;gap:8px;align-items:center">${img(m.home.logo,'logo xs')}${esc(m.home.name)}</span>
      <span style="display:flex;gap:8px;align-items:center">${esc(m.away.name)}${img(m.away.logo,'logo xs')}</span>
    </div>${rows}</div>`;
}

function lineups(rosters){
  return rosters.filter(r => (r.roster || []).length).map(r => {
    const starters = r.roster.filter(p => p.starter);
    const bench = r.roster.filter(p => !p.starter);
    const row = p => `<div class="row">
      <div class="jersey">${esc(p.jersey || '–')}</div>
      <div class="grow"><div class="t1">${esc(p.athlete?.displayName)}</div><div class="t2">${esc(POS_DETAIL[p.position?.name] || POS[p.position?.name] || p.position?.displayName || '')}</div></div>
      ${p.subbedOut ? '<span class="sub-o" title="ausgewechselt">↓</span>' : ''}${p.subbedIn ? '<span class="sub-i" title="eingewechselt">↑</span>' : ''}
    </div>`;
    return `<div class="lineup-head">${img(r.team?.logos?.[0]?.href || r.team?.logo, 'logo sm', r.team?.displayName)}${esc(tn(r.team?.displayName))}${r.formation ? `<span class="form">${esc(r.formation)}</span>` : ''}</div>
      <div class="list glass">${starters.map(row).join('')}</div>
      ${bench.length ? `<div class="group-title" style="margin-left:8px">Bank</div><div class="list glass">${bench.map(row).join('')}</div>` : ''}`;
  }).join('');
}

/* ---------- Today (all leagues) ---------- */
async function renderToday(fresh = false){
  setAccent();
  const my = ++token;
  const base = new Date(); base.setHours(12, 0, 0, 0);
  const days = Array.from({ length: 9 }, (_, i) => { const d = new Date(base); d.setDate(d.getDate() + i - 4); return d; });
  const sel = days[4 + state.todayOffset] || days[4];
  if (!fresh){
    view.innerHTML = `<div class="view">
      ${navBar('Spiele', { back:false })}
      <h1 class="large-title">Spiele</h1>
      <p class="subtitle">Alle Ligen auf einen Blick</p>
      <div class="chips" id="tchips">${days.map((d, i) => `
        <button class="chip glass flat ${i === 4 + state.todayOffset ? 'on' : ''}" data-o="${i - 4}">
          <small>${i === 4 ? 'Heute' : d.toLocaleDateString('de-DE',{ weekday:'short' })}</small>${d.toLocaleDateString('de-DE',{ day:'numeric', month:'short' })}
        </button>`).join('')}</div>
      <div id="tlist">${skeleton(6)}</div>
    </div>`;
    $('#tchips').onclick = e => {
      const b = e.target.closest('.chip'); if (!b) return;
      state.todayOffset = +b.dataset.o; renderToday();
    };
    $('#tchips .chip.on')?.scrollIntoView({ inline:'center', block:'nearest' });
  }
  const key = ymd(sel);
  const results = await Promise.allSettled(LEAGUES.map(L =>
    api(`site/v2/sports/soccer/${L.slug}/scoreboard?dates=${key}`, { fresh }).then(d => ({ L, ms: (d.events || []).map(e => normEvent(e, L.slug)) }))
  ));
  if (my !== token) return;
  const ok = results.filter(r => r.status === 'fulfilled').map(r => r.value).filter(x => x.ms.length);
  if (!ok.length){
    $('#tlist').innerHTML = results.every(r => r.status === 'rejected') ? errorBox(results[0].reason) : emptyBox('🗓️', 'Keine Spiele an diesem Tag', 'Wähle oben einen anderen Tag.');
    return;
  }
  const all = ok.flatMap(x => x.ms);
  const live = all.filter(m => m.state === 'in');
  const favIds = new Set(favs().map(f => f.id));
  const mine = all.filter(m => favIds.has(m.home.id) || favIds.has(m.away.id));
  const sortT = (a, b) => new Date(a.date) - new Date(b.date);
  $('#tlist').innerHTML = `
    ${live.length ? `<div class="pills" style="justify-content:flex-start;margin:0 4px 6px"><span class="pill" style="color:var(--live);display:flex;align-items:center;gap:6px"><span class="pulse"></span><b>${live.length}</b> live</span></div>` : ''}
    ${mine.length ? `<div class="league-head">⭐ Meine Teams<span class="cnt">${mine.length}</span></div><div class="matches">${mine.sort(sortT).map(m => matchCard(m)).join('')}</div>` : ''}
    ${ok.map(({ L, ms }) => `
      <a class="league-head" href="#/league/${L.slug}"><img src="${LOGO(L.logo)}" alt="" onerror="this.style.visibility='hidden'">${esc(L.name)}<span class="cnt">${ms.length} ${chev}</span></a>
      <div class="matches">${ms.sort(sortT).map(m => matchCard(m)).join('')}</div>`).join('')}`;
  scheduleRefresh(live.length > 0);
}

/* ---------- Search ---------- */
let teamIndex = null;
async function buildIndex(){
  if (teamIndex) return teamIndex;
  const res = await Promise.allSettled(LEAGUES.filter(l => !l.cup).map(L => standings(L.slug).then(gs => ({ L, gs }))));
  const seen = new Map();
  res.filter(r => r.status === 'fulfilled').forEach(({ value: { L, gs } }) => gs.forEach(g => g.entries.forEach(e => {
    // domestic league wins over European cup as "home" league
    if (!seen.has(e.team.id) || seen.get(e.team.id).L.group === 'eu') seen.set(e.team.id, { ...e.team, L });
  })));
  teamIndex = [...seen.values()];
  return teamIndex;
}
function renderSearch(){
  setAccent();
  const my = ++token;
  view.innerHTML = `<div class="view">
    ${navBar('Suche', { back:false })}
    <h1 class="large-title">Suche</h1>
    <label class="search glass flat ${state.search ? 'has' : ''}" id="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Teams & Ligen" autocomplete="off" value="${esc(state.search)}">
      <button class="clear" id="qclear" aria-label="Löschen">✕</button>
    </label>
    <div id="sres"></div>
  </div>`;
  const q = $('#q'), out = $('#sres');
  const run = async () => {
    const s = norm(q.value.trim());
    state.search = q.value;
    $('#sbox').classList.toggle('has', !!q.value);
    if (!s){
      out.innerHTML = `<div class="section-h"><h2>Beliebt</h2></div><div class="team-grid">${
        [['ger.1','132','Bayern München','https://a.espncdn.com/i/teamlogos/soccer/500/132.png'],
         ['ger.1','124','Dortmund','https://a.espncdn.com/i/teamlogos/soccer/500/124.png'],
         ['esp.1','86','Real Madrid','https://a.espncdn.com/i/teamlogos/soccer/500/86.png'],
         ['esp.1','83','Barcelona','https://a.espncdn.com/i/teamlogos/soccer/500/83.png'],
         ['eng.1','382','Man City','https://a.espncdn.com/i/teamlogos/soccer/500/382.png'],
         ['eng.1','364','Liverpool','https://a.espncdn.com/i/teamlogos/soccer/500/364.png']]
        .map(([sl, id, n, l]) => `<a class="team-tile glass flat press" href="#/team/${sl}/${id}">${img(l,'',n)}<span>${n}</span></a>`).join('')}</div>`;
      return;
    }
    const lg = LEAGUES.filter(l => norm(l.name + ' ' + l.country).includes(s));
    out.innerHTML = skeleton(4, 60);
    let teams = [];
    try { teams = (await buildIndex()).filter(t => norm(t.full + ' ' + t.name + ' ' + t.en).includes(s)).slice(0, 40); }
    catch(err){ if (my === token) out.innerHTML = errorBox(err); return; }
    if (my !== token || norm(q.value.trim()) !== s) return;
    if (!lg.length && !teams.length){ out.innerHTML = emptyBox('🔍', 'Keine Treffer', `Nichts gefunden für „${q.value}“.`); return; }
    out.innerHTML = `
      ${lg.length ? `<div class="section-h"><h2>Ligen</h2></div><div class="list glass">${lg.map(l => `
        <a class="row" href="#/league/${l.slug}"><div class="logo-wrap"><img class="logo" src="${LOGO(l.logo)}" alt=""></div>
        <div class="grow"><div class="t1">${esc(l.name)}</div><div class="t2">${esc(l.country)}</div></div>${chev}</a>`).join('')}</div>` : ''}
      ${teams.length ? `<div class="section-h"><h2>Teams</h2><span>${teams.length}</span></div><div class="list glass">${teams.map(t => `
        <a class="row" href="#/team/${t.L.slug}/${esc(t.id)}">${img(t.logo, 'logo', t.name)}
        <div class="grow"><div class="t1">${esc(t.full)}</div><div class="t2">${esc(t.L.name)} · ${esc(t.L.country)}</div></div>${chev}</a>`).join('')}</div>` : ''}`;
  };
  let deb;
  q.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(run, 160); });
  $('#qclear').onclick = e => { e.preventDefault(); q.value = ''; run(); q.focus(); };
  run();
  buildIndex().catch(() => {}); // warm up
}

/* ---------- Favourites ---------- */
function renderFavs(){
  setAccent();
  ++token;
  const f = favs();
  view.innerHTML = `<div class="view">
    ${navBar('Favoriten', { back:false })}
    <h1 class="large-title">Favoriten</h1>
    <p class="subtitle">Deine Teams – tippe auf ★ auf einer Teamseite, um sie hier zu sammeln.</p>
    ${f.length ? `<div class="list glass">${f.map(t => `
      <a class="row" href="#/team/${esc(t.slug)}/${esc(t.id)}">${img(t.logo, 'logo', t.name)}
        <div class="grow"><div class="t1">${esc(t.name)}</div><div class="t2">${esc(leagueBy(t.slug).name)}</div></div>${chev}</a>`).join('')}</div>`
      : `${emptyBox('⭐', 'Noch keine Favoriten', 'Suche dein Lieblingsteam und markiere es mit dem Stern.')}
         <div style="text-align:center"><a class="btn" href="#/search">Team suchen</a></div>`}
  </div>`;
}

/* ---------- toast ---------- */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'glass strong';
  t.textContent = msg;
  Object.assign(t.style, { position:'fixed', left:'50%', top:'calc(env(safe-area-inset-top,0px) + 70px)', transform:'translate(-50%,-20px)', opacity:'0', padding:'12px 20px', borderRadius:'999px', fontWeight:'650', fontSize:'14px', zIndex:120, transition:'all .45s var(--spring)' });
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translate(-50%,0)'; });
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%,-20px)'; setTimeout(() => t.remove(), 500); }, 1800);
}

/* =============================================================
   ROUTER
   ============================================================= */
let lastTab = 0;
function scheduleRefresh(on){
  clearTimeout(refreshTimer);
  if (on) refreshTimer = setTimeout(() => route(true, true), 30_000);
}
function setTab(i){
  const lens = $('#lens');
  if (+lens.style.getPropertyValue('--i') !== i){
    lens.classList.remove('squish'); void lens.offsetWidth; lens.classList.add('squish');
  }
  lens.style.setProperty('--i', i);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', +t.dataset.tab === i));
}
function route(fresh = false, silent = false){
  clearTimeout(refreshTimer);
  closeSheet();
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').map(decodeURIComponent);
  const [r, a, b] = parts;
  if (fresh && !silent) cache.clear();
  if (silent) [...cache.keys()].forEach(k => /scoreboard|summary/.test(k) && cache.delete(k));
  if (!silent) window.scrollTo({ top: 0 });
  switch (r){
    case 'today':  lastTab = 1; setTab(1); renderToday(silent); break;
    case 'search': lastTab = 2; setTab(2); renderSearch(); break;
    case 'favs':   lastTab = 3; setTab(3); renderFavs(); break;
    case 'league': setTab(lastTab); renderLeague(a); break;
    case 'team':   setTab(lastTab); renderTeam(a, b); break;
    case 'match':  setTab(lastTab); renderMatch(a, b, silent); break;
    default:       lastTab = 0; setTab(0); renderHome();
  }
  bindChrome();
}
function bindChrome(){
  const back = $('#back');
  if (back) back.onclick = () => { if (history.length > 1) history.back(); else location.hash = '#/'; };
}
window.addEventListener('hashchange', () => route());
window.addEventListener('scroll', () => { $('#nav')?.classList.toggle('scrolled', scrollY > 30); }, { passive:true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
route();
setTimeout(() => { const s = $('#splash'); s.classList.add('gone'); setTimeout(() => s.remove(), 900); }, 650);
</script>
